  const personRow = allStandings.find(s => s.id === pid);
  const seasonRank = personRow ? personRow.rank : null;
  const personAvg = personRow ? personRow.average : 0;
  const avgAll = overallAverage();
  const avgDiff = personAvg - avgAll;
  const accuracy = accuracyPct(pid);
  const teamStats = teamStatsForPerson(pid);
  const streak = bestStreak(pid);
  const tournamentRanks = tournamentRanksForPerson(pid).slice().sort((a, b) => a.rank - b.rank || b.points - a.points);
  const weeklyTop3 = weeklyTop3ForPerson(pid);
  const monthlyTop3 = monthlyTop3ForPerson(pid);
  const { counts: distCounts, total: distTotal } = personDistribution(pid);
  const club = state.clubs[pid];
  const tpi = teamProfileInfo(pid);

  // ---- رنگ‌ها و فونت‌ها ----
  const GOLD = "#EBD27A", GOLD_DK = "#B9902E", DIM = "#9DB0A3", LIGHT = "#F4F8F4";
  const GREEN = "#7FD1A3", RED = "#EA8D75", BLUE = "#94BCE6";
  const PANEL_BG = "#121D16", PANEL_BORDER = "#26392D", CHIP_BG = "#0C150F";
  const FONTF = "Vazirmatn, Tahoma, sans-serif";
  const F = (px, bold) => `${bold ? "bold " : ""}${px}px ${FONTF}`;
  const MED = { 1: ["#F8E58B", "#C99A2E", "#3A2A00"], 2: ["#EEF2F6", "#9AA7B0", "#1F2A30"], 3: ["#EBB98C", "#B06B34", "#2E1704"] };

  function roundRectPath(ctx, x, y, w, h, r){
    if(typeof r === "number") r = { tl:r, tr:r, br:r, bl:r };
    ctx.beginPath();
    ctx.moveTo(x + r.tl, y);
    ctx.lineTo(x + w - r.tr, y);
    ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
    ctx.lineTo(x + w, y + h - r.br);
    ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
    ctx.lineTo(x + r.bl, y + h);
    ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
    ctx.lineTo(x, y + r.tl);
    ctx.arcTo(x, y, x + r.tl, y, r.tl);
    ctx.closePath();
  }

  // ---- بخش‌ها ----
  const sections = [];
  if(tpi){
    const n = toPersianDigits;
    const dl = tpi.duel;
    const lastTxt = tpi.last
      ? `آخرین دوئل (هفته ${n(tpi.last.week)}): ${tpi.last.res > 0 ? "برد" : tpi.last.res < 0 ? "باخت" : "مساوی"} مقابل ${tpi.last.opp} (${tpi.last.my} - ${tpi.last.their})`
      : (dl ? `پوئن مثبت ${fmtS(dl.pf)} • پوئن منفی ${fmtS(dl.pa)}` : "");
    sections.push({ icon: "👥", title: `تیم شما: ${tpi.isCap ? "👑 " : ""}${tpi.tk.name}`, type: "grp", full: true, cards: [
      { head: "الماس لیگ", rank: tpi.tk.rank, of: tpi.teamCount, value: fmtS(tpi.tk.total),
        sub: `سهم شما ${fmtS(tpi.myPts)} امتیاز (${n(tpi.share)}٪)`, foot: `رتبه‌ی شما در تیم: ${n(tpi.myRank)} از ${n(tpi.size)}` },
      dl ? { head: "هُنگوکاپ", rank: dl.rank, of: tpi.duelCount, value: n(dl.pts),
        sub: `${n(dl.w)} برد • ${n(dl.d)} مساوی • ${n(dl.l)} باخت`, foot: lastTxt, win: tpi.last ? tpi.last.res : null } : null
    ].filter(Boolean) });
  }
  sections.push({ icon: "📈", title: "آمار کلی", type: "grid", items: [
    { label: "دقت پیش‌بینی", value: `${toPersianDigits(accuracy)}٪`, color: GOLD },
    { label: "رکورد متوالی", value: `${toPersianDigits(streak)} بازی`, color: GREEN },
    { label: "میانگین شما", value: toPersianDigits(personAvg.toFixed(1)), color: LIGHT },
    { label: "نسبت به میانگین کل", value: `${avgDiff >= 0 ? "▲" : "▼"} ${toPersianDigits(Math.abs(avgDiff).toFixed(1))}`, color: avgDiff >= 0 ? GREEN : RED },
  ]});

  if(teamStats){
    const teamRows = [{ label: "بهترین تیم برای پیش‌بینی", name: teamStats.best.name, value: toPersianDigits(teamStats.best.avg.toFixed(1)), color: GREEN, dot: GREEN }];
    if(!teamStats.sameTeam) teamRows.push({ label: "بدترین تیم برای پیش‌بینی", name: teamStats.worst.name, value: toPersianDigits(teamStats.worst.avg.toFixed(1)), color: RED, dot: RED });
    sections.push({ icon: "⚽", title: "بهترین و بدترین تیم", type: "teams", items: teamRows });
  }

  if(tournamentRanks.length){
    const MAXT = 8;
    const items = tournamentRanks.slice(0, MAXT).map(tr => ({ rank: tr.rank, name: tr.tournament, points: tr.points, total: tr.total, leader: tr.leader }));
    if(tournamentRanks.length > MAXT) items.push({ more: true, name: `و ${toPersianDigits(tournamentRanks.length - MAXT)} تورنمنت دیگر` });
    sections.push({ icon: "🏆", title: "عملکرد در تورنمنت‌ها", type: "tourn", full: true, items });
  }

  sections.push({ icon: "📊", title: `توزیع امتیازها در ${toPersianDigits(distTotal)} مسابقه`, type: "bars", items: [
    { label: "دقیق (۲۰)", value: distCounts[20] || 0, color: GOLD },
    { label: "نزدیک (۱۳)", value: distCounts[13] || 0, color: GREEN },
    { label: "معمولی (۸)", value: distCounts[8] || 0, color: BLUE },
    { label: "بدون امتیاز", value: distCounts[0] || 0, color: DIM },
  ]});

  if(weeklyTop3.length){
    const shown = weeklyTop3.slice(0, 5);
    const items = shown.map(w => ({ medal: w.rank === 1 ? "🥇" : w.rank === 2 ? "🥈" : "🥉", name: w.label, value: `${toPersianDigits(w.points)} امتیاز`, gold: true }));
    if(weeklyTop3.length > 5) items.push({ medal: "…", name: `و ${toPersianDigits(weeklyTop3.length - 5)} مورد دیگر`, value: "", gold: false, dim: true });
    sections.push({ icon: "📅", title: `افتخارات هفتگی — ${toPersianDigits(weeklyTop3.length)} بار در ۳ نفر برتر`, type: "list", items });
  }

  if(monthlyTop3.length){
    const shown = monthlyTop3.slice(0, 5);
    const items = shown.map(m => ({ medal: m.rank === 1 ? "🥇" : m.rank === 2 ? "🥈" : "🥉", name: m.month, value: `${toPersianDigits(m.points)} امتیاز`, gold: true }));
    if(monthlyTop3.length > 5) items.push({ medal: "…", name: `و ${toPersianDigits(monthlyTop3.length - 5)} مورد دیگر`, value: "", gold: false, dim: true });
    sections.push({ icon: "🗓", title: `افتخارات ماهانه — ${toPersianDigits(monthlyTop3.length)} بار در ۳ نفر برتر`, type: "list", items });
  }

  // ---- ابعاد ----
  const width = 1080;
  const OUTER = 24, CARD_PAD = 20, SEC_GAP = 18, COL_GAP = 20, TITLE_H = 34;
  const headerH = 282, footerH = 64;
  const halfW = (width - OUTER * 2 - COL_GAP) / 2;
  const fullW = width - OUTER * 2;
  const TROW = 84, TMORE = 46;

  function contentH(sec){
    if(sec.type === "grid"){ const rows = Math.ceil(sec.items.length / 2); return rows * 82 + (rows - 1) * 14; }
    if(sec.type === "teams") return sec.items.length * 68;
    if(sec.type === "bars") return sec.items.length * 48;
    if(sec.type === "list") return sec.items.length * 48;
    if(sec.type === "grp") return 158;
    if(sec.type === "tourn") return sec.items.reduce((s, it) => s + (it.more ? TMORE : TROW), 0);
    return 0;
  }
  sections.forEach(sec => { sec.h = CARD_PAD * 2 + TITLE_H + 14 + contentH(sec); });

  const colH = [0, 0];
  sections.forEach(sec => {
    if(sec.full){
      const start = Math.max(colH[0], colH[1]);
      sec.col = -1; sec.y = headerH + start;
      colH[0] = colH[1] = start + sec.h + SEC_GAP;
    }else{
      const col = colH[0] <= colH[1] ? 0 : 1;
      sec.col = col; sec.y = headerH + colH[col];
      colH[col] += sec.h + SEC_GAP;
    }
  });
  const height = headerH + Math.max(colH[0], colH[1]) + footerH;

  // ---- بوم ----
  const canvas = document.createElement("canvas");
  const scale = 3;
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.direction = "rtl";
  ctx.textBaseline = "alphabetic";

  const fit = (t, max, size, bold) => { let z = size; do { ctx.font = F(z, bold); z--; } while(ctx.measureText(t).width > max && z > 10); };

  // پس‌زمینه
  const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
  bgGrad.addColorStop(0, "#1D3224");
  bgGrad.addColorStop(0.3, "#14231A");
  bgGrad.addColorStop(1, "#0A120D");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, width, height);
  // راه‌راه چمن
  for(let i = 0; i < width; i += 120){ ctx.fillStyle = "rgba(255,255,255,0.014)"; ctx.fillRect(i, 0, 60, height); }
  // دایره و خط وسط زمین پشت هدر
  ctx.strokeStyle = "rgba(255,255,255,0.055)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(width / 2, 130, 170, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 130); ctx.lineTo(width, 130); ctx.stroke();

  const glow = (gx, gy, rr, col) => {
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, rr);
    g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(gx - rr, gy - rr, rr * 2, rr * 2);
  };
  glow(width / 2, 90, 520, "rgba(235,210,122,0.20)");
  glow(width, 0, 360, "rgba(127,209,163,0.09)");
  glow(0, height, 420, "rgba(235,210,122,0.07)");

  // نوار طلایی بالا
  const topBar = ctx.createLinearGradient(0, 0, width, 0);
  topBar.addColorStop(0, "rgba(235,210,122,0)"); topBar.addColorStop(0.5, "rgba(235,210,122,0.95)"); topBar.addColorStop(1, "rgba(235,210,122,0)");
  ctx.fillStyle = topBar; ctx.fillRect(0, 0, width, 5);

  // کادر کارت
  roundRectPath(ctx, 2, 2, width - 4, height - 4, 24);
  ctx.strokeStyle = "rgba(235,210,122,0.38)"; ctx.lineWidth = 2; ctx.stroke();

  const cx = width / 2;

  // نام (بزرگ)
  ctx.textAlign = "center"; ctx.fillStyle = LIGHT;
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 10;
  fit(person.name, width - 120, 76, true);
  ctx.fillText(person.name, cx, 100);
  ctx.shadowBlur = 0;
  if(club && club.name){
    ctx.fillStyle = DIM; ctx.font = F(20, false);
    ctx.fillText(club.name, cx, 134);
  }

  // دو پیل بزرگ: امتیاز کل / رتبه فصل
  const pillY = 156, pillH = 88;
  const totalTxt = `🏆 ${toPersianDigits(total)} امتیاز`;
  const rankTxt = seasonRank ? `رتبه ${toPersianDigits(seasonRank)} از ${toPersianDigits(allStandings.length)}` : "بدون رتبه";
  let fs1 = 48, fs2 = 44, w1, w2;
  const gapP = 22;
  do{
    ctx.font = F(fs1, true); w1 = ctx.measureText(totalTxt).width + 84;
    ctx.font = F(fs2, true); w2 = ctx.measureText(rankTxt).width + 76;
    if(w1 + w2 + gapP <= width - 70) break;
    fs1 -= 2; fs2 -= 2;
  }while(fs1 > 24);
  const allW = w1 + w2 + gapP;
  let px = cx - allW / 2;

  ctx.save();
  ctx.shadowColor = "rgba(235,210,122,0.55)"; ctx.shadowBlur = 20;
  roundRectPath(ctx, px, pillY, w1, pillH, pillH / 2);
  const pg = ctx.createLinearGradient(px, 0, px + w1, 0);
  pg.addColorStop(0, "#F8E58B"); pg.addColorStop(1, GOLD_DK);
  ctx.fillStyle = pg; ctx.fill();
  ctx.restore();
  ctx.fillStyle = "#1B2116"; ctx.font = F(fs1, true); ctx.textAlign = "center";
  ctx.fillText(totalTxt, px + w1 / 2, pillY + pillH / 2 + fs1 * 0.34);

  px += w1 + gapP;
  roundRectPath(ctx, px, pillY, w2, pillH, pillH / 2);
  ctx.fillStyle = "rgba(235,210,122,0.1)"; ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3.5; ctx.stroke();
  ctx.fillStyle = GOLD; ctx.font = F(fs2, true);
  ctx.fillText(rankTxt, px + w2 / 2, pillY + pillH / 2 + fs2 * 0.34);

  // جداکننده‌ی هدر
  const dg = ctx.createLinearGradient(OUTER, 0, width - OUTER, 0);
  dg.addColorStop(0, "rgba(235,210,122,0)"); dg.addColorStop(0.5, "rgba(235,210,122,0.5)"); dg.addColorStop(1, "rgba(235,210,122,0)");
  ctx.strokeStyle = dg; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(OUTER, headerH - 10); ctx.lineTo(width - OUTER, headerH - 10); ctx.stroke();

  // ---- پنل‌ها ----
  sections.forEach(sec => {
    const full = sec.col === -1;
    const x0 = full ? OUTER : OUTER + sec.col * (halfW + COL_GAP), w0 = full ? fullW : halfW, h0 = sec.h, y = sec.y;

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
    roundRectPath(ctx, x0, y, w0, h0, 18);
    const pgr = ctx.createLinearGradient(x0, y, x0, y + h0);
    pgr.addColorStop(0, "#17251C"); pgr.addColorStop(1, PANEL_BG);
    ctx.fillStyle = pgr; ctx.fill();
    ctx.restore();
    roundRectPath(ctx, x0, y, w0, h0, 18);
    ctx.strokeStyle = full ? "rgba(235,210,122,0.45)" : PANEL_BORDER; ctx.lineWidth = full ? 1.8 : 1.2; ctx.stroke();
    roundRectPath(ctx, x0, y, w0, 4, { tl:18, tr:18, br:0, bl:0 });
    ctx.fillStyle = full ? "rgba(235,210,122,0.8)" : "rgba(235,210,122,0.5)"; ctx.fill();

    // عنوان
    ctx.textAlign = "right"; ctx.fillStyle = GOLD;
    fit(`${sec.icon} ${sec.title}`, w0 - CARD_PAD * 2, full ? 24 : 20, true);
    ctx.fillText(`${sec.icon} ${sec.title}`, x0 + w0 - CARD_PAD, y + CARD_PAD + 22);

    const contentY = y + CARD_PAD + TITLE_H + 14;
    const iX0 = x0 + CARD_PAD, iX1 = x0 + w0 - CARD_PAD;

    if(sec.type === "grid"){
      const colW = (iX1 - iX0 - 14) / 2;
      sec.items.forEach((it, i) => {
        const col = i % 2, row = Math.floor(i / 2);
        const chx = iX1 - col * (colW + 14) - colW, chy = contentY + row * 96;
        roundRectPath(ctx, chx, chy, colW, 82, 14);
        ctx.fillStyle = CHIP_BG; ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1; ctx.stroke();
        ctx.textAlign = "center"; ctx.fillStyle = DIM; ctx.font = F(15, false);
        ctx.fillText(it.label, chx + colW / 2, chy + 28);
        ctx.fillStyle = it.color; fit(it.value, colW - 20, 30, true);
        ctx.fillText(it.value, chx + colW / 2, chy + 65);
      });
    }else if(sec.type === "teams"){
      sec.items.forEach((it, i) => {
        const rowY = contentY + i * 68 + 14;
        ctx.beginPath(); ctx.arc(iX1 - 8, rowY + 8, 8, 0, Math.PI * 2); ctx.fillStyle = it.dot; ctx.fill();
        ctx.textAlign = "right"; ctx.fillStyle = DIM; ctx.font = F(15, false);
        ctx.fillText(it.label, iX1 - 26, rowY + 4);
        ctx.fillStyle = LIGHT; fit(it.name, w0 - CARD_PAD * 2 - 110, 22, true);
        ctx.fillText(it.name, iX1 - 26, rowY + 34);
        ctx.textAlign = "left"; ctx.fillStyle = it.color; ctx.font = F(24, true);
        ctx.fillText(it.value, iX0, rowY + 34);
      });
    }else if(sec.type === "grp"){
      const cw = (iX1 - iX0 - 18) / sec.cards.length, ch = 152;
      sec.cards.forEach((c, i) => {
        const cx1 = iX1 - i * (cw + 18), cx0 = cx1 - cw, top3 = c.rank <= 3;
        roundRectPath(ctx, cx0, contentY, cw, ch, 18);
        ctx.fillStyle = CHIP_BG; ctx.fill();
        if(top3){ roundRectPath(ctx, cx0, contentY, cw, ch, 18); const rg = ctx.createLinearGradient(cx1, 0, cx0, 0); rg.addColorStop(0, "rgba(235,210,122,0.15)"); rg.addColorStop(1, "rgba(235,210,122,0.02)"); ctx.fillStyle = rg; ctx.fill(); }
        roundRectPath(ctx, cx0, contentY, cw, ch, 18);
        ctx.strokeStyle = top3 ? "rgba(235,210,122,0.6)" : "rgba(255,255,255,0.08)"; ctx.lineWidth = top3 ? 1.8 : 1.2; ctx.stroke();
        // عنوان کوچک
        ctx.textAlign = "right"; ctx.fillStyle = GOLD; ctx.font = F(17, true);
        ctx.fillText(c.head, cx1 - 22, contentY + 30);
        // دایره‌ی رتبه
        const [c1, c2, ink] = MED[c.rank] || ["#3C7A55", "#285038", "#EAF4EC"];
        const my = contentY + 80, gcg = ctx.createLinearGradient(0, my - 34, 0, my + 34);
        gcg.addColorStop(0, c1); gcg.addColorStop(1, c2);
        ctx.save(); if(top3){ ctx.shadowColor = "rgba(235,210,122,0.45)"; ctx.shadowBlur = 12; }
        ctx.beginPath(); ctx.arc(cx1 - 56, my, 34, 0, Math.PI * 2); ctx.fillStyle = gcg; ctx.fill(); ctx.restore();
        ctx.textAlign = "center"; ctx.fillStyle = ink; ctx.font = F(36, true);
        ctx.fillText(toPersianDigits(c.rank), cx1 - 56, my + 13);
        ctx.fillStyle = DIM; ctx.font = F(13, false);
        ctx.fillText(`از ${toPersianDigits(c.of)} تیم`, cx1 - 56, my + 56);
        // امتیاز بزرگ
        ctx.textAlign = "right"; ctx.fillStyle = top3 ? "#F8E58B" : LIGHT; fit(c.value, 150, 44, true);
        ctx.fillText(c.value, cx1 - 112, my + 6);
        ctx.fillStyle = DIM; ctx.font = F(16, false);
        ctx.fillText("امتیاز", cx1 - 112, my + 30);
        // توضیح
        ctx.textAlign = "left"; ctx.fillStyle = LIGHT; fit(c.sub, cw - 330, 18, true);
        ctx.fillText(c.sub, cx0 + 22, my + 4);
        if(c.foot){
          ctx.fillStyle = c.win > 0 ? GREEN : c.win < 0 ? RED : DIM;
          fit(c.foot, cw - 330, 15, false);
          ctx.fillText(c.foot, cx0 + 22, my + 32);
        }
      });
    }else if(sec.type === "tourn"){
      let ry = contentY;
      const innerW = iX1 - iX0;
      sec.items.forEach(it => {
        if(it.more){
          ctx.textAlign = "center"; ctx.fillStyle = DIM; ctx.font = F(17, false);
          ctx.fillText(it.name, (iX0 + iX1) / 2, ry + 26);
          ry += TMORE; return;
        }
        const top3 = it.rank <= 3, rh = TROW - 12;
        // پس‌زمینه‌ی ردیف
        roundRectPath(ctx, iX0, ry, innerW, rh, 18);
        if(top3){
          const rg = ctx.createLinearGradient(iX1, 0, iX0, 0);
          rg.addColorStop(0, "rgba(235,210,122,0.16)"); rg.addColorStop(1, "rgba(235,210,122,0.03)");
          ctx.fillStyle = CHIP_BG; ctx.fill();
          roundRectPath(ctx, iX0, ry, innerW, rh, 18); ctx.fillStyle = rg; ctx.fill();
          roundRectPath(ctx, iX0, ry, innerW, rh, 18); ctx.strokeStyle = "rgba(235,210,122,0.6)"; ctx.lineWidth = 1.8; ctx.stroke();
        }else{
          ctx.fillStyle = CHIP_BG; ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.07)"; ctx.lineWidth = 1.2; ctx.stroke();
        }
        const midY = ry + rh / 2;
        // دایره‌ی رتبه
        const [c1, c2, ink] = MED[it.rank] || ["#3C7A55", "#285038", "#EAF4EC"];
        const cg = ctx.createLinearGradient(0, midY - 30, 0, midY + 30);
        cg.addColorStop(0, c1); cg.addColorStop(1, c2);
        ctx.save();
        if(top3){ ctx.shadowColor = "rgba(235,210,122,0.45)"; ctx.shadowBlur = 12; }
        ctx.beginPath(); ctx.arc(iX1 - 42, midY, 29, 0, Math.PI * 2); ctx.fillStyle = cg; ctx.fill();
        ctx.restore();
        ctx.textAlign = "center"; ctx.fillStyle = ink; ctx.font = F(32, true);
        ctx.fillText(toPersianDigits(it.rank), iX1 - 42, midY + 12);
        // نام تورنمنت
        const nameX = iX1 - 90;
        ctx.textAlign = "right"; ctx.fillStyle = top3 ? "#F8E58B" : LIGHT;
        fit(it.name, 380, 27, true);
        ctx.fillText(it.name, nameX, midY - 4);
        // زیرنویس
        const gap = (it.leader || 0) - it.points;
        const sub = it.rank === 1
          ? `🥇 نفر اول از ${toPersianDigits(it.total)} نفر`
          : `رتبه ${toPersianDigits(it.rank)} از ${toPersianDigits(it.total)} نفر — ${toPersianDigits(gap)} امتیاز تا نفر اول`;
        ctx.fillStyle = DIM; fit(sub, 400, 16, false);
        ctx.fillText(sub, nameX, midY + 24);
        // نوار نسبت به نفر اول
        const bx1 = iX1 - 90 - 400, bx0 = iX0 + 170, bw = Math.max(40, bx1 - bx0), bh = 14, by = midY - bh / 2;
        roundRectPath(ctx, bx0, by, bw, bh, 7); ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fill();
        const ratio = it.leader > 0 ? Math.max(0.04, Math.min(1, it.points / it.leader)) : 1;
        const fw = bw * ratio;
        roundRectPath(ctx, bx1 - fw, by, fw, bh, 7);
        const bg2 = ctx.createLinearGradient(bx1 - fw, 0, bx1, 0);
        const barCol = top3 ? ["#B9902E", "#F8E58B"] : ["#2D8659", "#7FD1A3"];
        bg2.addColorStop(0, barCol[0]); bg2.addColorStop(1, barCol[1]);
        ctx.fillStyle = bg2; ctx.fill();
        // امتیاز
        ctx.textAlign = "left"; ctx.fillStyle = top3 ? "#F8E58B" : LIGHT; fit(toPersianDigits(it.points), 130, 38, true);
        ctx.fillText(toPersianDigits(it.points), iX0 + 24, midY + 3);
        ctx.fillStyle = DIM; ctx.font = F(15, false);
        ctx.fillText("امتیاز", iX0 + 24, midY + 24);
        ry += TROW;
      });
    }else if(sec.type === "bars"){
      const max = Math.max(1, ...sec.items.map(it => it.value));
      const labelW = 118, trackX0 = iX0 + 44, trackX1 = iX1 - labelW - 6, trackW = trackX1 - trackX0;
      sec.items.forEach((it, i) => {
        const rowY = contentY + i * 48;
        ctx.textAlign = "right"; ctx.fillStyle = DIM; ctx.font = F(16, false);
        ctx.fillText(it.label, iX1, rowY + 17);
        roundRectPath(ctx, trackX0, rowY, trackW, 24, 12); ctx.fillStyle = CHIP_BG; ctx.fill();
        if(it.value > 0){
          const barW = Math.max(24, trackW * (it.value / max));
          roundRectPath(ctx, trackX1 - barW, rowY, barW, 24, 12);
          const bgr = ctx.createLinearGradient(trackX1 - barW, 0, trackX1, 0);
          bgr.addColorStop(0, it.color + "99"); bgr.addColorStop(1, it.color);
          ctx.fillStyle = bgr; ctx.fill();
        }
        ctx.textAlign = "left"; ctx.fillStyle = GOLD; ctx.font = F(20, true);
        ctx.fillText(toPersianDigits(it.value), iX0, rowY + 19);
      });
    }else if(sec.type === "list"){
      sec.items.forEach((it, i) => {
        const rowY = contentY + i * 48 + 22;
        if(!it.dim){
          ctx.beginPath(); ctx.arc(iX1 - 17, rowY - 6, 17, 0, Math.PI * 2);
          ctx.fillStyle = it.gold ? "rgba(235,210,122,0.16)" : "rgba(148,188,230,0.14)"; ctx.fill();
        }
        ctx.textAlign = "center"; ctx.fillStyle = it.gold ? GOLD : BLUE; ctx.font = F(19, true);
        ctx.fillText(it.medal, iX1 - 17, rowY);
        ctx.textAlign = "right"; ctx.fillStyle = it.dim ? DIM : LIGHT;
        fit(it.name, w0 - CARD_PAD * 2 - 170, 18, !it.dim);
        ctx.fillText(it.name, iX1 - 44, rowY);
        if(it.value){
          ctx.textAlign = "left"; ctx.fillStyle = DIM; ctx.font = F(16, false);
          ctx.fillText(it.value, iX0, rowY);
        }
      });
    }
  });

  // فوتر
  const [jy, jm, jd] = todayJalali();
  ctx.strokeStyle = dg; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(OUTER + 40, height - footerH + 6); ctx.lineTo(width - OUTER - 40, height - footerH + 6); ctx.stroke();
  ctx.textAlign = "center"; ctx.fillStyle = GOLD; ctx.font = F(20, true);
  ctx.fillText("⚽ هنگویه اسپورت", width / 2, height - 30);
  ctx.fillStyle = "#6F8074"; ctx.font = F(14, false);
  ctx.fillText(`کارت پروفایل — ${toPersianDigits(jd)} ${PERSIAN_MONTHS[jm - 1]} ${toPersianDigits(jy)}`, width / 2, height - 10);

  const url = canvas.toDataURL("image/png");
  const a = document.createElement("a");
  a.href = url;
  a.download = `کارت-پروفایل-${person.name}.png`;
  a.click();
}

function render(){

  updateStats();
  if(state.activeTab === "matches") app.innerHTML = renderMatchesTab();
  else if(state.activeTab === "predict") app.innerHTML = renderPredictTab();
  else if(state.activeTab === "analysis") app.innerHTML = renderAnalysisTab();
  else if(state.activeTab === "hall") app.innerHTML = renderHallTab();
  else if(state.activeTab === "teams") app.innerHTML = renderTeamsTab();
  else app.innerHTML = renderBoardTab();
  if(!SHARE && state.matches.length && (!state.lastBackup || Date.now() - state.lastBackup > 3 * 86400000)){
    const d = state.lastBackup ? Math.floor((Date.now() - state.lastBackup) / 86400000) : null;
    app.insertAdjacentHTML("afterbegin", `<div class="card" style="border:1px solid var(--gold-soft);"><div class="points-legend" style="margin-bottom:8px;">⚠️ ${d === null ? "هنوز فایل پشتیبان نگرفته‌اید" : "آخرین پشتیبان " + toPersianDigits(d) + " روز پیش بوده"}؛ اطلاعات فقط در مرورگر شما ذخیره می‌شود و با پاک شدن اطلاعات مرورگر از بین می‌رود.</div><button class="primary" onclick="exportBackup(); render();">⬇️ دانلود فایل پشتیبان</button></div>`);
  }
  if(SHARE) app.insertAdjacentHTML("afterbegin", shareBarHtml());
  attachHandlers();
  applyShareMode();
}

function attachHandlers(){
  if(state.activeTab === "matches"){
    const toggleArchiveBtn = document.getElementById("toggleArchiveBtn");
    if(toggleArchiveBtn){
      toggleArchiveBtn.onclick = () => {
        state.showArchive = !state.showArchive;
        render();
      };
    }
    document.getElementById("addMatchBtn").onclick = async () => {
      const teamMap = teamNameMap();
      const home = canonicalName(document.getElementById("homeTeam").value, teamMap);
      const away = canonicalName(document.getElementById("awayTeam").value, teamMap);
      const d = document.getElementById("mdDay").value;
      const mo = parseInt(document.getElementById("mdMonth").value, 10);
      const y = document.getElementById("mdYear").value;
      const date = `${toPersianDigits(d)} ${PERSIAN_MONTHS[mo-1]} ${toPersianDigits(y)}`;
      const tournament = canonicalName(document.getElementById("matchTournament").value, tournamentNameMap());
      if(!home || !away){ showToast("نام دو تیم را وارد کنید"); return; }
      if(nameKey(home) === nameKey(away)){ showToast("نام دو تیم نباید یکی باشد"); return; }
      if(state.matches.length >= MAX_MATCHES){ showToast("سقف ۶۰۰ مسابقه رسیده"); return; }
      state.matches.push({ id: uid(), home, away, date, tournament, homeScore: null, awayScore: null });
      await saveMatches();
      render();
      showToast("مسابقه اضافه شد");
    };

    document.querySelectorAll(".editResultBtn").forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const el = document.getElementById("resultForm-"+id);
        el.style.display = el.style.display === "none" ? "block" : "none";
      };
    });

    document.querySelectorAll(".saveResultBtn").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const h = document.getElementById("rh-"+id).value;
        const a = document.getElementById("ra-"+id).value;
        if(h === "" || a === ""){ showToast("نتیجه را کامل وارد کنید"); return; }
        const match = state.matches.find(m => m.id === id);
        match.homeScore = parseInt(h,10);
        match.awayScore = parseInt(a,10);
        await saveMatches();
        render();
        showToast("نتیجه ذخیره شد");
      };

    document.querySelectorAll(".editInfoBtn").forEach(btn => {

        const id = btn.dataset.id;
        const el = document.getElementById("infoForm-"+id);
        el.style.display = el.style.display === "none" ? "block" : "none";
      };
    });

    document.querySelectorAll(".saveInfoBtn").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const d = document.getElementById("ed-day-"+id).value;
        const mo = parseInt(document.getElementById("ed-month-"+id).value, 10);
        const y = document.getElementById("ed-year-"+id).value;
        const date = `${toPersianDigits(d)} ${PERSIAN_MONTHS[mo-1]} ${toPersianDigits(y)}`;
        const tournament = canonicalName(document.getElementById("ed-tournament-"+id).value, tournamentNameMap());
        const match = state.matches.find(m => m.id === id);
        match.date = date;
        match.tournament = tournament;
        await saveMatches();
        render();
        showToast("تاریخ و تگ ذخیره شد");
      };
    });

    document.querySelectorAll(".deleteMatchBtn").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        if(!confirm("این مسابقه و پیش‌بینی‌های آن حذف شود؟")) return;
        state.matches = state.matches.filter(m => m.id !== id);
        delete state.predictions[id];
        await saveMatches();
        await savePredictions();
        render();
        showToast("مسابقه حذف شد");
      };
    });
  }

    });

    if(tSel){
      tSel.onchange = () => {
        state.tournamentFilter = tSel.value;
        render();
      };
    }
    const mSel = document.getElementById("monthFilterSelect");
    if(mSel){
      mSel.onchange = () => {
        state.monthFilter = mSel.value;
        render();
      };

    const mT6 = document.getElementById("exportMonthTop6Btn");
    if(mT6) mT6.onclick = () => top6Card("all", mT6.dataset.month, null, "ماه " + mT6.dataset.month);
    const wT6 = document.getElementById("exportWeekTop6Btn");
    if(wT6) wT6.onclick = () => top6Card("all", null, wT6.dataset.week, wT6.dataset.weekLabel);
    const wSel = document.getElementById("weekFilterSelect");
    if(wSel){

function teamMatchPoints(m){
  const pr = state.predictions[m.id] || {};
  const raw = {};
  PARTICIPANTS.forEach(p => { raw[p.id] = calcPoints(pr[p.id], m); });
  return raw;
}

function teamStats(){
  const sw = +state.teams.startWeek || 1;
  const weeks = getWeekList().filter(w => w.weekNumber >= sw);
  const wk = new Set(weeks.map(w => w.key));
  const pts = {}, ex = {}, byWeek = {}, used = new Set();
  PARTICIPANTS.forEach(p => { pts[p.id] = 0; ex[p.id] = 0; byWeek[p.id] = {}; });
  state.matches.forEach(m => {
    if(m.homeScore === null || m.homeScore === undefined) return;
    const wi = getMatchWeekInfo(m);
    if(!wi || !wk.has(wi.key)) return;
    used.add(wi.key);
    const raw = teamMatchPoints(m);
    PARTICIPANTS.forEach(p => {
      const v = raw[p.id];
      pts[p.id] += v; if(v === 20) ex[p.id]++;
      byWeek[p.id][wi.key] = (byWeek[p.id][wi.key] || 0) + v;
    });
  });
  const wl = weeks.filter(w => used.has(w.key));
  const tl = teamList();
  const teams = tl.map(t => {
    const raw = t.ids.reduce((s, i) => s + pts[i], 0);
    const weekly = wl.map(w => t.ids.reduce((s, i) => s + (byWeek[i][w.key] || 0), 0));
    const total = weekly.reduce((s, v) => s + v, 0);
    return { ...t, total, raw, weekly,
      members: t.ids.map(i => ({ id:i, pts:pts[i] })).sort((a, b) => b.pts - a.pts),
      exact: t.ids.reduce((s, i) => s + ex[i], 0), avg: raw / t.ids.length };
  }).sort((a, b) => b.total - a.total);
  let rank = 0, prev = null;
  teams.forEach((t, i) => { if(t.total !== prev){ rank = i + 1; prev = t.total; } t.rank = rank; });
  return { teams, weeks: wl };
}

function scoringStreakStat(){
  const { playedMatches, matrix } = pointsMatrix();
  const res = PARTICIPANTS.map(p => { let cur = 0, best = 0; playedMatches.forEach(m => { if((matrix[m.id][p.id] || 0) > 0){ cur++; if(cur > best) best = cur; } else cur = 0; }); return { p, best, cur }; });
  const mx = Math.max(0, ...res.map(r => r.best)), cm = Math.max(0, ...res.map(r => r.cur));
  return { len: mx, names: res.filter(r => r.best === mx).map(r => r.p.name), live: res.some(r => r.best === mx && r.cur === mx),
    curLen: cm, curNames: res.filter(r => r.cur === cm).map(r => r.p.name) };
}

}
function funStatsWaText(){

  if(rec.v > 0) B.push(`🏅 *رکورد امتیاز در یک هفته:*\n${rec.names.join("، ")} — ${fmtS(rec.v)} امتیاز`);

      const cum = TS.teams.map(t => ({ idx: t.idx, name: t.name, v: t.weekly.slice(0, wi + 1).reduce((a, b) => a + b, 0) }));
      cum.sort((a, b) => b.v - a.v); let rk = 0, pv = null; cum.forEach((r, i) => { if(r.v !== pv){ rk = i + 1; pv = r.v; } r.rank = rk; });
      const t3 = cum.filter(r => r.rank <= 3 && r.v > 0);
      if(t3.length) B.push("💎 *۳ تیم برتر الماس لیگ:*\n\n" + t3.map(r => `${rankIcon(r.rank)} *${r.name}:* ${fmtS(r.v)} امتیاز`).join("\n\n"));
      const D = duelData(), tab = new Map(cum.map(r => [r.idx, { name: r.name, pts: 0, diff: 0, v: r.v }]));
      D.results.filter(r => r.w.weekNumber <= w.weekNumber).forEach(r => r.fx.forEach(x => {
        if(x.bye) return; const A = tab.get(x.a), Bt = tab.get(x.b); if(!A || !Bt) return;
        A.diff += x.sa - x.sb; Bt.diff += x.sb - x.sa;
        if(x.res === 0){ A.pts++; Bt.pts++; } else if(x.res > 0) A.pts += 3; else Bt.pts += 3;
      }));
      const dr = [...tab.values()].sort((a, b) => b.pts - a.pts || b.diff - a.diff || b.v - a.v);
      dr.forEach((r, i) => { const q = dr[i - 1]; r.rank = q && q.pts === r.pts && Math.abs(q.diff - r.diff) < 1e-6 ? q.rank : i + 1; });
      const d3 = dr.filter(r => r.rank <= 3 && D.results.some(r2 => r2.w.weekNumber <= w.weekNumber));
      if(d3.length) B.push("🌴⚽🕳️ *۳ تیم برتر هُنگوکاپ:*\n\n" + d3.map(r => `${rankIcon(r.rank)} *${r.name}:* ${n(r.pts)} امتیاز`).join("\n\n"));
    }
  }catch(e){}
  return B.join("\n\n");
}

// ---------- هُنگوکاپ و کارت‌های تصویری ----------
function duelData(){
  const { teams, weeks } = teamStats();
  const byIdx = new Map(teams.map(t => [t.idx, t]));
  const natural = teams.map(t => t.idx).sort((a, b) => a - b);
  const custom = (state.teams.duelOrder || []).filter(i => byIdx.has(i));
  const order = custom.length === natural.length ? custom.slice() : natural;
  const sw = +state.teams.startWeek || 1, nm = i => byIdx.get(i).name;
  const fixtures = wn => {
    const ids = order.slice(); if(ids.length < 2) return [];
    if(ids.length % 2) ids.push(null);
    const N = ids.length, r = (((wn - sw) % (N - 1)) + (N - 1)) % (N - 1), rest = ids.slice(1);
    for(let k = 0; k < r; k++) rest.unshift(rest.pop());
    const arr = [ids[0], ...rest], out = [];
    for(let i = 0; i < N / 2; i++) out.push([arr[i], arr[N - 1 - i]]);
    return out;
  };
  const tab = new Map(teams.map(t => [t.idx, { idx: t.idx, name: t.name, p: 0, w: 0, d: 0, l: 0, pts: 0, pf: 0, pa: 0, diff: 0, total: t.total }]));
  const results = weeks.map((w, wi) => ({ w, fx: fixtures(w.weekNumber).map(([a, b]) => {
    if(a == null || b == null) return { a: a == null ? b : a, bye: true };
    const sa = byIdx.get(a).weekly[wi], sb = byIdx.get(b).weekly[wi], A = tab.get(a), B = tab.get(b);
    A.p++; B.p++; A.pf += sa; A.pa += sb; B.pf += sb; B.pa += sa; A.diff += sa - sb; B.diff += sb - sa;
    const res = Math.abs(sa - sb) < 1e-6 ? 0 : sa > sb ? 1 : -1;
    if(res === 0){ A.d++; B.d++; A.pts++; B.pts++; } else if(res > 0){ A.w++; B.l++; A.pts += 3; } else { B.w++; A.l++; B.pts += 3; }
    return { a, b, sa, sb, res };
  }) }));
  const rows = [...tab.values()].sort((x, y) => y.pts - x.pts || y.diff - x.diff || y.total - x.total);
  rows.forEach((r, i) => { const q = rows[i - 1]; r.rank = q && q.pts === r.pts && Math.abs(q.diff - r.diff) < 1e-6 ? q.rank : i + 1; });
  const lastW = weeks.length ? weeks[weeks.length - 1].weekNumber : null;
  const nw = lastW ? lastW + 1 : sw;
  const rounds = Math.max(0, order.length + (order.length % 2) - 1);
  const schedule = Array.from({ length: rounds }, (_, k) => ({ wn: sw + k, fx: fixtures(sw + k) }));
  return { rows, results, nm, schedule, next: order.length > 1 ? { wn: nw, fx: fixtures(nw) } : null };
}

function duelLineText(D, x){
  if(x.bye) return `${D.nm(x.a)} — استراحت`;
  return `${x.res > 0 ? "🏆 " : ""}${D.nm(x.a)} ${fmtS(x.sa)} - ${fmtS(x.sb)} ${x.res < 0 ? "🏆 " : ""}${D.nm(x.b)}${x.res === 0 ? " 🤝" : ""}`;
}

// ---------- سناریوهای تیمی: وقتی فقط یک بازی از هفته مانده ----------
// بازی‌های بدون نتیجه‌ای که تنها بازی باقی‌مانده‌ی هفته‌ی خودشان هستند
function teamScenarioMatches(){
  const sw = +state.teams.startWeek || 1, pend = pendingMatches(), wl = getWeekList();
  return pend.filter(m => {
    const wi = getMatchWeekInfo(m); if(!wi) return false;
    const w = wl.find(x => x.key === wi.key); if(!w || w.weekNumber < sw) return false;
    return pend.filter(x => (getMatchWeekInfo(x) || {}).key === wi.key).length === 1;
  });
}
function teamScenarioData(match){
  const wi = getMatchWeekInfo(match), D0 = duelData();
  const curEnt = D0.results.find(r => r.w.key === wi.key) || null;
  const { classes, M } = scenarioClasses(match);
  const map = new Map();
  classes.forEach(c => {
    const oh = match.homeScore, oa = match.awayScore;
    let T, D;
    match.homeScore = c.h; match.awayScore = c.a;
    try{ T = teamStats(); D = duelData(); }finally{ match.homeScore = oh; match.awayScore = oa; }
    const ent = D.results.find(r => r.w.key === wi.key); if(!ent) return;
    const wIdx = T.weeks.findIndex(w => w.key === wi.key);
    const fx = ent.fx.filter(x => !x.bye).map(x => ({ a: x.a, b: x.b, sa: x.sa, sb: x.sb, res: x.res }));
    const wv = T.teams.map(t => ({ idx: t.idx, name: t.name, v: t.weekly[wIdx] || 0 }));
    const mx = Math.max(...wv.map(x => x.v));
    const bestW = mx > 0 ? wv.filter(x => x.v === mx) : [];
    const top = T.teams.filter(t => t.rank <= 3).map(t => ({ idx: t.idx, name: t.name, rank: t.rank, total: t.total }));
    // سناریوها فقط بر اساس برنده‌ی هر دوئل گروه‌بندی می‌شوند؛ برترین تیم هفته و رتبه‌ی کلی فقط وقتی نشان داده می‌شوند که در همه‌ی نتیجه‌های آن گروه یکی باشند
    const sig = fx.map(x => x.a + ">" + x.b + ":" + x.res).join("|");
    const bSig = bestW.map(x => x.idx).join(",") + "@" + mx, tSig = top.map(t => t.rank + ":" + t.idx).join(",");
    if(!map.has(sig)) map.set(sig, { fx, bestW, bestV: mx, top, bSig, tSig, bestOk: true, topOk: true, fxOk: fx.map(() => true), classes: [], support: 0 });
    const g = map.get(sig);
    if(g.classes.length){
      if(g.bSig !== bSig) g.bestOk = false; if(g.tSig !== tSig) g.topOk = false;
      fx.forEach((x, i) => { if(Math.abs(x.sa - g.fx[i].sa) > 1e-6 || Math.abs(x.sb - g.fx[i].sb) > 1e-6) g.fxOk[i] = false; });
    }
    g.classes.push(c); g.support += c.n;
  });
  const groups = Array.from(map.values());
  groups.forEach(g => { g.chips = scenarioChips(g.classes, match, M, classes); });
  groups.sort((x, y) => y.support - x.support);
  // دوئل‌هایی که هر نتیجه‌ای بیاید برنده‌شان عوض نمی‌شود
  const certain = [];
  if(groups.length){
    groups[0].fx.forEach((x, i) => {
      if(groups.every(g => g.fx[i] && g.fx[i].res === x.res)) certain.push({ a: x.a, b: x.b, res: x.res });
    });
  }
  const cur = curEnt ? curEnt.fx.filter(x => !x.bye) : [];
  return { match, wi, D0, groups, certain, cur, M };
}
function teamScenarioDuelShort(D, x){
  return x.res === 0 ? `🤝 ${D.nm(x.a)} و ${D.nm(x.b)} مساوی` : `🏆 ${D.nm(x.res > 0 ? x.a : x.b)} بر ${D.nm(x.res > 0 ? x.b : x.a)}`;
}

}

    const w = nm(W[0]), l = nm(W[2]), ws = fmtS(W[1]), ls = fmtS(W[3]);
    const body = done
      ? [`${w} با ${ws} بر ${ls} از ${l} پیروز شد 🏆`, `${w} ${ws} - ${ls} ${l} را شکست داد 🏆`, `برد ${w} با ${ws} امتیاز مقابل ${l} (${ls})`][v]

    return `⚔️ ${body}` + (gap < 5 ? " — اختلاف خیلی کم است 😮" : gap >= 40 ? " — با اختلاف زیاد 💪" : "");
  });
  return [head, ...lines].join("\n\n");
}

  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#17301F"); bg.addColorStop(0.5, "#0F1D15"); bg.addColorStop(1, "#0A130E");

function weekCardSections(key){
  const wl = getWeekList(), w = wl.find(x => x.key === key); if(!w) return null;
  const n = toPersianDigits;
  const ms = state.matches.filter(m => matchHasResult(m) && (getMatchWeekInfo(m) || {}).key === key);
  const wp = PARTICIPANTS.map(p => ({ p, v: ms.reduce((s, m) => s + calcPoints((state.predictions[m.id] || {})[p.id], m), 0) }));
  wp.forEach(x => x.r = 1 + wp.filter(y => y.v > x.v).length);
  const sec = [], top = wp.filter(x => x.r <= 3 && x.v > 0).sort((a, b) => a.r - b.r);
  if(top.length) sec.push({ heading: "⭐ ۳ نفر برتر هفته", podium: true, rows: top.map(x => ({ rank: x.r, name: x.p.name, value: n(x.v), num: x.v })) });
  const { teams, weeks } = teamStats(), wi = weeks.findIndex(x => x.key === key);
  if(wi >= 0 && teams.length){
    const arr = teams.map(t => ({ name: t.name, v: t.weekly[wi] }));
    arr.forEach(x => x.r = 1 + arr.filter(y => y.v > x.v + 1e-9).length);
    arr.sort((a, b) => a.r - b.r || b.v - a.v);
    sec.push({ heading: "🏅 تیم‌های هفته", podium: true, rows: arr.map(x => ({ rank: x.r, name: x.name, value: fmtS(x.v), num: x.v })) });
    const D = duelData(), res = D.results.find(r => r.w.key === key);
    if(res) sec.push({ heading: "🌴⚽🕳️ دوئل‌های هفته", rows: res.fx.map(x => ({ name: duelLineText(D, x), value: "", small: true, duel: x.bye ? null : { a: D.nm(x.a), b: D.nm(x.b), sa: fmtS(x.sa), sb: fmtS(x.sb), res: x.res }, bye: x.bye ? D.nm(x.a) : null })) });
  }
  return { w, sections: sec };
}

  const MED = { 1: ["#F6E27A", "#C99A2E", "#3A2A00"], 2: ["#E8EDF0", "#9AA7B0", "#1F2A30"], 3: ["#E7B186", "#B06B34", "#2E1704"] };
  // پس‌زمینه و چمن
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#17301F"); bg.addColorStop(0.5, "#0F1D15"); bg.addColorStop(1, "#0A130E");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for(let i = 0; i < W; i += 80){ ctx.fillStyle = "rgba(255,255,255,0.018)"; ctx.fillRect(i, 0, 40, H); }
  const gl = ctx.createRadialGradient(W / 2, 0, 10, W / 2, 0, 340); gl.addColorStop(0, "rgba(228,200,96,0.30)"); gl.addColorStop(1, "rgba(228,200,96,0)");
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, hdrH + 160);
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(W / 2, hdrH / 2 + 10, 70, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, hdrH / 2 + 10); ctx.lineTo(W, hdrH / 2 + 10); ctx.stroke();
  // هدر
  ctx.textAlign = "center";
  const tg = ctx.createLinearGradient(W / 2 - 160, 0, W / 2 + 160, 0); tg.addColorStop(0, "#F6E27A"); tg.addColorStop(1, "#D4A53A");
  ctx.fillStyle = tg; fit(title, W - 60, 32, true); ctx.fillText(title, W / 2, 68);

        ctx.textAlign = "center";
        if(r.bye){ ctx.fillStyle = "#9CAA9F"; fit(r.bye + " — استراحت", W - 80, 16, false); ctx.fillText(r.bye + " — استراحت", W / 2, y + 33); }
        else {
          const d = r.duel, win = d.res > 0 ? "a" : d.res < 0 ? "b" : "";
          ctx.textAlign = "right"; ctx.fillStyle = win === "a" ? "#E4C860" : "#EAF0EC"; fit(d.a, 150, 18, true); ctx.fillText(d.a, W - 32, y + 33);

      ctx.fillStyle = top3 ? "#E4C860" : "#3E8F5E"; rr(W - 22, y + 10, 4, rH - 28, 2); ctx.fill();

        ctx.beginPath(); ctx.arc(W - 50, y + (rH - 8) / 2, 16, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
        ctx.fillStyle = ink; ctx.font = "bold 16px " + FONT; ctx.textAlign = "center"; ctx.fillText(toPersianDigits(r.rank), W - 50, y + (rH - 8) / 2 + 6);
      }
      const hasBar = r.num != null && mx > 0, nx = r.rank ? W - 78 : W - 34;
      ctx.textAlign = "right"; ctx.fillStyle = top3 ? "#F2D77A" : "#EAF0EC"; fit(r.name, 250, 21, true);
      ctx.fillText(r.name, nx, hasBar ? y + 24 : y + (rH - 8) / 2 + 6);
      if(hasBar){
        const bw = nx - 110; rr(110, y + 33, bw, 6, 3); ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fill();
        if(r.num > 0){ rr(110 + bw * (1 - r.num / mx), y + 33, Math.max(6, bw * r.num / mx), 6, 3); ctx.fillStyle = top3 ? "#E4C860" : "#4FA372"; ctx.fill(); }
      }
      if(r.value){ ctx.textAlign = "left"; ctx.fillStyle = top3 ? "#F2D77A" : "#EAF0EC"; ctx.font = "bold 19px " + FONT; ctx.fillText(r.value, 34, y + (rH - 8) / 2 + 7); }
      y += rH;
    });
    y += 14;
  });
  // فوتر
  const [jy, jm, jd] = todayJalali();
  ctx.strokeStyle = "rgba(228,200,96,0.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(40, H - ftrH + 6); ctx.lineTo(W - 40, H - ftrH + 6); ctx.stroke();
  ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; ctx.font = "bold 17px " + FONT; ctx.fillText("⚽ هنگویه اسپورت", W / 2, H - 32);
  ctx.fillStyle = "#6F8074"; ctx.font = "12px " + FONT; ctx.fillText(`${toPersianDigits(jd)} ${PERSIAN_MONTHS[jm - 1]} ${toPersianDigits(jy)}`, W / 2, H - 12);
  hqSave(cv, fileName + ".png");
}

    const tot = t.members.reduce((s2, m) => s2 + m.pts, 0), star = t.members[0], second = t.members[1];
    return { name: t.name, star, second, tot, share: tot > 0 ? star.pts / tot : 0, members: t.members };
  });
}

// ---------- آمار تیمی (نمایش + متن واتساپ) ----------
function teamStatItems(withBase){
  const n = toPersianDigits, { teams, weeks } = teamStats(); if(!teams.length || !weeks.length) return [];
  const nmL = l => l.map(t => t.name).join("، ");
  const top = (arr, f) => { const m = Math.max(...arr.map(f)); return { m, list: arr.filter(x => f(x) === m) }; };
  const low = (arr, f) => { const m = Math.min(...arr.map(f)); return { m, list: arr.filter(x => f(x) === m) }; };
  const W = weeks.length, last = W - 1, wn = i => n(weeks[i].weekNumber), r1 = v => fmtS(Math.round(v * 10) / 10);
  const items = [], add = (icon, title, lines) => { if(lines && lines.length) items.push({ icon, title, lines }); };
  const wkKeys = new Set(weeks.map(w => w.key));
  const played = state.matches.filter(m => matchHasResult(m) && (getMatchWeekInfo(m) || {}).key && wkKeys.has(getMatchWeekInfo(m).key));
  if(withBase){
    const bw = top(teams, t => t.weekly[last]), ba = top(teams, t => t.avg), be = top(teams, t => t.exact);
    const all = teams.flatMap(t => t.members.map(m => ({ ...m, team: t.name }))), mvp = top(all, m => m.pts);
    add("🏅", "تیم برتر هفته‌ی آخر", [`${nmL(bw.list)} (${fmtS(bw.m)} امتیاز)`]);
    if(teams.length > 1) add("📏", "فاصله‌ی رتبه‌ی اول و دوم", [`${fmtS(teams[0].total - teams[1].total)} امتیاز`]);
    add("⚖️", "بهترین میانگین به ازای هر نفر", [`${nmL(ba.list)} (${formatAverage(ba.m)})`]);
    if(be.m > 0) add("🎯", "بیشترین پیش‌بینی دقیق (۲۰ امتیازی) تیمی", [`${nmL(be.list)} (${n(be.m)} بار)`]);
    add("👑", "بهترین بازیکن بین همه‌ی تیم‌ها", [`${mvp.list.map(m => pname(m.id) + " (" + m.team + ")").join("، ")} (${n(mvp.m)} امتیاز)`]);
  }
  // بهترین و بدترین هفته‌ی هر تیم
  add("📆", "بهترین و بدترین هفته‌ی هر تیم", teams.map(t => { const ib = t.weekly.indexOf(Math.max(...t.weekly)), iw = t.weekly.indexOf(Math.min(...t.weekly)); return W > 1 ? `${t.name}: بهترین هفته‌ی ${wn(ib)} (${fmtS(t.weekly[ib])}) | بدترین هفته‌ی ${wn(iw)} (${fmtS(t.weekly[iw])})` : `${t.name}: ${fmtS(t.weekly[0])}`; }));
  // رکورد هفتگی و رکورد یک بازی
  { let hi = null, lo = null; teams.forEach(t => t.weekly.forEach((v, i) => { if(!hi || v > hi.v) hi = { t, v, i }; if(!lo || v < lo.v) lo = { t, v, i }; }));
    const L = [`🔝 بیشترین امتیاز هفتگی: ${hi.t.name} در هفته‌ی ${wn(hi.i)} (${fmtS(hi.v)})`]; if(W > 1 || teams.length > 1) L.push(`🔻 کمترین امتیاز هفتگی: ${lo.t.name} در هفته‌ی ${wn(lo.i)} (${fmtS(lo.v)})`);
    add("🏆", "رکوردهای هفتگی گروه", L);
    let bm = null; played.forEach(m => { const r = teamMatchPoints(m); teams.forEach(t => { const v = t.ids.reduce((a, i) => a + (r[i] || 0), 0); if(!bm || v > bm.v) bm = { t, v, m }; }); });
    if(bm && bm.v > 0) add("💥", "بیشترین امتیاز تیمی در یک بازی", [`${bm.t.name} — ${fmtS(bm.v)} امتیاز در ${bm.m.home} ${n(bm.m.homeScore)} - ${n(bm.m.awayScore)} ${bm.m.away}`]); }
  // رشته‌ی تیم برتر هفته
  { const wk = weeks.map((_, i) => top(teams, t => t.weekly[i])), cnt = new Map(), stk = new Map();
    teams.forEach(t => { let cur = 0, b = 0, c = 0; wk.forEach(x => { if(x.m > 0 && x.list.includes(t)){ cur++; c++; b = Math.max(b, cur); } else cur = 0; }); stk.set(t, b); cnt.set(t, c); });
    const ms = Math.max(...stk.values()), mc = Math.max(...cnt.values()), L = [];
    if(mc > 0) L.push(`بیشترین دفعات تیم برتر هفته: ${nmL(teams.filter(t => cnt.get(t) === mc))} (${n(mc)} بار)`);
    if(ms >= 2) L.push(`طولانی‌ترین رشته‌ی پیاپی: ${nmL(teams.filter(t => stk.get(t) === ms))} (${n(ms)} هفته‌ی متوالی)`);
    add("🔥", "تیم برتر هفته", L); }
  // صعود و سقوط، جهش و افت
  if(W >= 2){
    const cum = teams.map(t => { let a = 0; return t.weekly.map(v => a += v); });
    const rk = i => teams.map((_, k) => 1 + cum.filter(c => c[i] > cum[k][i]).length);
    const r0 = rk(last - 1), r1_ = rk(last), ds = teams.map((t, k) => ({ t, d: r0[k] - r1_[k], a: r0[k], b: r1_[k] }));
    const up = top(ds, x => x.d), dn = low(ds, x => x.d), L = [];
    if(up.m > 0) L.push(`🚀 بیشترین صعود: ${up.list.map(x => `${x.t.name} (رتبه‌ی ${n(x.a)} ← ${n(x.b)})`).join("، ")}`);
    if(dn.m < 0) L.push(`📉 بیشترین سقوط: ${dn.list.map(x => `${x.t.name} (رتبه‌ی ${n(x.a)} ← ${n(x.b)})`).join("، ")}`);
    add("↕️", `تغییر رتبه در هفته‌ی ${wn(last)}`, L);
    let jp = null, dr = null; teams.forEach(t => t.weekly.forEach((v, i) => { if(i < 1) return; const d = v - t.weekly[i - 1]; if(!jp || d > jp.d) jp = { t, d, i }; if(!dr || d < dr.d) dr = { t, d, i }; }));
    const L2 = []; if(jp && jp.d > 0) L2.push(`⬆️ بزرگ‌ترین جهش: ${jp.t.name} در هفته‌ی ${wn(jp.i)} (${fmtS(jp.d)} امتیاز بیشتر از هفته‌ی قبل)`);
    if(dr && dr.d < 0) L2.push(`⬇️ بزرگ‌ترین افت: ${dr.t.name} در هفته‌ی ${wn(dr.i)} (${fmtS(-dr.d)} امتیاز کمتر از هفته‌ی قبل)`);
    add("🎢", "جهش و افت هفتگی", L2);
  }
  // ثبات
  if(W >= 3){
    const sd = teams.map(t => { const m = t.total / W; return { t, v: Math.sqrt(t.weekly.reduce((a, x) => a + (x - m) * (x - m), 0) / W) }; });
    const lo2 = low(sd, x => x.v), hi2 = top(sd, x => x.v);
    add("🧊", "ثبات تیم‌ها (نوسان امتیاز هفتگی)", [`با‌ثبات‌ترین: ${lo2.list.map(x => x.t.name).join("، ")} (نوسان ${r1(lo2.m)})`, `پرنوسان‌ترین: ${hi2.list.map(x => x.t.name).join("، ")} (نوسان ${r1(hi2.m)})`]);
  }
  // درون تیم
  { const rg = teams.filter(t => t.members.length > 1).map(t => ({ t, v: t.members[0].pts - t.members[t.members.length - 1].pts }));
    if(rg.length > 1){ const lo2 = low(rg, x => x.v), hi2 = top(rg, x => x.v);
      add("🤝", "توازن درون تیم", [`متوازن‌ترین: ${lo2.list.map(x => x.t.name).join("، ")} (فاصله‌ی بهترین و ضعیف‌ترین عضو ${fmtS(lo2.m)} امتیاز)`, `نامتوازن‌ترین: ${hi2.list.map(x => x.t.name).join("، ")} (${fmtS(hi2.m)} امتیاز فاصله)`]); }
    add("🪫", "حلقه‌ی ضعیف هر تیم", teams.filter(t => t.members.length > 1).map(t => { const m = t.members[t.members.length - 1]; return `${t.name}: ${pname(m.id)} (${n(m.pts)} امتیاز)`; })); }
  // هم‌نظری
  if(teams.length > 1 && played.length){
    const ag = teams.map(t => { let s2 = 0, c = 0; played.forEach(m => { const pr = state.predictions[m.id] || {}, o = { H: 0, D: 0, A: 0 }; let k = 0; t.ids.forEach(i => { const p = pr[i]; if(p && isNum(p.h) && isNum(p.a)){ o[outcomeOf(+p.h, +p.a)]++; k++; } }); if(k >= 2){ s2 += Math.max(o.H, o.D, o.A) / k; c++; } }); return { t, v: c ? s2 / c : null }; }).filter(x => x.v !== null);
    if(ag.length > 1){ const hi2 = top(ag, x => x.v), lo2 = low(ag, x => x.v);
      add("🧬", "هم‌نظری اعضای تیم", [`هم‌نظرترین: ${hi2.list.map(x => x.t.name).join("، ")} (${pctText(Math.round(hi2.m * 1000), 1000)})`, `متنوع‌ترین: ${lo2.list.map(x => x.t.name).join("، ")} (${pctText(Math.round(lo2.m * 1000), 1000)})`]); }
  }
  // بهترین تیم هر تورنمنت
  { const tot = new Map(); played.forEach(m => { const tn = m.tournament || "بدون تورنمنت", r = teamMatchPoints(m), o = tot.get(tn) || new Map(); teams.forEach(t => o.set(t, (o.get(t) || 0) + t.ids.reduce((a, i) => a + (r[i] || 0), 0))); tot.set(tn, o); });
    add("🏟", "بهترین تیم هر تورنمنت", [...tot.entries()].map(([tn, o]) => { const arr = [...o.entries()], mx = Math.max(...arr.map(x => x[1])); return mx > 0 ? `${tn}: ${arr.filter(x => x[1] === mx).map(x => x[0].name).join("، ")} (${fmtS(mx)})` : null; }).filter(Boolean)); }
  return items;
}

    <summary style="cursor:pointer;color:var(--gold-soft);font-weight:600;">⚙️ تنظیم تیم‌ها (۸ تیم چهارنفره)</summary>
    <div class="row" style="margin-top:12px;align-items:center;">شروع امتیازگیری از هفته‌ی <input type="number" min="1" style="width:70px" value="${S.startWeek}" onchange="teamAct('start',this.value)"></div>

    <div class="points-legend" style="margin-bottom:10px;">بدون تیم: ${toPersianDigits(free)} نفر. نام هر تیم همان نام کاپیتانش است. ستون «امتیاز پایه» فقط روی جدول کل فصل اثر می‌گذارد (نه رده‌بندی تیمی)؛ برای کسی که وسط فصل به جدول اضافه می‌شود استفاده کنید.</div>
    ${Array.from({ length: TEAM_COUNT }, (_, k) => k + 1).map(i => `<div class="row" style="align-items:center;margin-bottom:6px;"><b>تیم ${toPersianDigits(i)}</b> <span class="stat-label">(${toPersianDigits(cnt[i])} نفر)</span> کاپیتان:
      <select onchange="teamAct('cap',${i},this.value)"><option value="">—</option>${PARTICIPANTS.filter(p => S.assign[p.id] === i).map(p => `<option value="${p.id}" ${S.captains[i] === p.id ? "selected" : ""}>${p.name}</option>`).join("")}</select></div>`).join("")}
    <table style="margin-top:10px;"><thead><tr><th>نام</th><th>تیم</th><th>امتیاز پایه (جدول کل)</th></tr></thead><tbody>
      ${PARTICIPANTS.map(p => `<tr><td>${p.name}</td><td><select onchange="teamAct('assign','${p.id}',this.value)"><option value="">—</option>${Array.from({ length: TEAM_COUNT }, (_, k) => k + 1).map(i => `<option value="${i}" ${S.assign[p.id] === i ? "selected" : ""}>تیم ${toPersianDigits(i)}</option>`).join("")}</select></td><td><input type="number" style="width:80px" value="${(S.basePoints || {})[p.id] || 0}" onchange="teamAct('base','${p.id}',this.value)"></td></tr>`).join("")}
    </tbody></table></details>`;
}

async function teamAct(kind, a, b){
  const S = state.teams, y = window.scrollY;
  if(kind === "start") S.startWeek = Math.max(1, parseInt(a) || 1);
  else if(kind === "base"){ const n = parseInt(b) || 0; S.basePoints = Object.assign({}, S.basePoints); if(n) S.basePoints[a] = n; else delete S.basePoints[a]; }
  else if(kind === "cap"){ if(b) S.captains[a] = b; else delete S.captains[a]; }
  else { const n = parseInt(b) || 0; if(n) S.assign[a] = n; else delete S.assign[a]; }
  await saveTeams(); render(); window.scrollTo(0, y);
}

// ---------- ثبت خودکار از متن پیام‌های گروه ----------
function renderPasteCard(){
  return `<details class="card" ${state.pasteOpen ? "open" : ""} ontoggle="state.pasteOpen=this.open">
    <summary style="cursor:pointer;color:var(--gold-soft);font-weight:600;">📋 چسباندن پیام‌های گروه (ثبت خودکار)</summary>
    <textarea id="pasteTxt" class="wa-text" rows="6" style="margin-top:12px;" placeholder="متن پیام‌های گروه را اینجا بچسبانید...">${escP(state.pasteText || "")}</textarea>
    <div class="row"><button class="primary" onclick="parsePaste()">بررسی پیام‌ها</button>
      <button class="ghost" onclick="missingWaCopy()">💬 متن برای نفرات نفرستاده</button>
      ${state.undo ? `<button class="danger" onclick="undoPaste()">↩️ لغو آخرین ثبت (${toPersianDigits(state.undo.preds.length)} پیش‌بینی)</button>` : ""}</div>
    <div id="pasteOut">${state.paste ? pasteOutHtml() : ""}</div></details>`;
}

function missingWaCopy(){
  if(!state.matches.length) return showToast("هنوز مسابقه‌ای ثبت نشده");
  const n = toPersianDigits, okp = r => r && isNum(r.h) && isNum(r.a);
  // دور فعلی: بازی‌های بدون نتیجه‌ی اولین هفته‌ای که هنوز بازی بی‌نتیجه دارد
  const pend = state.matches.filter(m => !matchHasResult(m)).sort((a, b) => dateKeyOf(a) - dateKeyOf(b));
  if(!pend.length) return showToast("بازی بدون نتیجه‌ای (در انتظار پیش‌بینی) وجود ندارد");
  const wi0 = getMatchWeekInfo(pend[0]), rd = wi0 ? pend.filter(m => (getMatchWeekInfo(m) || {}).key === wi0.key) : pend;
  const cnt = p => rd.filter(m => okp((state.predictions[m.id] || {})[p.id])).length;
  const none = PARTICIPANTS.filter(p => cnt(p) === 0), part = PARTICIPANTS.filter(p => cnt(p) > 0 && cnt(p) < rd.length);
  if(!none.length && !part.length) return showToast(`همه‌ی ${n(PARTICIPANTS.length)} نفر برای هر ${n(rd.length)} بازی این دور پیش‌بینی ثبت کرده‌اند ✅`);
  const B = [`⏳ *یادآوری پیش‌بینی هنگویه اسپورت*`];
  if(none.length) B.push(`دوستان زیر هنوز هیچ پیش‌بینی‌ای برای این دور نفرستاده‌اند (${n(none.length)} نفر):\n` + none.map(p => `▫️ *${p.name}*`).join("\n"));
  if(part.length) B.push(`پیش‌بینی این دوستان ناقص است:\n` + part.map(p => `▫️ *${p.name}* (${n(cnt(p))} از ${n(rd.length)} بازی)`).join("\n"));
  B.push(`⚽ *بازی‌های این دور:*\n` + rd.map(m => `${m.home} - ${m.away}`).join("\n"), "لطفاً قبل از شروع بازی‌ها پیش‌بینی‌تان را بفرستید 🙏");
  copyTxt(B.join("\n\n"));
}
function parsePaste(){
  const txt = document.getElementById("pasteTxt").value;
  state.pasteText = txt;
  const H1 = /^[\u200e\u200f]*\[[^\]]*\]\s*([^:]+?):\s*(.*)$/, H2 = /^[\u200e\u200f]*\d{1,4}[\/.]\d{1,2}[\/.]\d{1,4},?\s[^-]*-\s*([^:]+?):\s*(.*)$/;
  const SC = /^[\s\u200e\u200f]*(.+?)\s*([0-9]+)\s*[-–—]\s*(.+?)\s*([0-9]+)[\s\u200e\u200f]*$/, SIG = /^\s*\*+\s*(.+?)\s*\*+\s*$/;
  const msgs = []; let cur = null;
  txt.split(/\r?\n/).forEach(line => {
    const m = line.match(H1) || line.match(H2);
    if(m){ cur = { author: m[1].trim(), lines: [m[2]] }; msgs.push(cur); } else if(cur) cur.lines.push(line);
  });
  const people = new Map();
  msgs.forEach(ms => {
    let who = ms.author; const sc = [];
    ms.lines.forEach(l => {
      l = faDigits(l);
      const g = l.match(SIG); if(g){ who = g[1]; return; }
      const s = l.match(SC); if(s) sc.push({ t1: cleanName(s[1]), t2: cleanName(s[3]), a: +s[2], b: +s[4] });
    });
    if(!sc.length) return;
    const k = normName(who); let p = people.get(k);
    if(!p){ p = { label: who.trim(), map: new Map(), changed: false }; people.set(k, p); }
    sc.forEach(x => { const key = nameKey(x.t1) + "|" + nameKey(x.t2), old = p.map.get(key); if(old && (old.a !== x.a || old.b !== x.b)) p.changed = true; p.map.set(key, x); });
  });
  const list = [...people.entries()].map(([k, p]) => {
    let pid = state.aliases[k] || null;
    if(!pid){ const ex = PARTICIPANTS.filter(q => normName(q.name) === k); if(ex.length === 1) pid = ex[0].id; }
    if(!pid){ const fz = PARTICIPANTS.filter(q => { const n = normName(q.name); return n.includes(k) || k.includes(n); }); if(fz.length === 1) pid = fz[0].id; }
    return { key: k, label: p.label, map: p.map, changed: p.changed, pid };
  });
  const pairs = new Map();
  list.forEach(p => p.map.forEach((x, key) => {
    if(pairs.has(key)) return;
    const f = state.matches.filter(m => nameKey(m.home) === nameKey(x.t1) && nameKey(m.away) === nameKey(x.t2));
    const r = state.matches.filter(m => nameKey(m.home) === nameKey(x.t2) && nameKey(m.away) === nameKey(x.t1));
    // برگشت: بازی معکوس فقط وقتی استفاده می‌شود که هنوز نتیجه و پیش‌بینی ندارد؛ وگرنه بازی جدید ساخته می‌شود
    const rFree = r.filter(m => (m.homeScore === null || m.homeScore === undefined) && !Object.keys(state.predictions[m.id] || {}).length);
    const m = f.length ? f[f.length - 1] : (rFree.length ? rFree[rFree.length - 1] : null);
    pairs.set(key, { t1: x.t1, t2: x.t2, id: m ? m.id : null, swap: !f.length && !!rFree.length });
  }));
  state.paste = { list, pairs };
  document.getElementById("pasteOut").innerHTML = pasteOutHtml();
}

function pasteOutHtml(){
  const P = state.paste; if(!P) return "";
  if(!P.list.length) return `<div class="empty">پیام معتبری پیدا نشد. متن باید با همان قالب واتساپ (نام فرستنده و خطوط «تیم ۲ - تیم ۱») چسبانده شود.</div>`;
  const used = {}; P.list.forEach(p => { if(p.pid) used[p.pid] = (used[p.pid] || 0) + 1; });
  const missing = PARTICIPANTS.filter(p => !used[p.id]);
  const noMatch = [...P.pairs.values()].filter(x => !x.id);
  return `<div class="points-legend" style="margin:10px 0;">${toPersianDigits(P.list.length)} فرستنده و ${toPersianDigits(P.pairs.size)} بازی شناسایی شد.</div>
    ${noMatch.length ? `<div class="points-legend" style="margin:10px 0;">این بازی‌ها هنوز نیستند و همراه ثبت ساخته می‌شوند (با تاریخ امروز): ${noMatch.map(x => x.t1 + " - " + x.t2).join("، ")}</div>` : ""}
    <table><thead><tr><th>فرستنده</th><th>نفر</th></tr></thead><tbody>
    ${P.list.map((p, i) => `<tr><td>${escP(p.label)}${p.changed ? ` <span style="color:var(--danger);">(چند پیام؛ آخری)</span>` : ""}<div class="stat-label">${toPersianDigits(p.map.size)} پیش‌بینی</div></td>
      <td><select onchange="pastePick(${i},this.value)"><option value="">— انتخاب —</option>${PARTICIPANTS.map(q => `<option value="${q.id}" ${q.id === p.pid ? "selected" : ""}>${q.name}</option>`).join("")}</select>${p.pid && used[p.pid] > 1 ? " ⚠️ تکراری" : ""}</td></tr>`).join("")}
    </tbody></table>
    <div class="points-legend" style="margin:10px 0;">${missing.length ? `هنوز نفرستاده‌اند (${toPersianDigits(missing.length)} نفر): ${missing.map(p => p.name).join("، ")}` : `همه‌ی ${toPersianDigits(PARTICIPANTS.length)} نفر فرستاده‌اند ✅`}</div>
    <div class="row"><button class="primary" onclick="applyPaste()">ثبت پیش‌بینی‌ها</button></div>`;
}

function pastePick(i, v){ state.paste.list[i].pid = v || null; document.getElementById("pasteOut").innerHTML = pasteOutHtml(); }

async function undoPaste(){
  const u = state.undo; if(!u) return;
  if(!confirm("آخرین ثبت پیام‌ها لغو شود؟ پیش‌بینی‌ها (و مسابقه‌هایی که همان لحظه ساخته شد) برمی‌گردند.")) return;
  u.preds.slice().reverse().forEach(x => { const bag = state.predictions[x.mid]; if(!bag) return; if(x.old) bag[x.pid] = x.old; else delete bag[x.pid]; });
  const cs = new Set(u.created); state.matches = state.matches.filter(m => !cs.has(m.id)); cs.forEach(id => delete state.predictions[id]);
  u.aliases.slice().reverse().forEach(x => { if(x.old) state.aliases[x.k] = x.old; else delete state.aliases[x.k]; });
  state.undo = null;
  await savePredictions(); await saveMatches(); await saveAliases(); await saveUndo();
  render(); showToast("ثبت قبلی لغو شد");
}

async function applyPaste(){
  const P = state.paste; if(!P) return;
  let n = 0, over = 0, created = 0;
  const undo = { preds: [], created: [], aliases: [] };
  const tm = teamNameMap(), gd = new Date(), [jy, jm, jd] = gregorianToJalali(gd.getFullYear(), gd.getMonth() + 1, gd.getDate());
  const today = `${toPersianDigits(jd)} ${PERSIAN_MONTHS[jm - 1]} ${toPersianDigits(jy)}`;
  P.pairs.forEach(pr => {
    if(pr.id || state.matches.length >= MAX_MATCHES) return;
    const m = { id: uid(), home: canonicalName(pr.t1, tm), away: canonicalName(pr.t2, tm), date: today, tournament: "", homeScore: null, awayScore: null };
    state.matches.push(m); pr.id = m.id; created++; undo.created.push(m.id);
  });
  if(created) await saveMatches();
  P.list.forEach(p => {
    if(!p.pid) return;
    p.map.forEach((x, key) => {
      const pr = P.pairs.get(key); if(!pr || !pr.id) return;
      const h = pr.swap ? x.b : x.a, a = pr.swap ? x.a : x.b;
      const bag = state.predictions[pr.id] = state.predictions[pr.id] || {}, old = bag[p.pid];
      undo.preds.push({ mid: pr.id, pid: p.pid, old: old ? { h: old.h, a: old.a } : null });
      if(old && isNum(old.h) && (old.h !== h || old.a !== a)) over++;
      bag[p.pid] = { h, a }; n++;
    });
    if(normName(pname(p.pid)) !== p.key){ undo.aliases.push({ k: p.key, old: state.aliases[p.key] || null }); state.aliases[p.key] = p.pid; }
  });
  state.undo = undo;
  await savePredictions(); await saveAliases(); await saveUndo();
  state.paste = null; state.pasteText = "";
  render();
  showToast(`${toPersianDigits(n)} پیش‌بینی ثبت شد` + (created ? ` — ${toPersianDigits(created)} مسابقه ساخته شد` : "") + (over ? ` (${toPersianDigits(over)} مورد بازنویسی)` : ""));
}

  if(SHARE){
    ["matches", "predict", "analysis"].forEach(t => { const b = document.querySelector('nav.tabs button[data-tab="' + t + '"]'); if(b) b.remove(); });

    state.activeTab = "board";
    render();

  }
  const fixedNames = unifyNames();
  if(fixedNames > 0) await saveMatches();

})();
