// ساخت کارت پروفایل شخصی (عکس PNG) شامل امتیاز کل، رتبه فصل، دقت، مقایسه با میانگین،
// بهترین/بدترین تیم، رکورد متوالی، عملکرد در هر تورنمنت، افتخارات هفتگی/ماهانه و توزیع امتیازها
// اطلاعات تیم یک نفر و عملکرد تیمش در هُنگوکاپ
function teamProfileInfo(pid){
  const { teams } = teamStats();
  const tk = teams.find(t => t.ids.includes(pid));
  if(!tk) return null;
  const me = tk.members.find(m => m.id === pid);
  const myPts = me ? me.pts : 0;
  const myRank = 1 + tk.members.filter(m => m.pts > myPts).length;
  const D = duelData();
  const duel = D.rows.find(r => r.idx === tk.idx) || null;
  let last = null;
  const lr = D.results[D.results.length - 1];
  if(lr){
    const x = lr.fx.find(f => !f.bye && (f.a === tk.idx || f.b === tk.idx));
    if(x){
      const mine = x.a === tk.idx;
      last = { week: lr.w.weekNumber, opp: D.nm(mine ? x.b : x.a), my: mine ? x.sa : x.sb, their: mine ? x.sb : x.sa,
               res: x.res === 0 ? 0 : ((x.res > 0) === mine ? 1 : -1) };
    }
  }
  return { tk, teamCount: teams.length, myPts, myRank, size: tk.ids.length, isCap: tk.cap === pid,
           share: tk.raw > 0 ? Math.round(myPts / tk.raw * 100) : 0, duel, duelCount: D.rows.length, last };
}

// مسیر رتبه‌ی هفتگی: رتبه‌ی تجمعی در جدول کل فصل در پایان هر هفته + رتبه و امتیاز خود همان هفته
function weeklyRankTrend(pid){
  const out = [];
  let prev = null;
  getWeekList().forEach(w => {
    const wm = filteredPlayedMatches("all", null, w.key);
    if(!wm.length) return;
    const until = maxSeqOf(wm);
    const cum = computeStandings("all", null, null, { untilSeq: until }).standings.find(x => x.id === pid);
    const wk = computeStandings("all", null, w.key).standings.find(x => x.id === pid);
    if(!cum) return;
    out.push({ n: w.weekNumber, label: w.label, rank: cum.rank, total: cum.points,
               wRank: wk ? wk.rank : null, wPts: wk ? wk.points : 0, delta: prev === null ? null : prev - cum.rank });
    prev = cum.rank;
  });
  return out;
}
function weeklyRankSummary(tr){
  if(!tr.length) return null;
  const best = tr.reduce((a, b) => b.rank < a.rank ? b : a, tr[0]);
  const jump = tr.filter(t => t.delta !== null && t.delta > 0).reduce((a, b) => (!a || b.delta > a.delta) ? b : a, null);
  return { best, jump, last: tr[tr.length - 1], first: tr[0] };
}
function buildWeeklyRankSvg(pid){
  const tr = weeklyRankTrend(pid);
  if(tr.length < 2) return { empty: true, html: "" };
  const N = PARTICIPANTS.length, n = tr.length;
  const ranks = tr.map(t => t.rank);
  const lo = Math.max(1, Math.min(...ranks) - 1), hi = Math.min(N, Math.max(...ranks) + 1);
  const W = 640, H = 230, pad = { l: 34, r: 22, t: 30, b: 30 };
  const x = i => pad.l + (n === 1 ? 0 : i * (W - pad.l - pad.r) / (n - 1));
  const y = r => pad.t + (hi === lo ? 0.5 : (r - lo) / (hi - lo)) * (H - pad.t - pad.b);
  const fa = toPersianDigits;
  const ticks = Array.from(new Set([lo, Math.round((lo + hi) / 2), hi]));
  let g = ticks.map(r => `<line x1="${pad.l}" y1="${y(r)}" x2="${W - pad.r}" y2="${y(r)}" stroke="#2A3A30"/><text x="${pad.l - 8}" y="${y(r) + 4}" text-anchor="end" font-size="12" fill="#9CAA9F">${fa(r)}</text>`).join("");
  const pts = tr.map((t, i) => `${x(i)},${y(t.rank)}`).join(" ");
  const showAll = (W - pad.l - pad.r) / (n - 1) >= 30;
  let dots = "";
  tr.forEach((t, i) => {
    const col = t.delta === null || t.delta === 0 ? "var(--gold-soft)" : t.delta > 0 ? "#7FC79E" : "#E0836C";
    dots += `<circle cx="${x(i)}" cy="${y(t.rank)}" r="5" fill="${col}" stroke="#0E1812" stroke-width="2"/>`;
    if(showAll || i === 0 || i === n - 1) dots += `<text x="${x(i)}" y="${y(t.rank) - 11}" text-anchor="middle" font-size="14" font-weight="700" fill="#F4F8F4">${fa(t.rank)}</text>`;
    dots += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#9CAA9F">${fa(t.n)}</text>`;
  });
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;">${g}<polyline points="${pts}" fill="none" stroke="var(--gold-soft)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
  const sm = weeklyRankSummary(tr);
  const arrow = d => d === null ? "—" : d > 0 ? `<span style="color:#7FC79E">▲${fa(d)}</span>` : d < 0 ? `<span style="color:#E0836C">▼${fa(-d)}</span>` : "＝";
  const rows = tr.slice().reverse().map(t => `<tr><td style="padding:3px 0;">هفته ${fa(t.n)}</td><td style="text-align:center;">رتبه <b>${fa(t.rank)}</b> ${arrow(t.delta)}</td><td style="text-align:left;color:var(--text-dim);">${t.wPts ? fa(t.wPts) + " امتیاز (رتبه‌ی هفته " + fa(t.wRank) + ")" : "—"}</td></tr>`).join("");
  const html = `<div style="font-size:13px;margin-bottom:6px;">بهترین رتبه: <b>${fa(sm.best.rank)}</b> (هفته ${fa(sm.best.n)}) • رتبه‌ی فعلی: <b>${fa(sm.last.rank)}</b>${sm.jump ? ` • بیشترین صعود: <span style="color:#7FC79E">▲${fa(sm.jump.delta)}</span> در هفته ${fa(sm.jump.n)}` : ""}</div>${svg}
    <table style="width:100%;font-size:13px;border-collapse:collapse;margin-top:6px;">${rows}</table>`;
  return { empty: false, html };
}

    const cg = ctx.createLinearGradient(0, my - 22, 0, my + 22); cg.addColorStop(0, c1); cg.addColorStop(1, c2);
    ctx.beginPath(); ctx.arc(colR - 250, my, 22, 0, Math.PI * 2); ctx.fillStyle = cg; ctx.fill();
    ctx.textAlign = "center"; ctx.fillStyle = ink; fit(fa(t.rank), 40, 24, true); ctx.fillText(fa(t.rank), colR - 250, my + 9);
    const d = t.delta; ctx.font = F(24, true); ctx.fillStyle = d === null ? DIM : d > 0 ? GREEN : d < 0 ? RED : DIM;
    ctx.fillText(d === null ? "—" : d > 0 ? "▲" + fa(d) : d < 0 ? "▼" + fa(-d) : "＝", colR - 400, my + 9);
    ctx.fillStyle = LIGHT; ctx.font = F(24, true); ctx.fillText(fa(t.total), colR - 560, my + 9);
    ctx.fillStyle = t.wPts ? "#F8E58B" : DIM; ctx.fillText(t.wPts ? fa(t.wPts) : "—", colR - 700, my + 9);
    ctx.fillStyle = DIM; ctx.font = F(22, false); ctx.fillText(t.wPts ? fa(t.wRank) : "—", colR - 830, my + 9);
  });

  // فوتر
  const [jy, jm, jd] = todayJalali();
  ctx.textAlign = "center"; ctx.fillStyle = GOLD; ctx.font = F(20, true); ctx.fillText("⚽ هنگویه اسپورت", width / 2, height - 36);
  ctx.fillStyle = "#6F8074"; ctx.font = F(14, false); ctx.fillText(`کارت مسیر رتبه — ${fa(jd)} ${PERSIAN_MONTHS[jm - 1]} ${fa(jy)}`, width / 2, height - 14);
  const url = canvas.toDataURL("image/png");
  if(!url || url.length < 1000) return showToast("ساخت عکس روی این دستگاه ناموفق بود");
  const a = document.createElement("a"); a.href = url; a.download = `کارت-مسیر-رتبه-${person.name}.png`; a.click();
}

function profileCupRows(pid){
  const n = toPersianDigits, rows = [];
  try{
    const D = cupData();
    if(D.draw && D.draw.includes(pid)){
      let wins = 0, st = "قهرمان", tone = "g";
      for(const rd of D.rounds){
        const P = rd.pairs.find(x => x.a === pid || x.b === pid);
        if(!P || P.winner === undefined || P.winner === null){ st = "در جریان — " + rd.name; tone = "d"; break; }
        if(P.winner === pid){ if(!P.bye) wins++; }
        else if(rd.r === D.R - 1){ st = "نائب قهرمان"; tone = "y"; break; }
        else{ st = "حذف در " + rd.name; tone = "r"; break; }
      }
      rows.push({ label: "جام حذفی", name: st, value: n(wins) + " برد", tone });
    }
    const c = ucInit(), br = ucBracket(), g = c.groups.findIndex(gr => gr.includes(pid));
    const G = g >= 0 ? br.gs[g] : null;
    if(G){
      const k = G.rows.findIndex(r => r.pid === pid), gr = G.rows[k];
      let st, tone = "d", val = n(gr.pts) + " امتیاز", wins = 0;
      if(!G.done) st = `مرحله‌ی گروهی — گروه ${UC_LETTERS[g]} • رتبه‌ی ${n(k + 1)} (فعلی)`;
      else if(k >= 2){ st = k === 2 ? "حذف در گروه به عنوان تیم سوم" : "حذف در گروه به عنوان تیم چهارم"; tone = "r"; }
      else{
        const find = arr => arr.find(x => x.a === pid || x.b === pid);
        const res = m => !m || !m.winner ? "p" : (m.winner === pid ? "w" : "l");
        for(const [arr, lost, nm] of [[br.r16, "حذف در یک هشتم نهایی", "یک هشتم نهایی"], [br.qf, "حذف در یک چهارم نهایی", "یک چهارم نهایی"]]){
          const x = res(find(arr));
          if(x === "p"){ st = "در جریان — " + nm; break; }
          if(x === "l"){ st = lost; tone = "r"; break; }
          wins++;
        }
        if(!st){
          const x = res(find(br.sf));
          if(x === "p") st = "در جریان — نیمه‌نهایی";
          else if(x === "w"){
            wins++; const f = res(br.fin);
            if(f === "p") st = "در جریان — فینال";
            else if(f === "w"){ wins++; st = "قهرمان"; tone = "g"; }
            else{ st = "نائب قهرمان"; tone = "y"; }
          }else{
            const t = res(br.third);
            if(t === "p") st = "در جریان — دیدار رده‌بندی";
            else if(t === "w"){ st = "سوم"; tone = "y"; }
            else{ st = "چهارم"; tone = "r"; }
          }
        }
        val = n(wins) + " برد";
      }
      rows.push({ label: "فرامرزان کاپ", name: st, value: val, tone });
    }
  }catch(e){}
  return rows;
}

async function generateProfileCard(pid){
  const person = PARTICIPANTS.find(p => p.id === pid);
  if(!person) return;
  showToast("در حال ساخت کارت...");
  try{ await document.fonts.load("bold 20px Vazirmatn"); await document.fonts.load("16px Vazirmatn"); }catch(e){}

  const { playedMatches, matrix } = pointsMatrix();
  const total = playedMatches.reduce((sum, m) => sum + (matrix[m.id][pid] || 0), 0);
  const { standings: allStandings } = computeStandings("all");
  const personRow = allStandings.find(s => s.id === pid);
  const seasonRank = personRow ? personRow.rank : null;
  const personAvg = personRow ? personRow.average : 0;
  const avgAll = overallAverage();
  const avgDiff = personAvg - avgAll;
  const accuracy = accuracyPct(pid);
  const teamStats = teamStatsForPerson(pid);
  const streak = bestStreak(pid);
  const tournamentRanks = tournamentRanksForPerson(pid).slice().sort((a, b) => a.rank - b.rank || b.points - a.points);
  const weeklyTop3 = weeklyTop3ForPerson(pid);
  const { counts: distCounts, total: distTotal } = personDistribution(pid);
  const club = state.clubs[pid];
  const tpi = teamProfileInfo(pid);

  // ---- رنگ‌ها و فونت‌ها ----
  const GOLD = "#EBD27A", GOLD_DK = "#B9902E", DIM = "#9DB0A3", LIGHT = "#F4F8F4";
  const GREEN = "#7FD1A3", RED = "#EA8D75", BLUE = "#94BCE6";
  const PANEL_BG = "#121D16", PANEL_BORDER = "#26392D", CHIP_BG = "#0C150F";
  const FONTF = "Vazirmatn, Tahoma, sans-serif";
  const F = (px, bold) => `${bold ? "bold " : ""}${px}px ${FONTF}`;
  const MED = { 1: ["#F8E58B", "#C99A2E", "#3A2A00"], 2: ["#EEF2F6", "#9AA7B0", "#1F2A30"], 3: ["#EBB98C", "#B06B34", "#2E1704"] };

  function roundRectPath(ctx, x, y, w, h, r){
    if(typeof r === "number") r = { tl:r, tr:r, br:r, bl:r };
    ctx.beginPath();
    ctx.moveTo(x + r.tl, y);
    ctx.lineTo(x + w - r.tr, y);
    ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
    ctx.lineTo(x + w, y + h - r.br);
    ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
    ctx.lineTo(x + r.bl, y + h);
    ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
    ctx.lineTo(x, y + r.tl);
    ctx.arcTo(x, y, x + r.tl, y, r.tl);
    ctx.closePath();
  }

  // ---- بخش‌ها ----
  const sections = [];
  if(tpi){
    const n = toPersianDigits;
    const dl = tpi.duel;
    const lastTxt = tpi.last
      ? `آخرین دوئل (هفته ${n(tpi.last.week)}): ${tpi.last.res > 0 ? "برد" : tpi.last.res < 0 ? "باخت" : "مساوی"} مقابل ${tpi.last.opp} (${tpi.last.my} - ${tpi.last.their})`
      : (dl ? `پوئن مثبت ${fmtS(dl.pf)} • پوئن منفی ${fmtS(dl.pa)}` : "");
    sections.push({ icon: "👥", title: `تیم شما: ${tpi.isCap ? "👑 " : ""}${tpi.tk.name}`, type: "grp", full: true, cards: [
      dl ? { head: "هُنگوکاپ", rank: dl.rank, of: tpi.duelCount, value: n(dl.pts),
        sub: `${n(dl.w)} برد • ${n(dl.d)} مساوی • ${n(dl.l)} باخت`, foot: lastTxt, win: tpi.last ? tpi.last.res : null } : null,
      { head: "سهم شما در تیم", rank: tpi.myRank, of: tpi.size, value: fmtS(tpi.myPts),
        sub: `${n(tpi.share)}٪ از امتیاز تیم`, foot: `رتبه‌ی شما در تیم: ${n(tpi.myRank)} از ${n(tpi.size)}` }
    ].filter(Boolean) });
  }
  sections.push({ icon: "📈", title: "آمار کلی", type: "grid", items: [
    { label: "دقت پیش‌بینی", value: `${toPersianDigits(accuracy)}٪`, color: GOLD },
    { label: "رکورد متوالی", value: `${toPersianDigits(streak)} بازی`, color: GREEN },
    { label: "میانگین شما", value: toPersianDigits(personAvg.toFixed(1)), color: LIGHT },
    { label: "نسبت به میانگین کل", value: `${avgDiff >= 0 ? "▲" : "▼"} ${toPersianDigits(Math.abs(avgDiff).toFixed(1))}`, color: avgDiff >= 0 ? GREEN : RED },
  ]});

  const cupRows = profileCupRows(pid);
  if(cupRows.length){
    const TC = { g: GREEN, r: RED, y: GOLD, d: LIGHT };
    sections.push({ icon: "🏆", title: "عملکرد در جام‌ها", type: "teams", items: cupRows.map(r => ({ label: r.label, name: r.name, value: r.value, color: TC[r.tone], dot: TC[r.tone] })) });
  }

  if(tournamentRanks.length){
    const MAXT = 8;
    const items = tournamentRanks.slice(0, MAXT).map(tr => ({ rank: tr.rank, name: tr.tournament, points: tr.points, total: tr.total, leader: tr.leader }));
    if(tournamentRanks.length > MAXT) items.push({ more: true, name: `و ${toPersianDigits(tournamentRanks.length - MAXT)} تورنمنت دیگر` });
    sections.push({ icon: "🏆", title: "عملکرد در تورنمنت‌ها", type: "tourn", full: true, items });
  }

  sections.push({ icon: "📊", title: `توزیع امتیازها در ${toPersianDigits(distTotal)} مسابقه`, type: "bars", items: [
    { label: "دقیق (۲۰)", value: distCounts[20] || 0, color: GOLD },
    { label: "نزدیک (۱۳)", value: distCounts[13] || 0, color: GREEN },
    { label: "معمولی (۸)", value: distCounts[8] || 0, color: BLUE },
    { label: "بدون امتیاز", value: distCounts[0] || 0, color: DIM },
  ]});

  if(weeklyTop3.length){
    const shown = weeklyTop3.slice(0, 5);
    const items = shown.map(w => ({ medal: w.rank === 1 ? "🥇" : w.rank === 2 ? "🥈" : "🥉", name: w.label, value: `${toPersianDigits(w.points)} امتیاز`, gold: true }));
    if(weeklyTop3.length > 5) items.push({ medal: "…", name: `و ${toPersianDigits(weeklyTop3.length - 5)} مورد دیگر`, value: "", gold: false, dim: true });
    sections.push({ icon: "📅", title: `افتخارات هفتگی — ${toPersianDigits(weeklyTop3.length)} بار در ۳ نفر برتر`, type: "list", items });
  }


  // ---- ابعاد ----
  const width = 1080;
  const OUTER = 24, CARD_PAD = 20, SEC_GAP = 18, COL_GAP = 20, TITLE_H = 34;
  const headerH = 282, footerH = 64;
  const halfW = (width - OUTER * 2 - COL_GAP) / 2;
  const fullW = width - OUTER * 2;
  const TROW = 84, TMORE = 46;

  function contentH(sec){
    if(sec.type === "grid"){ const rows = Math.ceil(sec.items.length / 2); return rows * 82 + (rows - 1) * 14; }
    if(sec.type === "teams") return sec.items.length * 68;
    if(sec.type === "bars") return sec.items.length * 48;
    if(sec.type === "list") return sec.items.length * 48;
    if(sec.type === "grp") return 158;
    if(sec.type === "tourn") return sec.items.reduce((s, it) => s + (it.more ? TMORE : TROW), 0);
    return 0;
  }
  sections.forEach(sec => { sec.h = CARD_PAD * 2 + TITLE_H + 14 + contentH(sec); });

  const colH = [0, 0];
  sections.forEach(sec => {
    if(sec.full){
      const start = Math.max(colH[0], colH[1]);
      sec.col = -1; sec.y = headerH + start;
      colH[0] = colH[1] = start + sec.h + SEC_GAP;
    }else{
      const col = colH[0] <= colH[1] ? 0 : 1;
      sec.col = col; sec.y = headerH + colH[col];
      colH[col] += sec.h + SEC_GAP;
    }
  });
  const height = headerH + Math.max(colH[0], colH[1]) + footerH;

  // ---- بوم ----
  const canvas = document.createElement("canvas");
  const scale = 3;
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.direction = "rtl";
  ctx.textBaseline = "alphabetic";

  const fit = (t, max, size, bold) => { let z = size; do { ctx.font = F(z, bold); z--; } while(ctx.measureText(t).width > max && z > 10); };

  // پس‌زمینه
  const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
  bgGrad.addColorStop(0, "#1D3224");
  bgGrad.addColorStop(0.3, "#14231A");
  bgGrad.addColorStop(1, "#0A120D");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, width, height);
  // راه‌راه چمن
  for(let i = 0; i < width; i += 120){ ctx.fillStyle = "rgba(255,255,255,0.014)"; ctx.fillRect(i, 0, 60, height); }
  // دایره و خط وسط زمین پشت هدر
  ctx.strokeStyle = "rgba(255,255,255,0.055)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(width / 2, 130, 170, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 130); ctx.lineTo(width, 130); ctx.stroke();

  const glow = (gx, gy, rr, col) => {
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, rr);
    g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(gx - rr, gy - rr, rr * 2, rr * 2);
  };
  glow(width / 2, 90, 520, "rgba(235,210,122,0.20)");
  glow(width, 0, 360, "rgba(127,209,163,0.09)");
  glow(0, height, 420, "rgba(235,210,122,0.07)");

  // نوار طلایی بالا
  const topBar = ctx.createLinearGradient(0, 0, width, 0);
  topBar.addColorStop(0, "rgba(235,210,122,0)"); topBar.addColorStop(0.5, "rgba(235,210,122,0.95)"); topBar.addColorStop(1, "rgba(235,210,122,0)");
  ctx.fillStyle = topBar; ctx.fillRect(0, 0, width, 5);

  // کادر کارت
  roundRectPath(ctx, 2, 2, width - 4, height - 4, 24);
  ctx.strokeStyle = "rgba(235,210,122,0.38)"; ctx.lineWidth = 2; ctx.stroke();

  const cx = width / 2;

  // نام (بزرگ)
  ctx.textAlign = "center"; ctx.fillStyle = LIGHT;
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 10;
  fit(person.name, width - 120, 76, true);
  ctx.fillText(person.name, cx, 100);
  ctx.shadowBlur = 0;
  if(club && club.name){
    ctx.fillStyle = DIM; ctx.font = F(20, false);
    ctx.fillText(club.name, cx, 134);
  }

  // دو پیل بزرگ: امتیاز کل / رتبه فصل
  const pillY = 156, pillH = 88;
  const totalTxt = `🏆 ${toPersianDigits(total)} امتیاز`;
  const rankTxt = seasonRank ? `رتبه ${toPersianDigits(seasonRank)} از ${toPersianDigits(allStandings.length)}` : "بدون رتبه";
  let fs1 = 48, fs2 = 44, w1, w2;
  const gapP = 22;
  do{
    ctx.font = F(fs1, true); w1 = ctx.measureText(totalTxt).width + 84;
    ctx.font = F(fs2, true); w2 = ctx.measureText(rankTxt).width + 76;
    if(w1 + w2 + gapP <= width - 70) break;
    fs1 -= 2; fs2 -= 2;
  }while(fs1 > 24);
  const allW = w1 + w2 + gapP;
  let px = cx - allW / 2;

  ctx.save();
  ctx.shadowColor = "rgba(235,210,122,0.55)"; ctx.shadowBlur = 20;
  roundRectPath(ctx, px, pillY, w1, pillH, pillH / 2);
  const pg = ctx.createLinearGradient(px, 0, px + w1, 0);
  pg.addColorStop(0, "#F8E58B"); pg.addColorStop(1, GOLD_DK);
  ctx.fillStyle = pg; ctx.fill();
  ctx.restore();
  ctx.fillStyle = "#1B2116"; ctx.font = F(fs1, true); ctx.textAlign = "center";
  ctx.fillText(totalTxt, px + w1 / 2, pillY + pillH / 2 + fs1 * 0.34);

  px += w1 + gapP;
  roundRectPath(ctx, px, pillY, w2, pillH, pillH / 2);
  ctx.fillStyle = "rgba(235,210,122,0.1)"; ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3.5; ctx.stroke();
  ctx.fillStyle = GOLD; ctx.font = F(fs2, true);
  ctx.fillText(rankTxt, px + w2 / 2, pillY + pillH / 2 + fs2 * 0.34);

  // جداکننده‌ی هدر
  const dg = ctx.createLinearGradient(OUTER, 0, width - OUTER, 0);
  dg.addColorStop(0, "rgba(235,210,122,0)"); dg.addColorStop(0.5, "rgba(235,210,122,0.5)"); dg.addColorStop(1, "rgba(235,210,122,0)");
  ctx.strokeStyle = dg; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(OUTER, headerH - 10); ctx.lineTo(width - OUTER, headerH - 10); ctx.stroke();

  // ---- پنل‌ها ----
  sections.forEach(sec => {
    const full = sec.col === -1;
    const x0 = full ? OUTER : OUTER + sec.col * (halfW + COL_GAP), w0 = full ? fullW : halfW, h0 = sec.h, y = sec.y;

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
    roundRectPath(ctx, x0, y, w0, h0, 18);
    const pgr = ctx.createLinearGradient(x0, y, x0, y + h0);
    pgr.addColorStop(0, "#17251C"); pgr.addColorStop(1, PANEL_BG);
    ctx.fillStyle = pgr; ctx.fill();
    ctx.restore();
    roundRectPath(ctx, x0, y, w0, h0, 18);
    ctx.strokeStyle = full ? "rgba(235,210,122,0.45)" : PANEL_BORDER; ctx.lineWidth = full ? 1.8 : 1.2; ctx.stroke();
    roundRectPath(ctx, x0, y, w0, 4, { tl:18, tr:18, br:0, bl:0 });
    ctx.fillStyle = full ? "rgba(235,210,122,0.8)" : "rgba(235,210,122,0.5)"; ctx.fill();

    // عنوان
    ctx.textAlign = "right"; ctx.fillStyle = GOLD;
    fit(`${sec.icon} ${sec.title}`, w0 - CARD_PAD * 2, full ? 24 : 20, true);
    ctx.fillText(`${sec.icon} ${sec.title}`, x0 + w0 - CARD_PAD, y + CARD_PAD + 22);

    const contentY = y + CARD_PAD + TITLE_H + 14;
    const iX0 = x0 + CARD_PAD, iX1 = x0 + w0 - CARD_PAD;

    if(sec.type === "grid"){
      const colW = (iX1 - iX0 - 14) / 2;
      sec.items.forEach((it, i) => {
        const col = i % 2, row = Math.floor(i / 2);
        const chx = iX1 - col * (colW + 14) - colW, chy = contentY + row * 96;
        roundRectPath(ctx, chx, chy, colW, 82, 14);
        ctx.fillStyle = CHIP_BG; ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1; ctx.stroke();
        ctx.textAlign = "center"; ctx.fillStyle = DIM; ctx.font = F(15, false);
        ctx.fillText(it.label, chx + colW / 2, chy + 28);
        ctx.fillStyle = it.color; fit(it.value, colW - 20, 30, true);
        ctx.fillText(it.value, chx + colW / 2, chy + 65);
      });
    }else if(sec.type === "teams"){
      sec.items.forEach((it, i) => {
        const rowY = contentY + i * 68 + 14;
        ctx.beginPath(); ctx.arc(iX1 - 8, rowY + 8, 8, 0, Math.PI * 2); ctx.fillStyle = it.dot; ctx.fill();
        ctx.textAlign = "right"; ctx.fillStyle = DIM; ctx.font = F(15, false);
        ctx.fillText(it.label, iX1 - 26, rowY + 4);
        ctx.fillStyle = LIGHT; fit(it.name, w0 - CARD_PAD * 2 - 110, 22, true);
        ctx.fillText(it.name, iX1 - 26, rowY + 34);
        ctx.textAlign = "left"; ctx.fillStyle = it.color; ctx.font = F(24, true);
        ctx.fillText(it.value, iX0, rowY + 34);
      });
    }else if(sec.type === "grp"){
      const cw = (iX1 - iX0 - 18) / sec.cards.length, ch = 152;
      sec.cards.forEach((c, i) => {
        const cx1 = iX1 - i * (cw + 18), cx0 = cx1 - cw, top3 = c.rank <= 3;
        roundRectPath(ctx, cx0, contentY, cw, ch, 18);
        ctx.fillStyle = CHIP_BG; ctx.fill();
        if(top3){ roundRectPath(ctx, cx0, contentY, cw, ch, 18); const rg = ctx.createLinearGradient(cx1, 0, cx0, 0); rg.addColorStop(0, "rgba(235,210,122,0.15)"); rg.addColorStop(1, "rgba(235,210,122,0.02)"); ctx.fillStyle = rg; ctx.fill(); }
        roundRectPath(ctx, cx0, contentY, cw, ch, 18);
        ctx.strokeStyle = top3 ? "rgba(235,210,122,0.6)" : "rgba(255,255,255,0.08)"; ctx.lineWidth = top3 ? 1.8 : 1.2; ctx.stroke();
        // عنوان کوچک
        ctx.textAlign = "right"; ctx.fillStyle = GOLD; ctx.font = F(17, true);
        ctx.fillText(c.head, cx1 - 22, contentY + 30);
        // دایره‌ی رتبه
        const [c1, c2, ink] = MED[c.rank] || ["#3C7A55", "#285038", "#EAF4EC"];
        const my = contentY + 80, gcg = ctx.createLinearGradient(0, my - 34, 0, my + 34);
        gcg.addColorStop(0, c1); gcg.addColorStop(1, c2);
        ctx.save(); if(top3){ ctx.shadowColor = "rgba(235,210,122,0.45)"; ctx.shadowBlur = 12; }
        ctx.beginPath(); ctx.arc(cx1 - 56, my, 34, 0, Math.PI * 2); ctx.fillStyle = gcg; ctx.fill(); ctx.restore();
        ctx.textAlign = "center"; ctx.fillStyle = ink; ctx.font = F(36, true);
        ctx.fillText(toPersianDigits(c.rank), cx1 - 56, my + 13);
        ctx.fillStyle = DIM; ctx.font = F(13, false);
        ctx.fillText(`از ${toPersianDigits(c.of)} تیم`, cx1 - 56, my + 56);
        // امتیاز بزرگ
        ctx.textAlign = "right"; ctx.fillStyle = top3 ? "#F8E58B" : LIGHT; fit(c.value, 150, 44, true);
        ctx.fillText(c.value, cx1 - 112, my + 6);
        ctx.fillStyle = DIM; ctx.font = F(16, false);
        ctx.fillText("امتیاز", cx1 - 112, my + 30);
        // توضیح
        ctx.textAlign = "left"; ctx.fillStyle = LIGHT; fit(c.sub, cw - 330, 18, true);
        ctx.fillText(c.sub, cx0 + 22, my + 4);
        if(c.foot){
          ctx.fillStyle = c.win > 0 ? GREEN : c.win < 0 ? RED : DIM;
          fit(c.foot, cw - 330, 15, false);
          ctx.fillText(c.foot, cx0 + 22, my + 32);
        }
      });
    }else if(sec.type === "tourn"){
      let ry = contentY;
      const innerW = iX1 - iX0;
      sec.items.forEach(it => {
        if(it.more){
          ctx.textAlign = "center"; ctx.fillStyle = DIM; ctx.font = F(17, false);
          ctx.fillText(it.name, (iX0 + iX1) / 2, ry + 26);
          ry += TMORE; return;
        }
        const top3 = it.rank <= 3, rh = TROW - 12;
        // پس‌زمینه‌ی ردیف
        roundRectPath(ctx, iX0, ry, innerW, rh, 18);
        if(top3){
          const rg = ctx.createLinearGradient(iX1, 0, iX0, 0);
          rg.addColorStop(0, "rgba(235,210,122,0.16)"); rg.addColorStop(1, "rgba(235,210,122,0.03)");
          ctx.fillStyle = CHIP_BG; ctx.fill();
          roundRectPath(ctx, iX0, ry, innerW, rh, 18); ctx.fillStyle = rg; ctx.fill();
          roundRectPath(ctx, iX0, ry, innerW, rh, 18); ctx.strokeStyle = "rgba(235,210,122,0.6)"; ctx.lineWidth = 1.8; ctx.stroke();
        }else{
          ctx.fillStyle = CHIP_BG; ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.07)"; ctx.lineWidth = 1.2; ctx.stroke();
        }
        const midY = ry + rh / 2;
        // دایره‌ی رتبه
        const [c1, c2, ink] = MED[it.rank] || ["#3C7A55", "#285038", "#EAF4EC"];
        const cg = ctx.createLinearGradient(0, midY - 30, 0, midY + 30);
        cg.addColorStop(0, c1); cg.addColorStop(1, c2);
        ctx.save();
        if(top3){ ctx.shadowColor = "rgba(235,210,122,0.45)"; ctx.shadowBlur = 12; }
        ctx.beginPath(); ctx.arc(iX1 - 42, midY, 29, 0, Math.PI * 2); ctx.fillStyle = cg; ctx.fill();
        ctx.restore();
        ctx.textAlign = "center"; ctx.fillStyle = ink; ctx.font = F(32, true);
        ctx.fillText(toPersianDigits(it.rank), iX1 - 42, midY + 12);
        // نام تورنمنت
        const nameX = iX1 - 90;
        ctx.textAlign = "right"; ctx.fillStyle = top3 ? "#F8E58B" : LIGHT;
        fit(it.name, 380, 27, true);
        ctx.fillText(it.name, nameX, midY - 4);
        // زیرنویس
        const gap = (it.leader || 0) - it.points;
        const sub = it.rank === 1
          ? `🥇 نفر اول از ${toPersianDigits(it.total)} نفر`
          : `رتبه ${toPersianDigits(it.rank)} از ${toPersianDigits(it.total)} نفر — ${toPersianDigits(gap)} امتیاز تا نفر اول`;
        ctx.fillStyle = DIM; fit(sub, 400, 16, false);
        ctx.fillText(sub, nameX, midY + 24);
        // نوار نسبت به نفر اول
        const bx1 = iX1 - 90 - 400, bx0 = iX0 + 170, bw = Math.max(40, bx1 - bx0), bh = 14, by = midY - bh / 2;
        roundRectPath(ctx, bx0, by, bw, bh, 7); ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fill();
        const ratio = it.leader > 0 ? Math.max(0.04, Math.min(1, it.points / it.leader)) : 1;
        const fw = bw * ratio;
        roundRectPath(ctx, bx1 - fw, by, fw, bh, 7);
        const bg2 = ctx.createLinearGradient(bx1 - fw, 0, bx1, 0);
        const barCol = top3 ? ["#B9902E", "#F8E58B"] : ["#2D8659", "#7FD1A3"];
        bg2.addColorStop(0, barCol[0]); bg2.addColorStop(1, barCol[1]);
        ctx.fillStyle = bg2; ctx.fill();
        // امتیاز
        ctx.textAlign = "left"; ctx.fillStyle = top3 ? "#F8E58B" : LIGHT; fit(toPersianDigits(it.points), 130, 38, true);
        ctx.fillText(toPersianDigits(it.points), iX0 + 24, midY + 3);
        ctx.fillStyle = DIM; ctx.font = F(15, false);
        ctx.fillText("امتیاز", iX0 + 24, midY + 24);
        ry += TROW;
      });
    }else if(sec.type === "bars"){
      const max = Math.max(1, ...sec.items.map(it => it.value));
      const labelW = 118, trackX0 = iX0 + 44, trackX1 = iX1 - labelW - 6, trackW = trackX1 - trackX0;
      sec.items.forEach((it, i) => {
        const rowY = contentY + i * 48;
        ctx.textAlign = "right"; ctx.fillStyle = DIM; ctx.font = F(16, false);
        ctx.fillText(it.label, iX1, rowY + 17);
        roundRectPath(ctx, trackX0, rowY, trackW, 24, 12); ctx.fillStyle = CHIP_BG; ctx.fill();
        if(it.value > 0){
          const barW = Math.max(24, trackW * (it.value / max));
          roundRectPath(ctx, trackX1 - barW, rowY, barW, 24, 12);
          const bgr = ctx.createLinearGradient(trackX1 - barW, 0, trackX1, 0);
          bgr.addColorStop(0, it.color + "99"); bgr.addColorStop(1, it.color);
          ctx.fillStyle = bgr; ctx.fill();
        }
        ctx.textAlign = "left"; ctx.fillStyle = GOLD; ctx.font = F(20, true);
        ctx.fillText(toPersianDigits(it.value), iX0, rowY + 19);
      });
    }else if(sec.type === "list"){
      sec.items.forEach((it, i) => {
        const rowY = contentY + i * 48 + 22;
        if(!it.dim){
          ctx.beginPath(); ctx.arc(iX1 - 17, rowY - 6, 17, 0, Math.PI * 2);
          ctx.fillStyle = it.gold ? "rgba(235,210,122,0.16)" : "rgba(148,188,230,0.14)"; ctx.fill();
        }
        ctx.textAlign = "center"; ctx.fillStyle = it.gold ? GOLD : BLUE; ctx.font = F(19, true);
        ctx.fillText(it.medal, iX1 - 17, rowY);
        ctx.textAlign = "right"; ctx.fillStyle = it.dim ? DIM : LIGHT;
        fit(it.name, w0 - CARD_PAD * 2 - 170, 18, !it.dim);
        ctx.fillText(it.name, iX1 - 44, rowY);
        if(it.value){
          ctx.textAlign = "left"; ctx.fillStyle = DIM; ctx.font = F(16, false);
          ctx.fillText(it.value, iX0, rowY);
        }
      });
    }
  });

  // فوتر
  const [jy, jm, jd] = todayJalali();
  ctx.strokeStyle = dg; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(OUTER + 40, height - footerH + 6); ctx.lineTo(width - OUTER - 40, height - footerH + 6); ctx.stroke();
  ctx.textAlign = "center"; ctx.fillStyle = GOLD; ctx.font = F(20, true);
  ctx.fillText("⚽ هنگویه اسپورت", width / 2, height - 30);
  ctx.fillStyle = "#6F8074"; ctx.font = F(14, false);
  ctx.fillText(`کارت پروفایل — ${toPersianDigits(jd)} ${PERSIAN_MONTHS[jm - 1]} ${toPersianDigits(jy)}`, width / 2, height - 10);

  const url = canvas.toDataURL("image/png");
  const a = document.createElement("a");
  a.href = url;
  a.download = `کارت-پروفایل-${person.name}.png`;
  a.click();
}

function renderWeeklyStandings(weekKey, weekLabel){
  const { standings, matchesCount } = computeStandings("all", null, weekKey);
  const dl = rankDeltas("all", null, weekKey);
  if(matchesCount === 0){
    return `<div class="empty">هنوز مسابقه‌ای با نتیجه برای این هفته ثبت نشده.</div>`;
  }
  return `
    <div class="points-legend" style="margin:8px 0;">${toPersianDigits(matchesCount)} مسابقه در ${weekLabel}</div>
    <div class="row" style="margin-bottom:4px;">
      <button class="ghost" id="exportWeekImageBtn" data-week="${weekKey}" data-week-label="${weekLabel}">📸 دانلود عکس جدول</button>
      <button class="ghost" id="exportWeekTop6Btn" data-week="${weekKey}" data-week-label="${weekLabel}">🌟 کارت ۶ نفر برتر</button>
      <button class="ghost" id="exportWeekCardBtn" data-week="${weekKey}" data-week-label="${weekLabel}">🖼 کارت هفتگی</button>
      <button class="ghost" id="waWeekBtn" data-week="${weekKey}" data-week-label="${weekLabel}">💬 متن واتساپ</button>
      <button class="ghost" id="txtWeekBtn" data-week="${weekKey}" data-week-label="${weekLabel}">📄 خروجی TXT</button>
    </div>
    ${deltaNoteHtml(dl)}
    <table>
      <thead><tr><th>رتبه</th><th class="delta"></th><th>نام و نام خانوادگی</th><th>امتیاز</th></tr></thead>
      <tbody id="weekStandingsBody">
        ${standings.map(r => `
          <tr>
            <td class="rank-cell">${toPersianDigits(r.rank)}</td>
            ${deltaCellHtml(dl, r.id)}
            <td>${medalFor(r.rank)}${prizeMark("w", weekKey, r.id)}${r.name}</td>
            <td>${toPersianDigits(r.points)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

// آواتار پروفایل: نشان باشگاه محبوب ثبت‌شده، یا در نبود آن یک دایره با حرف اول اسم
function clubAvatarHtml(pid, size){
  size = size || 44;
  const person = PARTICIPANTS.find(p => p.id === pid);
  const initial = person ? person.name.charAt(0) : "";
  const club = state.clubs[pid];
  if(club && club.badge){
    return `<div class="club-avatar" style="width:${size}px;height:${size}px;"><img src="${club.badge}" alt="${club.name}" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='<span class=&quot;initial&quot;>${initial}</span>'"></div>`;
  }
  return `<div class="club-avatar" style="width:${size}px;height:${size}px;"><span class="initial">${initial}</span></div>`;
}

function pendingPredsFor(pid){
  const list = SHARE ? (SHARE.pend || []) : state.matches.filter(m => !matchHasResult(m));
  const PP = SHARE ? (SHARE.pendPreds || {}) : state.predictions;
  const ok = v => v !== null && v !== undefined && v !== "";
  return list.map(m => ({ m, pred: (PP[m.id] || {})[pid] })).filter(x => x.pred && ok(x.pred.h) && ok(x.pred.a));
}

function openProfile(pid){
  const person = PARTICIPANTS.find(p => p.id === pid);
  if(!person) return;
  const { playedMatches, matrix } = pointsMatrix();
  const total = playedMatches.reduce((sum, m) => sum + (matrix[m.id][pid] || 0), 0);
  const accuracy = accuracyPct(pid);
  const rankChart = buildRankChartSvg(pid);
  const weekTrend = buildWeeklyRankSvg(pid);
  const badges = badgesForPerson(pid);
  const teamStats = teamStatsForPerson(pid);
  const streak = bestStreak(pid);
  const { standings: allStandingsForAvg } = computeStandings("all");
  const personRow = allStandingsForAvg.find(s => s.id === pid);
  const personAvg = personRow ? personRow.average : 0;
  const seasonRank = personRow ? personRow.rank : null;
  const avgAll = overallAverage();
  const avgDiff = personAvg - avgAll;
  const tournamentRanks = tournamentRanksForPerson(pid);
  const weeklyTop3 = weeklyTop3ForPerson(pid);
  const club = state.clubs[pid];
  const tpi = teamProfileInfo(pid);

  const fa = toPersianDigits;
  const okv = v => v !== null && v !== undefined;
  const shortLbl = { 20: "دقیق", 13: "نزدیک", 8: "معمولی", 0: "بدون امتیاز" };
  const lblCls = { 20: "tag-gold", 13: "tag-emerald", 8: "tag-blue", 0: "tag-dim" };
  const rowsHtml = playedMatches.slice().reverse().map(m => {
    const pred = (state.predictions[m.id] || {})[pid];
    const pts = matrix[m.id][pid] || 0;
    const has = pred && okv(pred.h) && okv(pred.a);
    return `
      <div class="pf-match">
        <div class="pf-m-main">
          <div class="pf-m-teams">${m.home} <span class="pf-vs">–</span> ${m.away}</div>
          <div class="pf-m-meta">${m.date ? m.date + " · " : ""}نتیجه: <b>${fa(m.homeScore)} - ${fa(m.awayScore)}</b></div>
        </div>
        <div class="pf-m-side">
          <div class="pf-pred ${has ? "" : "pf-pred-none"}">${has ? fa(pred.h) + " - " + fa(pred.a) : "ثبت نشده"}</div>
          <span class="tag ${lblCls[pts] || "tag-dim"}">${shortLbl[pts] !== undefined ? shortLbl[pts] : "بدون امتیاز"}${pts > 0 ? " · " + fa(pts) : ""}</span>
        </div>
      </div>`;
  }).join("");
  const pend = pendingPredsFor(pid);
  const pendHtml = pend.slice().reverse().map(x => `
      <div class="pf-match pf-pending">
        <div class="pf-m-main">
          <div class="pf-m-teams">${x.m.home} <span class="pf-vs">–</span> ${x.m.away}</div>
          <div class="pf-m-meta">${x.m.date || ""}${x.m.tournament ? (x.m.date ? " · " : "") + x.m.tournament : ""}</div>
        </div>
        <div class="pf-m-side">
          <div class="pf-pred">${fa(x.pred.h)} - ${fa(x.pred.a)}</div>
          <span class="tag tag-blue">در انتظار نتیجه</span>
        </div>
      </div>`).join("");

  const sec = (title, body, extra) => body ? `<section class="pf-sec"><h3 class="pf-h">${title}${extra || ""}</h3>${body}</section>` : "";
  const tile = (label, value, sub) => `<div class="pf-tile"><div class="pf-tile-v">${value}</div><div class="pf-tile-l">${label}</div>${sub ? `<div class="pf-tile-s">${sub}</div>` : ""}</div>`;
  const line = (k, v) => `<div class="pf-line"><span class="pf-k">${k}</span><span class="pf-val">${v}</span></div>`;

  const tilesHtml = playedMatches.length === 0 ? "" : `
    <div class="pf-tiles">
      ${tile("امتیاز کل", fa(total))}
      ${tile("رتبه در فصل", seasonRank ? fa(seasonRank) : "—", seasonRank ? "از " + fa(allStandingsForAvg.length) : "")}
      ${tile("دقت پیش‌بینی", fa(accuracy) + "٪", "از " + fa(playedMatches.length) + " مسابقه")}
      ${tile("بهترین رکورد پیاپی", fa(streak), "مسابقه با امتیاز")}
    </div>`;

  const teamBody = tpi ? `
      ${line("تیم", (tpi.isCap ? "👑 " : "") + tpi.tk.name)}
      ${line("سهم از امتیاز تیم", `<span class="stat-num">${fmtS(tpi.myPts)}</span> امتیاز · رتبه ${fa(tpi.myRank)} از ${fa(tpi.size)}`)}
      ${tpi.duel ? line("هُنگوکاپ", `رتبه ${fa(tpi.duel.rank)} از ${fa(tpi.duelCount)} · <span class="stat-num">${fa(tpi.duel.pts)}</span> امتیاز<div class="pf-subline">${fa(tpi.duel.w)} برد · ${fa(tpi.duel.d)} مساوی · ${fa(tpi.duel.l)} باخت</div>`) : ""}` : "";
  const cupLine = cupPersonLine(pid);
  const badgesBody = badges.length ? `<div class="pf-chips">${badges.map(b => `<span class="pf-chip">${b}</span>`).join("")}</div>` : "";
  const avgBody = playedMatches.length ? `
      ${line("میانگین شخصی", `<span class="stat-num">${fa(personAvg.toFixed(1))}</span>`)}
      ${line("میانگین کل", `<span class="stat-num">${fa(avgAll.toFixed(1))}</span>`)}
      ${line("اختلاف", `<span class="${avgDiff >= 0 ? "pf-up" : "pf-down"}">${avgDiff >= 0 ? "▲" : "▼"} ${fa(Math.abs(avgDiff).toFixed(1))} امتیاز ${avgDiff >= 0 ? "بالاتر" : "پایین‌تر"}</span>`)}` : "";
  const teamStatBody = teamStats ? (teamStats.sameTeam
      ? line("تیم", `${teamStats.best.name} · <span class="stat-num">${fa(teamStats.best.avg.toFixed(1))}</span> میانگین`)
      : line("بهترین تیم", `${teamStats.best.name} · <span class="stat-num">${fa(teamStats.best.avg.toFixed(1))}</span>`) + line("بدترین تیم", `${teamStats.worst.name} · <span class="stat-num">${fa(teamStats.worst.avg.toFixed(1))}</span>`)) : "";
  const tourBody = tournamentRanks.length ? `<div class="pf-trs">${tournamentRanks.map(r => {
    const cls = r.rank <= 3 ? " g" + r.rank : "";
    const pct = r.leader > 0 ? Math.max(4, Math.min(100, Math.round(r.points / r.leader * 100))) : 0;
    const gap = r.rank === 1 ? "👑 صدرنشین" : `${fa(Math.round((r.leader - r.points) * 10) / 10)} امتیاز تا صدر`;
    return `<div class="pf-tr${cls}"><div class="pf-tr-rank">${r.rank <= 3 ? ["🥇","🥈","🥉"][r.rank - 1] : fa(r.rank)}</div><div class="pf-tr-main"><div class="pf-tr-top"><span class="pf-tr-name">${r.tournament}</span><span class="pf-tr-pts"><b>${fa(r.points)}</b>امتیاز</span></div><div class="pf-tr-bar"><i style="width:${pct}%"></i></div><div class="pf-tr-sub"><span>رتبه ${fa(r.rank)} از ${fa(r.total)} نفر</span><span>${gap}</span></div></div></div>`;
  }).join("")}</div>` : "";
  const wkBody = weeklyTop3.length ? weeklyTop3.map(w => line(w.label, `${medalFor(w.rank)} رتبه ${fa(w.rank)} · <span class="stat-num">${fa(w.points)}</span> امتیاز`)).join("") : "";

  const html = `
    <div class="modal-overlay" id="profileOverlay">
      <div class="modal-panel pf">
        <div class="modal-head pf-head">
          <div class="pf-who">
            ${clubAvatarHtml(pid, 52)}
            <div class="pf-name"><h2>${person.name}</h2>${club && club.name ? `<div class="pf-club">${club.name}</div>` : ""}</div>
          </div>
          <button class="ghost" id="closeProfileBtn">✕</button>
        </div>
        <div class="club-row">
          <input type="text" id="clubInput" list="clubDatalist" placeholder="باشگاه محبوب اروپایی..." value="${club ? club.name : ""}">
          <datalist id="clubDatalist">
            ${POPULAR_CLUBS.map(c => `<option value="${c.fa}">`).join("")}
          </datalist>
          <button class="ghost" id="saveClubBtn">ثبت باشگاه</button>
          <button class="ghost" id="downloadProfileCardBtn">📸 دانلود کارت پروفایل</button>
          <button class="ghost" id="downloadRankPathBtn">📈 کارت مسیر رتبه</button>
          <button class="ghost" onclick="copyTxt(profileWaText('${pid}'))">💬 متن واتساپ</button>
        </div>
        ${tilesHtml}
        ${sec("👥 تیم و عملکرد تیمی", teamBody)}
        ${sec("🏆 جام حذفی", cupLine ? `<div class="pf-text">${cupLine}</div>` : "")}
        ${sec("🎖 مدال‌ها", badgesBody)}
        ${sec("📊 مقایسه با میانگین", avgBody)}
        ${sec("🎯 بهترین و بدترین تیم برای پیش‌بینی", teamStatBody)}
        ${sec("🌍 جایگاه در تورنمنت‌ها", tourBody)}
        ${sec("📅 حضور در جمع ۳ نفر برتر هفته", wkBody, ` <span class="pf-count">${fa(weeklyTop3.length)} بار</span>`)}
        ${playedMatches.length === 0 ? "" : sec("📈 مسیر رتبه", (weekTrend.empty ? "" : `<div class="pf-chart"><div class="pf-cap">رتبه‌ی تجمعی در پایان هر هفته</div>${weekTrend.html}</div>`) + (rankChart.empty ? "" : `<div class="pf-chart"><div class="pf-cap">روند تغییر رتبه در طول فصل</div>${rankChart.svg}</div>`))}
        ${playedMatches.length === 0 ? "" : sec("🤝 سر به سر با یک نفر دیگر", `<select onchange="profileH2h('${pid}', this.value)"><option value="">— انتخاب کن —</option>${PARTICIPANTS.filter(p => p.id !== pid).map(p => `<option value="${p.id}">${p.name}</option>`).join("")}</select><div id="h2hOut"></div>`)}
        ${sec("⏳ پیش‌بینی‌های در انتظار نتیجه", pendHtml, ` <span class="pf-count">${fa(pend.length)} مسابقه</span>`)}
        ${playedMatches.length === 0
          ? (pend.length ? "" : `<div class="empty">هنوز مسابقه‌ای با نتیجه ثبت نشده.</div>`)
          : sec("⚽ مسابقات دارای نتیجه", buildDistributionBars(pid) + rowsHtml, ` <span class="pf-count">${fa(playedMatches.length)} مسابقه</span>`)}
      </div>
    </div>`;
  document.getElementById("modalRoot").innerHTML = html;
  document.getElementById("closeProfileBtn").onclick = closeProfile;
  document.getElementById("profileOverlay").onclick = (e) => {
    if(e.target.id === "profileOverlay") closeProfile();
  };
  document.getElementById("saveClubBtn").onclick = () => {
    setPersonClub(pid, document.getElementById("clubInput").value);
  };
  document.getElementById("downloadProfileCardBtn").onclick = () => generateProfileCard(pid);
  document.getElementById("downloadRankPathBtn").onclick = () => generateRankPathCard(pid);
  applyShareMode();
  if(SHARE && !state.modalNav){ state.modalNav = true; navSave({ m: 1 }); }
}

function closeProfile(){
  if(SHARE && state.modalNav){ try{ history.back(); return; }catch(e){ state.modalNav = false; } }
  document.getElementById("modalRoot").innerHTML = "";
}

// ===== جام حذفی (یک‌در‌برابر‌یک، از هفته‌ی شروع) =====
// قرعه فقط یک‌بار ذخیره می‌شود (state.cup.draw)؛ بقیه‌ی چیز (امتیاز هر هفته، برنده‌ها، دورها) هر بار از روی پیش‌بینی‌ها محاسبه می‌شود.
function CUP_DEFAULT(){ return { startWeek: 11, draw: null, drawnAt: 0 }; }
state.cup = CUP_DEFAULT();
state.cupRound = null;
state.pendingByWeek = {};
async function saveCup(){ try{ await storageSet("league:cup", JSON.stringify(state.cup)); }catch(e){ showToast("خطا در ذخیره جام حذفی"); } }

function cupRand(n){ try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }catch(e){ return Math.floor(Math.random() * n); } }
function cupBuildDraw(){
  const ids = PARTICIPANTS.map(p => p.id);
  for(let i = ids.length - 1; i > 0; i--){ const j = cupRand(i + 1); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  let size = 2; while(size < ids.length) size *= 2;
  const byes = size - ids.length, pairs = []; let k = 0;
  for(let i = 0; i < byes; i++) pairs.push([ids[k++], null]);
  while(k < ids.length){ pairs.push([ids[k], ids[k + 1]]); k += 2; }
  for(let i = pairs.length - 1; i > 0; i--){ const j = cupRand(i + 1); [pairs[i], pairs[j]] = [pairs[j], pairs[i]]; }
  return pairs.flat();
}

function cupRoundName(r, R){
  if(r === R - 1) return "فینال";
  if(r === R - 2) return "نیمه‌نهایی";
  if(r === R - 3) return "یک‌چهارم نهایی";
  if(r === R - 4) return "یک‌هشتم نهایی";
  if(r === R - 5) return "یک‌شانزدهم نهایی";
  return r === 0 ? "دور نخست" : "دور " + ordinalFa(r + 1);
}

// وضعیت یک هفته‌ی مسابقه: future (هنوز نتیجه‌ای نیست) / live (بعضی بازی‌ها مانده) / done (همه‌ی بازی‌ها نتیجه دارند)
function cupWeek(wn){
  const w = getWeekList().find(x => x.weekNumber === wn);
  if(!w) return { status: "future", w: null, ms: [], pend: 0, played: 0 };
  const ms = state.matches.filter(m => matchHasResult(m) && (getMatchWeekInfo(m) || {}).key === w.key);
  const pend = SHARE ? ((state.pendingByWeek || {})[w.key] || 0)
    : state.matches.filter(m => !matchHasResult(m) && (getMatchWeekInfo(m) || {}).key === w.key).length;
  return { status: !ms.length ? "future" : (pend > 0 || !weekIsFull(w)) ? "live" : "done", w, ms, pend, played: ms.length };
}
const cupWeekPts = (pid, ms) => ms.reduce((s, m) => s + calcPoints((state.predictions[m.id] || {})[pid], m), 0);
// رتبه‌ی هر نفر در جدول کل تا پایان آخرین بازی همان هفته (برای تساوی)
function cupRankMap(ms){
  const until = maxSeqOf(ms);
  const o = {}; computeStandings("all", null, null, { untilSeq: until }).standings.forEach(r => { o[r.id] = r.rank; });
  return o;
}

// حداکثر امتیازی که نفر عقب‌تر می‌تواند در یک بازی بیشتر از نفر جلوتر بگیرد (با امتحان همه‌ی نتیجه‌های ممکن)
function cupMaxGain(pl, pt){
  const ok = p => p && p.h != null && p.a != null;
  if(!ok(pl) || !ok(pt)) return 20;
  const lim = Math.max(pl.h, pl.a, pt.h, pt.a) + 3;
  let best = 0;
  for(let h = 0; h <= lim; h++) for(let a = 0; a <= lim; a++){
    const m = { homeScore: h, awayScore: a };
    best = Math.max(best, calcPoints(pt, m) - calcPoints(pl, m));
  }
  return best;
}
function cupData(){
  const c = state.cup || CUP_DEFAULT(), sw = +c.startWeek || 11;
  const draw = Array.isArray(c.draw) && c.draw.length >= 2 ? c.draw : null;
  if(!draw) return { sw, draw: null, rounds: [], champion: null, R: 0 };
  const R = Math.round(Math.log2(draw.length)), rounds = [];
  let slots = draw.slice();
  for(let r = 0; r < R; r++){
    const cw = cupWeek(sw + r), pairs = [], next = []; let rk = null;
    for(let i = 0; i < slots.length; i += 2){
      const a = slots[i], b = slots[i + 1];
      const P = { a, b, sa: null, sb: null, winner: undefined, tie: false, tieBy: null, bye: false };
      if(a === undefined || b === undefined){ /* حریف هنوز مشخص نیست */ }
      else if(a == null || b == null){ P.bye = true; P.winner = a == null ? b : a; }
      else{
        if(cw.played){ P.sa = cupWeekPts(a, cw.ms); P.sb = cupWeekPts(b, cw.ms); }
        // قطعی‌شدن: اختلاف از بیشترین امتیازی که حریف با بازی‌های باقی‌مانده‌ی هفته می‌تواند بگیرد (۲۰ در هر بازی) بیشتر باشد
        if(cw.status === "live" && P.sa != null && P.sa !== P.sb && cw.w){
          const diff = Math.abs(P.sa - P.sb), naive = 20 * weekRemaining(cw.w);
          let gain = naive;
          if(!SHARE){ // فقط نسخه‌ی مدیر: تحلیل پیش‌بینی‌های ثبت‌شده برای بازی‌های باقی‌مانده
            const lead = P.sa > P.sb ? a : b, trail = lead === a ? b : a;
            const um = state.matches.filter(m => !matchHasResult(m) && (getMatchWeekInfo(m) || {}).key === cw.w.key);
            const unknown = Math.max(0, weekRemaining(cw.w) - um.length);
            gain = um.reduce((t, m) => t + cupMaxGain((state.predictions[m.id] || {})[lead], (state.predictions[m.id] || {})[trail]), 0) + 20 * unknown;
            P.gain = gain; P.diff = diff; P.unknown = unknown;
          }
          P.decided = diff > gain; P.early = P.decided && !(diff > naive);
        }
        if(cw.status === "done"){
          if(P.sa !== P.sb) P.winner = P.sa > P.sb ? a : b;
          else{
            P.tie = true; rk = rk || cupRankMap(cw.ms);
            if(rk[a] !== rk[b]){ P.winner = rk[a] < rk[b] ? a : b; P.tieBy = "rank"; }
            else{ P.winner = draw.indexOf(a) < draw.indexOf(b) ? a : b; P.tieBy = "draw"; }
          }
        }
      }
      pairs.push(P); next.push(P.winner);
    }
    rounds.push({ r, wn: sw + r, status: cw.status, pend: cw.w ? weekRemaining(cw.w) : cw.pend, pairs, name: cupRoundName(r, R) });
    slots = next;
  }
  const fin = rounds[R - 1].pairs[0];
  return { sw, draw, rounds, R, champion: fin && fin.winner ? fin.winner : null };
}

function cupCurrentRound(D){
  if(state.cupRound != null && D.rounds[state.cupRound]) return state.cupRound;
  const i = D.rounds.findIndex(r => r.status !== "done");
  return i < 0 ? D.R - 1 : i;
}
function cupSel(r){ state.cupRound = r; render(); }

async function cupAct(kind, v){
  if(SHARE) return;
  if(kind === "start"){
    if(cupData().draw) return showToast("بعد از قرعه‌کشی، هفته‌ی شروع قابل تغییر نیست");
    const w = parseInt(faDigits(v), 10);
    if(!(w >= 1)) return render();
    state.cup.startWeek = w; await saveCup(); state.cupRound = null; render(); return;
  }
  if(kind === "draw"){
    const D = cupData();
    if(D.draw) return showToast("قرعه‌کشی قبلاً انجام شده و قابل تکرار نیست");
    if(!confirm("قرعه‌کشی جام حذفی انجام شود؟\n\nبعد از انجام، قرعه ثابت می‌ماند و دیگر قابل تکرار نیست.")) return;
    state.cup.draw = cupBuildDraw(); state.cup.drawnAt = Date.now(); state.cupRound = 0;
    await saveCup(); render(); showToast("قرعه‌کشی انجام شد 🎲");
  }
}

const cupWho = pid => pid === undefined ? `<span style="color:var(--text-dim)">؟ (هنوز مشخص نیست)</span>` : pid == null ? `<span style="color:var(--text-dim)">— (بای)</span>`
  : `<button class="nameLink" onclick="openProfile('${pid}')" style="width:auto;display:inline;">${pname(pid)}</button>`;

function cupPairHtml(P, done){
  const lead = !done && P.sa != null && P.sb != null && P.sa !== P.sb ? (P.sa > P.sb ? P.a : P.b) : null;
  const cls = pid => P.winner != null ? (P.winner === pid ? "win" : "lose") : (lead && lead === pid ? "lead" : "");
  const team = pid => `<div class="cup-team ${cls(pid)}">${P.winner != null && P.winner === pid && !P.bye ? `<span class="cup-trophy">🏆</span>` : ""}<span>${cupWho(pid)}</span></div>`;
  let mid;
  if(P.bye) mid = `<div class="cup-box vs">بای</div>`;
  else if(P.sa == null || P.sb == null) mid = `<div class="cup-box vs">VS</div>`;
  else mid = `<div class="cup-box ${P.tie || (!done && P.sa === P.sb) ? "tie" : ""}"><span>${fmtS(P.sa)}</span><i>-</i><span>${fmtS(P.sb)}</span></div>${P.decided ? `<div class="cup-sure">✅ قطعی شد</div>` : ""}`;
  let note = "";
  if(P.bye) note = "بدون حریف؛ مستقیم به دور بعد می‌رود";
  else if(P.tie && P.tieBy === "rank") note = `تساوی در امتیاز؛ ${pname(P.winner)} به‌دلیل رتبه‌ی بالاتر در جدول کل صعود کرد`;
  else if(P.tie) note = `تساوی در امتیاز و رتبه؛ ${pname(P.winner)} بر اساس ترتیب قرعه صعود کرد`;
  else if(!done && P.sa != null && P.sa === P.sb) note = "فعلاً مساوی";
  if(!done && !SHARE && P.gain != null && !P.bye) note = P.decided
    ? `✅ قطعی شد — اختلاف ${fmtS(P.diff)} از حداکثر جبران ممکن (${fmtS(P.gain)}) بیشتر است${P.early ? " • با تحلیل پیش‌بینی‌ها زودتر قطعی شد" : ""}`
    : `هنوز باز است — حداکثر جبران ممکن ${fmtS(P.gain)} امتیاز، اختلاف فعلی ${fmtS(P.diff)}`;
  if(!done && !SHARE && P.unknown > 0 && !P.bye) note += ` • ${fmtS(P.unknown)} بازی هنوز ثبت نشده و با بدترین حالت (۲۰ امتیاز جبران) حساب شد`;
  return `<div class="stat-block cup-pair"><div class="cup-duel">${team(P.a)}<div class="cup-mid">${mid}</div>${team(P.b)}</div>${note ? `<div class="cup-note">${note}</div>` : ""}</div>`;
}

function cupBracketHtml(D){
  const nmS = pid => pid === undefined ? "؟" : pid == null ? "بای" : pname(pid);
  return `<div class="bracket">${D.rounds.map(rd => `<div class="bracket-col"><h4>${rd.name}</h4><div class="bm-list">${rd.pairs.map(P => {
    const row = (pid, sc) => `<div class="${P.winner != null && P.winner === pid ? "win" : ""}"><span>${nmS(pid)}</span><b>${sc == null || pid == null ? "" : fmtS(sc)}</b></div>`;
    return `<div class="bm">${row(P.a, P.sa)}${row(P.b, P.sb)}</div>`;
  }).join("")}</div></div>`).join("")}</div>`;
}

function cupStatusText(rd){
  const n = toPersianDigits;
  return rd.status === "done" ? "✅ نتیجه‌ی این دور قطعی شد"
    : rd.status === "live" ? `⏳ در جریان — ${leftTxt(rd.pend)}؛ امتیازها لحظه‌ای است` + (() => { const real = rd.pairs.filter(P => !P.bye && P.a != null && P.b != null); const k = real.filter(P => P.decided).length; return real.length ? ` • ${n(k)} از ${n(real.length)} دوئل قطعی شده` : ""; })()
    : `🕐 هنوز شروع نشده (هفته‌ی ${n(rd.wn)})`;
}

function renderCupTab(){
  const n = toPersianDigits, D = cupData(), admin = !SHARE;
  const adminBox = admin && !D.draw ? `<div class="row" style="align-items:center;margin-top:10px;">شروع از هفته‌ی <input type="number" min="1" style="width:70px" value="${D.sw}" onchange="cupAct('start',this.value)">
      <button class="primary" onclick="cupAct('draw')">🎲 قرعه‌کشی</button></div>` : "";
  const head = adminBox ? `<div class="card"><h2>🏆 جام حذفی</h2>${adminBox}</div>` : "";
  if(!D.draw) return head + `<div class="card"><div class="empty">${admin ? "هنوز قرعه‌کشی انجام نشده. با دکمه‌ی «قرعه‌کشی» بالای صفحه حریف‌ها مشخص می‌شوند." : "قرعه‌کشی هنوز انجام نشده؛ به‌زودی در گروه اعلام می‌شود."}</div></div>`;

  const cur = cupCurrentRound(D), rd = D.rounds[cur];

      <div style="font-size:20px;font-weight:800;color:var(--gold-soft);">${cupWho(D.champion)}</div></div>` : "";
  const tabs = `<div class="cup-rtabs">${D.rounds.map(x => `<button class="${x.r === cur ? "on" : ""}" onclick="cupSel(${x.r})">${x.name}${x.status === "done" ? " ✓" : ""}</button>`).join("")}</div>`;
  const wa = admin ? `<div class="row"><button class="ghost" onclick="copyTxt(cupDrawWaText())">💬 متن قرعه‌کشی</button>
      <button class="ghost" onclick="copyTxt(cupRoundWaText(${cur}))">💬 متن ${rd.name}</button>
      <button class="ghost" onclick="cupRoundCard(${cur})">📸 کارت ${rd.name}</button></div>` : "";
  return head + champ + `<div class="card"><h2>${rd.name} — هفته‌ی ${n(rd.wn)}</h2>${tabs}
    <div class="points-legend" style="margin-bottom:10px;">${cupStatusText(rd)}</div>${wa}
    ${rd.pairs.map(P => cupPairHtml(P, rd.status === "done")).join("")}</div>
    <div class="card"><h2>نمودار جدول حذفی</h2><div class="points-legend" style="margin-bottom:8px;">برای دیدن همه‌ی دورها صفحه را به چپ و راست بکشید.</div>${admin ? `<div class="row"><button class="ghost" onclick="cupBracketCard()">📸 براکت کامل</button>${D.R > 2 ? `<button class="ghost" onclick="cupBracketCard(0, 2)">📸 براکت دو دور اول</button>` : ""}${cur > 0 ? `<button class="ghost" onclick="cupBracketCard(${cur})">📸 براکت از ${rd.name}</button>` : ""}</div>` : ""}${cupBracketHtml(D)}</div>`;
}

// ---- کارت‌های تصویری جام حذفی ----
const cupCardName = pid => pid === undefined ? "؟" : pid == null ? "بای" : pname(pid);
const CUP_WIN = "#F2D77A", CUP_DIM = "#8FA196", CUP_LEAD = "#7FD6A6";

// کارت براکت دو طرفه: نیمی از قرعه سمت چپ، نیمی سمت راست، فینال وسط
function cupBracketCardTwo(D, from, RS){
  const n = toPersianDigits, R = RS.length, partial = RS[R - 1].pairs.length > 1, K = partial ? R : R - 1, z = partial && K <= 2 ? 1.25 : 1;
  const bw = 270 * z, gx = 40, m = 40, bwc = partial ? 0 : 320, rowH = 50 * z, bh = rowH * 2, step = bh + 14, top = 215;
  const half0 = RS[0].pairs.length / 2;
  const W = 2 * m + 2 * K * (bw + gx) + bwc, H = top + half0 * step + 150;
  const B = duelCanvasBase(W, H, from ? `🏆 جام حذفی — براکت ${RS[0].name}` : "🏆 جام حذفی هنگویه اسپورت", `${from ? "ادامه‌ی جدول از " : "نمودار جدول حذفی • از "}هفته‌ی ${n(RS[0].wn)}`);
  const { ctx, rr, fit, FONT } = B;
  const lx = r => m + r * (bw + gx), cx = m + K * (bw + gx), rs = cx + bwc + gx, rx = r => rs + (K - 1 - r) * (bw + gx);
  const cyL = [], cyR = [];
  for(let r = 0; r < K; r++){
    const len = RS[r].pairs.length / 2; cyL[r] = []; cyR[r] = [];
    for(let k = 0; k < len; k++){
      cyL[r][k] = r === 0 ? top + k * step + bh / 2 : (cyL[r - 1][2 * k] + cyL[r - 1][2 * k + 1]) / 2;
      cyR[r][k] = r === 0 ? top + k * step + bh / 2 : (cyR[r - 1][2 * k] + cyR[r - 1][2 * k + 1]) / 2;
    }
  }
  const fy = partial ? 0 : cyL[K - 1][0];
  ctx.strokeStyle = "rgba(228,200,96,0.38)"; ctx.lineWidth = 2;
  const link = (x1, x2, ya, yb, yn) => { const mx = (x1 + x2) / 2; ctx.beginPath(); ctx.moveTo(x1, ya); ctx.lineTo(mx, ya); ctx.lineTo(mx, yb); ctx.lineTo(x1, yb); ctx.moveTo(mx, yn); ctx.lineTo(x2, yn); ctx.stroke(); };
  for(let r = 0; r < K - 1; r++) for(let k = 0; k < RS[r + 1].pairs.length / 2; k++){
    link(lx(r) + bw, lx(r + 1), cyL[r][2 * k], cyL[r][2 * k + 1], cyL[r + 1][k]);
    link(rx(r), rx(r + 1) + bw, cyR[r][2 * k], cyR[r][2 * k + 1], cyR[r + 1][k]);
  }
  if(!partial){ ctx.beginPath(); ctx.moveTo(lx(K - 1) + bw, fy); ctx.lineTo(cx, fy); ctx.moveTo(rx(K - 1), fy); ctx.lineTo(cx + bwc, fy); ctx.stroke(); }
  const head = (x, w, rd) => {
    ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; ctx.font = "bold 26px " + FONT; ctx.fillText(rd.name, x + w / 2, 176);
    ctx.fillStyle = "#8FA196"; ctx.font = "15px " + FONT; ctx.fillText(`هفته‌ی ${n(rd.wn)}` + (rd.status === "live" ? " • در جریان" : ""), x + w / 2, 200);
  };
  const drawPair = (x, w, cyc, P) => {
    const y0 = cyc - bh / 2;
    rr(x, y0, w, bh, 12); ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fill(); ctx.strokeStyle = "rgba(228,200,96,0.4)"; ctx.lineWidth = 1.5; ctx.stroke();
    [[P.a, P.sa], [P.b, P.sb]].forEach(([pid, sc], i) => {
      const yy = y0 + i * rowH, win = P.winner != null && P.winner === pid, lose = P.winner != null && !win;
      const lead = P.winner === undefined && P.sa != null && P.sa !== P.sb && ((P.sa > P.sb ? P.a : P.b) === pid);
      if(win){ rr(x + 2, yy + 2, w - 4, rowH - 4, 9); ctx.fillStyle = "rgba(228,200,96,0.2)"; ctx.fill(); }
      ctx.fillStyle = win ? CUP_WIN : lead ? CUP_LEAD : lose || pid == null || pid === undefined ? CUP_DIM : "#FFFFFF";
      ctx.textAlign = "right"; fit(cupCardName(pid), w - 90 * z, 26 * z, true); ctx.fillText(cupCardName(pid), x + w - 12, yy + 34 * z);
      if(sc != null && pid != null){ ctx.textAlign = "left"; ctx.font = `bold ${26 * z}px ` + FONT; ctx.fillText(fmtS(sc), x + 14, yy + 34 * z); }
      ctx.lineWidth = 1;
    });
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.beginPath(); ctx.moveTo(x + 8, y0 + rowH); ctx.lineTo(x + w - 8, y0 + rowH); ctx.stroke();
  };
  for(let r = 0; r < K; r++){
    const len = RS[r].pairs.length / 2;
    head(lx(r), bw, RS[r]); head(rx(r), bw, RS[r]);
    for(let k = 0; k < len; k++){ drawPair(lx(r), bw, cyL[r][k], RS[r].pairs[k]); drawPair(rx(r), bw, cyR[r][k], RS[r].pairs[len + k]); }
  }
  if(!partial){ head(cx, bwc, RS[R - 1]); drawPair(cx, bwc, fy, RS[R - 1].pairs[0]); }
  if(!partial && D.champion){
    const x = cx + bwc / 2;
    ctx.textAlign = "center"; ctx.font = "64px " + FONT; ctx.fillStyle = "#FFFFFF"; ctx.fillText("🏆", x, fy - bh / 2 - 40);
    ctx.fillStyle = "#8FA196"; ctx.font = "16px " + FONT; ctx.fillText("قهرمان", x, fy + bh / 2 + 36);
    ctx.fillStyle = CUP_WIN; fit(pname(D.champion), bwc, 34, true); ctx.fillText(pname(D.champion), x, fy + bh / 2 + 76);
  }
  duelCanvasFooter(B, W, H);
  duelDownload(B.cv, partial ? "براکت-جام-حذفی-" + RS[0].name.replace(/\s+/g, "-") + "-تا-" + RS[R - 1].name.replace(/\s+/g, "-") : from ? "براکت-جام-حذفی-" + RS[0].name.replace(/\s+/g, "-") : "نمودار-جام-حذفی");
}

function cupBracketCard(from0, to0){
  const D = cupData(); if(!D.draw) return showToast("هنوز قرعه‌کشی انجام نشده");
  const from = Math.max(0, Math.min(+from0 || 0, D.R - 1)), RS = D.rounds.slice(from, to0 ? Math.min(+to0, D.R) : undefined), n = toPersianDigits, R = RS.length, bw = 300, gx = 70, rowH = 40, bh = rowH * 2, step = bh + 16;
  if(RS.length >= 2) return cupBracketCardTwo(D, from, RS);
  const top = 215, W = 80 + R * bw + (R - 1) * gx, H = top + RS[0].pairs.length * step + 110;
  const B = duelCanvasBase(W, H, from ? `🏆 جام حذفی — براکت ${RS[0].name}` : "🏆 جام حذفی هنگویه اسپورت", `${from ? "ادامه‌ی جدول از " : "نمودار جدول حذفی • از "}هفته‌ی ${n(RS[0].wn)}`);
  const { ctx, rr, fit, FONT } = B;
  const cy = [];
  RS.forEach((rd, r) => { cy[r] = rd.pairs.map((_, k) => r === 0 ? top + k * step + bh / 2 : (cy[r - 1][2 * k] + cy[r - 1][2 * k + 1]) / 2); });
  const bx = r => W - 40 - r * (bw + gx) - bw;
  // خطوط اتصال
  ctx.strokeStyle = "rgba(228,200,96,0.38)"; ctx.lineWidth = 2;
  for(let r = 0; r < R - 1; r++) for(let k = 0; k < RS[r + 1].pairs.length; k++){
    const x1 = bx(r), mx = x1 - gx / 2, x2 = bx(r + 1) + bw, ya = cy[r][2 * k], yb = cy[r][2 * k + 1], yn = cy[r + 1][k];
    ctx.beginPath(); ctx.moveTo(x1, ya); ctx.lineTo(mx, ya); ctx.lineTo(mx, yb); ctx.lineTo(x1, yb); ctx.moveTo(mx, yn); ctx.lineTo(x2, yn); ctx.stroke();
  }
  RS.forEach((rd, r) => {
    const x = bx(r);
    ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; ctx.font = "bold 26px " + FONT; ctx.fillText(rd.name, x + bw / 2, 176);
    ctx.fillStyle = "#8FA196"; ctx.font = "15px " + FONT; ctx.fillText(`هفته‌ی ${n(rd.wn)}` + (rd.status === "live" ? " • در جریان" : ""), x + bw / 2, 200);
    rd.pairs.forEach((P, k) => {
      const y0 = cy[r][k] - bh / 2;
      rr(x, y0, bw, bh, 12); ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fill(); ctx.strokeStyle = "rgba(228,200,96,0.4)"; ctx.lineWidth = 1.5; ctx.stroke();
      [[P.a, P.sa], [P.b, P.sb]].forEach(([pid, sc], i) => {
        const yy = y0 + i * rowH, win = P.winner != null && P.winner === pid, lose = P.winner != null && !win;
        const lead = P.winner === undefined && P.sa != null && P.sa !== P.sb && ((P.sa > P.sb ? P.a : P.b) === pid);
        if(win){ rr(x + 2, yy + 2, bw - 4, rowH - 4, 9); ctx.fillStyle = "rgba(228,200,96,0.2)"; ctx.fill(); }
        ctx.fillStyle = win ? CUP_WIN : lead ? CUP_LEAD : lose || pid == null || pid === undefined ? CUP_DIM : "#FFFFFF";
        ctx.textAlign = "right"; fit(cupCardName(pid), 195, 22, true); ctx.fillText(cupCardName(pid), x + bw - 12, yy + 28);
        if(sc != null && pid != null){ ctx.textAlign = "left"; ctx.font = "bold 24px " + FONT; ctx.fillText(fmtS(sc), x + 14, yy + 29); }
        ctx.lineWidth = 1;
      });
      ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.beginPath(); ctx.moveTo(x + 8, y0 + rowH); ctx.lineTo(x + bw - 8, y0 + rowH); ctx.stroke();
    });
  });
  if(D.champion){
    const x = bx(R - 1) + bw / 2, y = cy[R - 1][0];
    ctx.textAlign = "center"; ctx.font = "56px " + FONT; ctx.fillStyle = "#FFFFFF"; ctx.fillText("🏆", x, y - bh / 2 - 22);
    ctx.fillStyle = "#8FA196"; ctx.font = "16px " + FONT; ctx.fillText("قهرمان", x, y + bh / 2 + 32);
    ctx.fillStyle = CUP_WIN; fit(pname(D.champion), bw, 30, true); ctx.fillText(pname(D.champion), x, y + bh / 2 + 68);
  }
  duelCanvasFooter(B, W, H);
  duelDownload(B.cv, from ? "براکت-جام-حذفی-" + RS[0].name.replace(/\s+/g, "-") : "نمودار-جام-حذفی");
}

function cupRoundCard(r){
  const D = cupData(), rd = D.rounds[r]; if(!rd) return showToast("دور نامعتبر است");
  const n = toPersianDigits, P = rd.pairs, cnt = P.length;
  const big = cnt <= 4, mid = cnt <= 8, cardH = big ? 190 : mid ? 130 : 104, gap = big ? 22 : mid ? 14 : 10, nameSz = big ? 40 : mid ? 32 : 27;
  const champ = r === D.R - 1 ? D.champion : null;
  const W = 900, top = 170, H = top + cnt * (cardH + gap) + (champ ? 190 : 0) + 100;
  const stTxt = rd.status === "done" ? "نتیجه‌ی نهایی" : rd.status === "live" ? "وضعیت فعلی (در جریان)" : "برنامه‌ی دور";
  const B = duelCanvasBase(W, H, `🏆 جام حذفی — ${rd.name}`, `${stTxt} • هفته‌ی ${n(rd.wn)}`);
  const { ctx, rr, fit, FONT } = B;
  P.forEach((p, i) => {
    const y = top + i * (cardH + gap), midY = y + cardH / 2;
    rr(30, y, W - 60, cardH, big ? 24 : 18); ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fill(); ctx.strokeStyle = "rgba(228,200,96,0.4)"; ctx.lineWidth = 1.5; ctx.stroke();
    const lead = p.winner === undefined && p.sa != null && p.sa !== p.sb ? (p.sa > p.sb ? p.a : p.b) : null;
    const col = pid => p.winner != null && p.winner === pid ? CUP_WIN : lead && lead === pid ? CUP_LEAD : p.winner != null || pid == null || pid === undefined ? CUP_DIM : "#FFFFFF";
    [[p.a, W - 30 - 175], [p.b, 30 + 175]].forEach(([pid, cx]) => {
      const win = p.winner != null && p.winner === pid && !p.bye;
      ctx.textAlign = "center"; ctx.fillStyle = col(pid);
      const nm = (big ? "" : win ? "🏆 " : "") + cupCardName(pid);
      fit(nm, 300, nameSz, true); ctx.fillText(nm, cx, midY + (big ? 14 : 10));
      if(big && win){ ctx.font = "30px " + FONT; ctx.fillText("🏆", cx, y + 48); }
    });
    const bh2 = Math.min(104, cardH - 22);
    rr(W / 2 - 100, midY - bh2 / 2, 200, bh2, 20); ctx.fillStyle = p.tie ? "#3B4A40" : "#16381F"; ctx.fill(); ctx.strokeStyle = "rgba(228,200,96,0.7)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = "center"; ctx.fillStyle = "#FFFFFF";
    const t = p.bye ? "بای" : p.sa != null ? fmtS(p.sa) + " - " + fmtS(p.sb) : "VS";
    if(t === "VS") ctx.fillStyle = "#E4C860";
    fit(t, 180, big ? 52 : mid ? 40 : 32, true); ctx.fillText(t, W / 2, midY + (big ? 18 : 12));
    if(p.tie){ ctx.fillStyle = "#B7C4BA"; ctx.font = "bold " + (big ? 17 : 13) + "px " + FONT; ctx.fillText(p.tieBy === "rank" ? "تساوی • رتبه‌ی بالاتر" : "تساوی • قرعه", W / 2, y + cardH - (big ? 14 : 7)); }
  });
  if(champ){
    const y = top + cnt * (cardH + gap) + 10;
    rr(30, y, W - 60, 160, 24); ctx.fillStyle = "rgba(228,200,96,0.16)"; ctx.fill(); ctx.strokeStyle = "rgba(228,200,96,0.8)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = "center"; ctx.fillStyle = "#FFFFFF"; ctx.font = "50px " + FONT; ctx.fillText("🏆", W / 2, y + 60);
    ctx.fillStyle = "#B7C4BA"; ctx.font = "18px " + FONT; ctx.fillText("قهرمان جام حذفی", W / 2, y + 92);
    ctx.fillStyle = CUP_WIN; fit(pname(champ), W - 120, 44, true); ctx.fillText(pname(champ), W / 2, y + 140);
  }
  duelCanvasFooter(B, W, H);
  duelDownload(B.cv, "جام-حذفی-" + rd.name.replace(/\s+/g, "-"));
}

// ---- متن واتساپ ----
function cupLineText(P){
  const f = x => fmtS(x);
  if(P.bye) return `${pname(P.winner)} — بای (مستقیم صعود می‌کند)`;
  const a = P.a == null ? "؟" : pname(P.a), b = P.b == null ? "؟" : pname(P.b);
  if(P.sa == null) return `${a} ⚔️ ${b}`;
  const tag = P.tie ? (P.tieBy === "rank" ? " _(تساوی؛ رتبه‌ی بالاتر صعود کرد)_" : " _(تساوی؛ بر اساس قرعه)_") : "";
  return `${P.winner === P.a ? "🏆 " : ""}${a} ${f(P.sa)} - ${f(P.sb)} ${P.winner === P.b ? "🏆 " : ""}${b}${tag}${P.decided ? " ✅ _قطعی_" : ""}`;
}
function cupDrawWaText(){
  const D = cupData(), n = toPersianDigits; if(!D.draw) return "";
  const rd = D.rounds[0];
  return [`🏆 *قرعه‌کشی جام حذفی هنگویه اسپورت*\n_${rd.name} — هفته‌ی ${n(rd.wn)}_`,
    rd.pairs.map((P, i) => `${n(i + 1)}. ` + (P.bye ? `${pname(P.winner)} — بای` : `${pname(P.a)} ⚔️ ${pname(P.b)}`)).join("\n\n"),
    "موفق باشید! 💪", "_هنگویه اسپورت_"].join("\n\n");
}
function cupRoundWaText(r){
  const D = cupData(), n = toPersianDigits, rd = D.rounds[r]; if(!rd) return "";
  const B = [];
  if(rd.status === "done") B.push(`🏆 *نتیجه‌ی نهایی ${rd.name} جام حذفی*\n_هفته‌ی ${n(rd.wn)}_`);
  else if(rd.status === "live") B.push(`🏆 *وضعیت فعلی ${rd.name} جام حذفی*\n_هفته‌ی ${n(rd.wn)} — ${n(rd.pend)} بازی باقی مانده است_`);
  else B.push(`🏆 *برنامه‌ی ${rd.name} جام حذفی*\n_هفته‌ی ${n(rd.wn)}_`);
  B.push(rd.pairs.map(cupLineText).join("\n\n"));
  if(rd.status === "done"){
    if(r < D.R - 1){
      const nx = D.rounds[r + 1], ws = rd.pairs.map(P => P.winner).filter(x => x != null);
      B.push(`🚀 *به ${nx.name} رسیدند (${n(ws.length)} نفر):*\n${ws.map(pname).join("، ")}`);
    }else if(D.champion){ const fp = rd.pairs[0], ru = fp.a === D.champion ? fp.b : fp.a; B.push(`👑 *قهرمان جام حذفی هنگویه اسپورت: ${pname(D.champion)}* 🎉\n🥈 *نایب‌قهرمان: ${pname(ru)}*`); }

// امتیاز هر نفر در یک مسابقه برای مقاصد تیمی (همان امتیاز واقعی پیش‌بینی)
function teamMatchPoints(m){
  const pr = state.predictions[m.id] || {};
  const raw = {};
  PARTICIPANTS.forEach(p => { raw[p.id] = calcPoints(pr[p.id], m); });
  return raw;
}

function teamStats(){
  const sw = +state.teams.startWeek || 1;
  const weeks = getWeekList().filter(w => w.weekNumber >= sw);
  const wk = new Set(weeks.map(w => w.key));
  const pts = {}, ex = {}, byWeek = {}, used = new Set();
  PARTICIPANTS.forEach(p => { pts[p.id] = 0; ex[p.id] = 0; byWeek[p.id] = {}; });
  state.matches.forEach(m => {
    if(m.homeScore === null || m.homeScore === undefined) return;
    const wi = getMatchWeekInfo(m);
    if(!wi || !wk.has(wi.key)) return;
    used.add(wi.key);
    const raw = teamMatchPoints(m);
    PARTICIPANTS.forEach(p => {
      const v = raw[p.id];
      pts[p.id] += v; if(v === 20) ex[p.id]++;
      byWeek[p.id][wi.key] = (byWeek[p.id][wi.key] || 0) + v;
    });
  });
  const wl = weeks.filter(w => used.has(w.key));
  const tl = teamList();
  const teams = tl.map(t => {
    const raw = t.ids.reduce((s, i) => s + pts[i], 0);
    const weekly = wl.map(w => t.ids.reduce((s, i) => s + (byWeek[i][w.key] || 0), 0));
    const total = weekly.reduce((s, v) => s + v, 0);
    return { ...t, total, raw, weekly,
      members: t.ids.map(i => ({ id:i, pts:pts[i] })).sort((a, b) => b.pts - a.pts),
      exact: t.ids.reduce((s, i) => s + ex[i], 0), avg: raw / t.ids.length };
  }).sort((a, b) => b.total - a.total);
  let rank = 0, prev = null;
  teams.forEach((t, i) => { if(t.total !== prev){ rank = i + 1; prev = t.total; } t.rank = rank; });
  return { teams, weeks: wl };
}

  };
  const tab = new Map(teams.map(t => [t.idx, { idx: t.idx, name: t.name, p: 0, w: 0, d: 0, l: 0, pts: 0, pf: 0, pa: 0, diff: 0, total: t.total }]));
  const results = weeks.map((w, wi) => ({ w, fx: fixtures(w.weekNumber).map(([a, b]) => {
    if(a == null || b == null) return { a: a == null ? b : a, bye: true };
    const sa = byIdx.get(a).weekly[wi], sb = byIdx.get(b).weekly[wi], A = tab.get(a), B = tab.get(b);
    A.p++; B.p++; A.pf += sa; A.pa += sb; B.pf += sb; B.pa += sa; A.diff += sa - sb; B.diff += sb - sa;
    const res = Math.abs(sa - sb) < 1e-6 ? 0 : sa > sb ? 1 : -1;
    if(res === 0){ A.d++; B.d++; A.pts++; B.pts++; } else if(res > 0){ A.w++; B.l++; A.pts += 3; } else { B.w++; A.l++; B.pts += 3; }
    return { a, b, sa, sb, res };
  }) }));
  const rows = [...tab.values()].sort((x, y) => y.pts - x.pts || y.diff - x.diff || y.total - x.total);
  rows.forEach((r, i) => { const q = rows[i - 1]; r.rank = q && q.pts === r.pts && Math.abs(q.diff - r.diff) < 1e-6 ? q.rank : i + 1; });
  const lastW = weeks.length ? weeks[weeks.length - 1].weekNumber : null;
  const nw = lastW ? lastW + 1 : sw;
  const rounds = Math.max(0, order.length + (order.length % 2) - 1);
  const schedule = Array.from({ length: rounds }, (_, k) => ({ wn: sw + k, fx: fixtures(sw + k) }));
  return { rows, results, nm, schedule, next: order.length > 1 ? { wn: nw, fx: fixtures(nw) } : null };
}

function duelLineText(D, x){
  if(x.bye) return `${D.nm(x.a)} — استراحت`;
  return `${x.res > 0 ? "🏆 " : ""}${D.nm(x.a)} ${fmtS(x.sa)} - ${fmtS(x.sb)} ${x.res < 0 ? "🏆 " : ""}${D.nm(x.b)}${x.res === 0 ? " 🤝" : ""}`;
}

// ---------- سناریوهای تیمی: وقتی فقط یک بازی از هفته مانده ----------
// بازی‌های بدون نتیجه‌ای که تنها بازی باقی‌مانده‌ی هفته‌ی خودشان هستند
function teamScenarioMatches(){
  const sw = +state.teams.startWeek || 1, pend = pendingMatches(), wl = getWeekList();
  return pend.filter(m => {
    const wi = getMatchWeekInfo(m); if(!wi) return false;
    const w = wl.find(x => x.key === wi.key); if(!w || w.weekNumber < sw) return false;
    return weekIsFull(w) && pend.filter(x => (getMatchWeekInfo(x) || {}).key === wi.key).length === 1;
  });
}
function teamScenarioData(match){
  const wi = getMatchWeekInfo(match), D0 = duelData();
  const curEnt = D0.results.find(r => r.w.key === wi.key) || null;
  const { classes, M } = scenarioClasses(match);
  const map = new Map();
  classes.forEach(c => {
    const oh = match.homeScore, oa = match.awayScore;
    let T, D;
    match.homeScore = c.h; match.awayScore = c.a;
    try{ T = teamStats(); D = duelData(); }finally{ match.homeScore = oh; match.awayScore = oa; }
    const ent = D.results.find(r => r.w.key === wi.key); if(!ent) return;
    const wIdx = T.weeks.findIndex(w => w.key === wi.key);
    const fx = ent.fx.filter(x => !x.bye).map(x => ({ a: x.a, b: x.b, sa: x.sa, sb: x.sb, res: x.res }));
    const wv = T.teams.map(t => ({ idx: t.idx, name: t.name, v: t.weekly[wIdx] || 0 }));
    const mx = Math.max(...wv.map(x => x.v));
    const bestW = mx > 0 ? wv.filter(x => x.v === mx) : [];
    // سناریوها فقط بر اساس برنده‌ی هر دوئل گروه‌بندی می‌شوند؛ برترین تیم هفته فقط وقتی نشان داده می‌شود که در همه‌ی نتیجه‌های آن گروه یکی باشد
    const sig = fx.map(x => x.a + ">" + x.b + ":" + x.res).join("|");
    const bSig = bestW.map(x => x.idx).join(",") + "@" + mx;
    if(!map.has(sig)) map.set(sig, { fx, bestW, bestV: mx, bSig, bestOk: true, fxOk: fx.map(() => true), classes: [], support: 0 });
    const g = map.get(sig);
    if(g.classes.length){
      if(g.bSig !== bSig) g.bestOk = false;
      fx.forEach((x, i) => { if(Math.abs(x.sa - g.fx[i].sa) > 1e-6 || Math.abs(x.sb - g.fx[i].sb) > 1e-6) g.fxOk[i] = false; });
    }
    g.classes.push(c); g.support += c.n;
  });
  const groups = Array.from(map.values());
  groups.forEach(g => { g.chips = scenarioChips(g.classes, match, M, classes); });
  groups.sort((x, y) => y.support - x.support);
  // دوئل‌هایی که هر نتیجه‌ای بیاید برنده‌شان عوض نمی‌شود
  const certain = [];
  if(groups.length){
    groups[0].fx.forEach((x, i) => {
      if(groups.every(g => g.fx[i] && g.fx[i].res === x.res)) certain.push({ a: x.a, b: x.b, res: x.res });
    });
  }
  const cur = curEnt ? curEnt.fx.filter(x => !x.bye) : [];
  return { match, wi, D0, groups, certain, cur, M };
}
function teamScenarioDuelShort(D, x){
  return x.res === 0 ? `🤝 ${D.nm(x.a)} و ${D.nm(x.b)} مساوی` : `🏆 ${D.nm(x.res > 0 ? x.a : x.b)} بر ${D.nm(x.res > 0 ? x.b : x.a)}`;
}
function renderTeamScenarioCard(){
  if(SHARE) return "";
  const cands = teamScenarioMatches();
  if(!cands.length){
    // توضیح اینکه چرا الان سناریویی نیست: تعداد بازی‌های باقی‌مانده‌ی هر هفته
    const n = toPersianDigits, sw = +state.teams.startWeek || 1, pend = pendingMatches(), wl = getWeekList();
    const byWeek = new Map(); let noDate = 0;

    const lines = wl.filter(w => byWeek.has(w.key)).map(w => `${w.label}${w.weekNumber < sw ? " (قبل از شروع مسابقات گروهی)" : ""}: ${n(byWeek.get(w.key))} بازی بدون نتیجه`);

      ${noDate ? `<div class="points-legend">${n(noDate)} بازی بدون نتیجه تاریخ معتبر ندارد و در هیچ هفته‌ای حساب نمی‌شود.</div>` : ""}
    </div>`;
  }
  const match = cands.find(m => m.id === state.teamScnMatch) || cands[0];
  const R = teamScenarioData(match), n = toPersianDigits, D = R.D0;
  const wl = getWeekList().find(w => w.key === R.wi.key);
  const curHtml = R.cur.length ? R.cur.map(x => `<div class="scn-row"><span class="scn-name">${duelLineText(D, x)}</span></div>`).join("")
    : `<div class="profile-meta">هنوز در این هفته نتیجه‌ای ثبت نشده است.</div>`;
  const certHtml = R.certain.length ? `<div class="scn-group"><div class="stat-label" style="margin-bottom:6px;">✅ نتیجه‌ی این دوئل‌ها هر چه شود عوض نمی‌شود</div>${R.certain.map(x => `<div class="scn-row"><span class="scn-name">${teamScenarioDuelShort(D, x)}</span></div>`).join("")}</div>` : "";
  const groupsHtml = R.groups.map(g => {
    const decided = g.fx.map((x, i) => R.certain.some(c => c.a === x.a && c.b === x.b) ? "" : `<div class="scn-row"><span class="scn-name">${g.fxOk[i] ? duelLineText(D, x) : teamScenarioDuelShort(D, x)}</span></div>`).join("");
    return `<div class="scn-group">
      <div class="scn-when">${g.chips.map(ch => `<span class="scn-chip">${ch.text}${ch.sub ? ` <small>(${ch.sub})</small>` : ""}</span>`).join("")}</div>
      ${decided || `<div class="profile-meta">نتیجه‌ی دوئل‌ها نسبت به حالت قطعی تغییری نمی‌کند</div>`}
      ${g.bestOk && g.bestW.length ? `<div class="scn-row"><span class="scn-name">🔥 برترین تیم هفته: ${g.bestW.map(x => x.name).join("، ")} <span class="stat-num">${fmtS(g.bestV)}</span></span></div>` : ""}
    </div>`;
  }).join("");
  return `<div class="card">
    <h2>🔮 سناریوهای تیمی — آخرین بازی ${wl ? wl.label : "هفته"}</h2>

    ${cands.length > 1 ? `<div class="row"><select onchange="state.teamScnMatch=this.value;render()">${cands.map(m => `<option value="${m.id}" ${m.id === match.id ? "selected" : ""}>${m.home} - ${m.away}${m.date ? " (" + m.date + ")" : ""}</option>`).join("")}</select></div>`
      : `<div class="stat-block"><div class="stat-value">${match.home} - ${match.away}${match.date ? " (" + match.date + ")" : ""}</div></div>`}
    <div class="row"><button class="ghost" onclick="copyTxt(teamScenarioWaText())">💬 متن واتساپ سناریوها</button></div>
    <div class="stat-label" style="margin:8px 0 4px;">وضعیت فعلی دوئل‌ها (بدون این بازی)</div>${curHtml}
    ${certHtml}
    <div class="stat-label" style="margin:12px 0 6px;">${n(R.groups.length)} سناریوی مختلف بر اساس نتیجه‌ی بازی:</div>
    ${groupsHtml}
    <div class="points-legend">نتیجه‌هایی که کسی دقیق پیش‌بینی کرده جدا نوشته شده؛ بقیه بر اساس نوع (برد یا مساوی) و اختلاف گل دسته‌بندی شده‌اند.</div>
  </div>`;
}
function teamScenarioWaText(){
  const cands = teamScenarioMatches(); if(!cands.length) return "";
  const match = cands.find(m => m.id === state.teamScnMatch) || cands[0];
  const R = teamScenarioData(match), D = R.D0, n = toPersianDigits;
  const wl = getWeekList().find(w => w.key === R.wi.key);
  const B = [`🔮 *سناریوهای تیمی — آخرین بازی ${wl ? wl.label : "هفته"}*\n⚽ ${match.home} - ${match.away}\n_فقط همین یک بازی مانده؛ ببینیم با هر نتیجه چه می‌شود_`];
  if(R.cur.length) B.push("📊 *وضعیت فعلی دوئل‌ها:*\n" + R.cur.map(x => duelLineText(D, x)).join("\n"));
  if(R.certain.length) B.push("✅ *این دوئل‌ها دیگر عوض نمی‌شوند:*\n" + R.certain.map(x => teamScenarioDuelShort(D, x)).join("\n"));
  R.groups.slice(0, 8).forEach((g, i) => {
    const when = g.chips.slice(0, 4).map(c => c.text + (c.sub ? ` (${c.sub})` : "")).join("، ") + (g.chips.length > 4 ? " و ..." : "");
    const lines = g.fx.map((x, i) => R.certain.some(c => c.a === x.a && c.b === x.b) ? "" : (g.fxOk[i] ? duelLineText(D, x) : teamScenarioDuelShort(D, x))).filter(Boolean);
    const best = g.bestOk && g.bestW.length ? `🔥 برترین تیم هفته: ${g.bestW.map(x => x.name).join("، ")}` : "";
    B.push(`${i + 1}️⃣ *اگر ${when}:*\n` + [...lines, best].filter(Boolean).join("\n"));
  });
  if(R.groups.length > 8) B.push(`… و ${n(R.groups.length - 8)} سناریوی دیگر`);
  return B.join("\n\n");
}
