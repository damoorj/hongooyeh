function duelLiveWaText(){
  const D = duelData(), last = D.results[D.results.length - 1], n = toPersianDigits;
  if(!last){
    if(!D.next || !D.next.fx.length) return "";
    return [`⚔️ *شروع دوئل‌های هفته‌ی ${n(D.next.wn)}*\n_هنوز نتیجه‌ای ثبت نشده؛ هر تیم با امتیاز هفتگی‌اش رقابت می‌کند_`,
      ...D.next.fx.map(([a, b]) => a == null || b == null ? `😴 *${D.nm(a == null ? b : a)}* این هفته استراحت دارد` : `⚔️ *${D.nm(a)}* در برابر *${D.nm(b)}*`),
      "موفق باشید 🔥"].join("\n\n");
  }
  const wm = state.matches.filter(m => (getMatchWeekInfo(m) || {}).key === last.w.key);
  const played = wm.filter(matchHasResult).length, left = weekRemaining(last.w), done = left === 0, nm = i => `*${D.nm(i)}*`;
  const head = done ? `⚔️ *نتیجه‌ی نهایی دوئل‌های هفته‌ی ${n(last.w.weekNumber)}*` : `🌴⚽🕳️ *دوئل‌های هفته‌ی ${n(last.w.weekNumber)} — بعد از ${n(played)} بازی*\n_${leftTxt(left)}_`;
  let k = 0;
  const lines = last.fx.map(x => {
    if(x.bye) return `😴 ${nm(x.a)} این هفته استراحت دارد`;
    const sa = fmtS(x.sa), sb = fmtS(x.sb);
    if(x.res === 0) return done ? `🤝 ${nm(x.a)} و ${nm(x.b)} با ${sa} امتیاز مساوی کردند` : `🤝 ${nm(x.a)} و ${nm(x.b)} هر دو تا اینجا ${sa} امتیاز کسب کرده‌اند`;
    const W = x.res > 0 ? [x.a, x.sa, x.b, x.sb] : [x.b, x.sb, x.a, x.sa], gap = Math.abs(x.sa - x.sb), v = k++ % 3;
    const w = nm(W[0]), l = nm(W[2]), ws = fmtS(W[1]), ls = fmtS(W[3]);
    const body = done
      ? [`${w} با ${ws} بر ${ls} از ${l} پیروز شد 🏆`, `${w} ${ws} - ${ls} ${l} را شکست داد 🏆`, `برد ${w} با ${ws} امتیاز مقابل ${l} (${ls})`][v]
      : [`${w} با ${ws} بر ${ls} از ${l} جلو است 🔥`, `${w} ${ws} - ${ls} مقابل ${l} پیش افتاده`, `${w} با ${ws} امتیاز بالاتر از ${l} (${ls}) قرار دارد 📈`][v];
    return `⚔️ ${body}` + (gap < 5 ? " — اختلاف خیلی کم است 😮" : gap >= 40 ? " — با اختلاف زیاد 💪" : "");
  });
  return [head, ...lines].join("\n\n");
}

  const fit = (t, max, size, bold) => { let z = size; do { ctx.font = (bold ? "bold " : "") + z + "px " + FONT; z--; } while(ctx.measureText(t).width > max && z > 9); };
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#17301F"); bg.addColorStop(0.5, "#0F1D15"); bg.addColorStop(1, "#0A130E");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  const gl = ctx.createRadialGradient(W / 2, 0, 10, W / 2, 0, W * 0.7); gl.addColorStop(0, "rgba(228,200,96,0.28)"); gl.addColorStop(1, "rgba(228,200,96,0)");

  ctx.fillStyle = tg; fit(title, W - 80, 44, true); ctx.fillText(title, W / 2, 78);

    : ((D.next && D.next.fx) || []).filter(([a, b]) => a != null && b != null).map(([a, b]) => ({ a: D.nm(a), b: D.nm(b), sa: "", sb: "", res: null }));

function weekCardSections(key){
  const wl = getWeekList(), w = wl.find(x => x.key === key); if(!w) return null;
  const n = toPersianDigits;
  const ms = state.matches.filter(m => matchHasResult(m) && (getMatchWeekInfo(m) || {}).key === key);
  const wp = PARTICIPANTS.map(p => ({ p, v: ms.reduce((s, m) => s + calcPoints((state.predictions[m.id] || {})[p.id], m), 0) }));
  wp.forEach(x => x.r = 1 + wp.filter(y => y.v > x.v).length);
  const sec = [], top = wp.filter(x => x.r <= 3 && x.v > 0).sort((a, b) => a.r - b.r);
  if(top.length) sec.push({ heading: "⭐ ۳ نفر برتر هفته", podium: true, rows: top.map(x => ({ rank: x.r, name: x.p.name, value: n(x.v), num: x.v })) });
  const { teams, weeks } = teamStats(), wi = weeks.findIndex(x => x.key === key);
  if(wi >= 0 && teams.length){
    const D = duelData(), res = D.results.find(r => r.w.key === key);
    // جدول هُنگوکاپ تا پایان همین هفته
    const tab = new Map(teams.map(t => [t.idx, { name: t.name, pts: 0, diff: 0, v: weeks.slice(0, wi + 1).length ? t.weekly.slice(0, wi + 1).reduce((a, b) => a + b, 0) : 0 }]));
    D.results.filter(r => r.w.weekNumber <= w.weekNumber).forEach(r => r.fx.forEach(x => {
      if(x.bye) return; const A = tab.get(x.a), Bt = tab.get(x.b); if(!A || !Bt) return;
      A.diff += x.sa - x.sb; Bt.diff += x.sb - x.sa;
      if(x.res === 0){ A.pts++; Bt.pts++; } else if(x.res > 0) A.pts += 3; else Bt.pts += 3;
    }));
    const dr = [...tab.values()].sort((a, b) => b.pts - a.pts || b.diff - a.diff || b.v - a.v);
    dr.forEach((r, i) => { const q = dr[i - 1]; r.rank = q && q.pts === r.pts && Math.abs(q.diff - r.diff) < 1e-6 ? q.rank : i + 1; });
    if(res) sec.push({ heading: "🌴⚽🕳️ جدول هُنگوکاپ", podium: true, rows: dr.map(r => ({ rank: r.rank, name: r.name, value: toPersianDigits(r.pts), num: r.pts })) });
    if(res) sec.push({ heading: "🌴⚽🕳️ دوئل‌های هفته" + (weekRemaining(res.w) > 0 ? ` — ${leftTxt(weekRemaining(res.w))}` : ""), rows: res.fx.map(x => ({ name: duelLineText(D, x), value: "", small: true, duel: x.bye ? null : { a: D.nm(x.a), b: D.nm(x.b), sa: fmtS(x.sa), sb: fmtS(x.sb), res: x.res }, bye: x.bye ? D.nm(x.a) : null })) });
  }
  return { w, sections: sec };
}

function weekCardClick(key){
  const d = weekCardSections(key); if(!d || !d.sections.length) return showToast("برای این هفته داده‌ای نیست");

}

function generateListCard(title, subtitle, sections, fileName){
  const W = 480, FONT = "Vazirmatn, Tahoma, sans-serif", hdrH = 150, ftrH = 70, pH = 215, rH = 58, dH = 66, secH = 54;
  const podN = sec => sec.podium && sec.rows.length >= 3 ? 3 : 0;
  const hOf = sec => secH + (podN(sec) ? pH : 0) + sec.rows.slice(podN(sec)).reduce((a, r) => a + (r.duel || r.bye ? dH : rH), 0) + 14;
  const H = hdrH + ftrH + sections.reduce((a, x) => a + hOf(x), 0);
  const scale = hqScale(W, H);
  const cv = document.createElement("canvas"); cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  const ctx = cv.getContext("2d"); ctx.scale(scale, scale); ctx.direction = "rtl";
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  const fit = (t, max, size, bold) => { let z = size; do { ctx.font = (bold ? "bold " : "") + z + "px " + FONT; z--; } while(ctx.measureText(t).width > max && z > 9); };
  const MED = { 1: ["#F6E27A", "#C99A2E", "#3A2A00"], 2: ["#E8EDF0", "#9AA7B0", "#1F2A30"], 3: ["#E7B186", "#B06B34", "#2E1704"] };
  // پس‌زمینه و چمن
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#17301F"); bg.addColorStop(0.5, "#0F1D15"); bg.addColorStop(1, "#0A130E");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for(let i = 0; i < W; i += 80){ ctx.fillStyle = "rgba(255,255,255,0.018)"; ctx.fillRect(i, 0, 40, H); }
  const gl = ctx.createRadialGradient(W / 2, 0, 10, W / 2, 0, 340); gl.addColorStop(0, "rgba(228,200,96,0.30)"); gl.addColorStop(1, "rgba(228,200,96,0)");
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, hdrH + 160);
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(W / 2, hdrH / 2 + 10, 70, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, hdrH / 2 + 10); ctx.lineTo(W, hdrH / 2 + 10); ctx.stroke();
  // هدر
  ctx.textAlign = "center";
  const tg = ctx.createLinearGradient(W / 2 - 160, 0, W / 2 + 160, 0); tg.addColorStop(0, "#F6E27A"); tg.addColorStop(1, "#D4A53A");
  ctx.fillStyle = tg; fit(title, W - 60, 32, true); ctx.fillText(title, W / 2, 68);
  ctx.fillStyle = "#B7C4BA"; fit(subtitle, W - 60, 16, false); ctx.fillText(subtitle, W / 2, 98);
  ctx.strokeStyle = "rgba(228,200,96,0.45)"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(40, 126); ctx.lineTo(W / 2 - 24, 126); ctx.moveTo(W / 2 + 24, 126); ctx.lineTo(W - 40, 126); ctx.stroke();
  ctx.font = "18px " + FONT; ctx.fillStyle = "#E4C860"; ctx.fillText("⚽", W / 2, 132);
  let y = hdrH;
  sections.forEach(sec => {
    // عنوان بخش
    fit(sec.heading, 300, 15, true); const tw = ctx.measureText(sec.heading).width + 28;
    rr(W - 22 - tw, y + 8, tw, 30, 15); ctx.fillStyle = "rgba(228,200,96,0.12)"; ctx.fill(); ctx.strokeStyle = "rgba(228,200,96,0.5)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#E4C860"; ctx.textAlign = "center"; ctx.fillText(sec.heading, W - 22 - tw / 2, y + 28);
    y += secH;
    const pn = podN(sec), mx = Math.max(0, ...sec.rows.map(r => r.num || 0));
    if(pn){
      const base = y + pH - 8, cols = [[W / 2, 1, 124], [W / 2 - 152, 2, 94], [W / 2 + 152, 3, 76]];
      cols.forEach(([cx, k, bh]) => {
        const r = sec.rows[k - 1], top = base - bh, [c1, c2, ink] = MED[k], g = ctx.createLinearGradient(0, top, 0, base);
        g.addColorStop(0, c1); g.addColorStop(1, c2);
        rr(cx - 70, top, 140, bh, 14); ctx.fillStyle = g; ctx.fill();

        else {

          ctx.textAlign = "right"; ctx.fillStyle = win === "a" ? "#E4C860" : "#EAF0EC"; fit(d.a, 150, 18, true); ctx.fillText(d.a, W - 32, y + 33);

          ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "bold 15px " + FONT; ctx.fillText(d.sa + " - " + d.sb, W / 2, y + 33);
        }
        y += dH; return;
      }
      const top3 = r.rank && r.rank <= 3;
      rr(18, y, W - 36, rH - 8, 14); ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fill();
      ctx.fillStyle = top3 ? "#E4C860" : "#3E8F5E"; rr(W - 22, y + 10, 4, rH - 28, 2); ctx.fill();
      if(r.rank){
        const [c1, c2, ink] = MED[r.rank] || ["#2F5A3D", "#24402E", "#EAF0EC"], g = ctx.createLinearGradient(0, y, 0, y + rH);
        g.addColorStop(0, c1); g.addColorStop(1, c2);
        ctx.beginPath(); ctx.arc(W - 50, y + (rH - 8) / 2, 16, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
        ctx.fillStyle = ink; ctx.font = "bold 16px " + FONT; ctx.textAlign = "center"; ctx.fillText(toPersianDigits(r.rank), W - 50, y + (rH - 8) / 2 + 6);
      }
      const hasBar = r.num != null && mx > 0, nx = r.rank ? W - 78 : W - 34;
      ctx.textAlign = "right"; ctx.fillStyle = top3 ? "#F2D77A" : "#EAF0EC"; fit(r.name, 250, 21, true);
      ctx.fillText(r.name, nx, hasBar ? y + 24 : y + (rH - 8) / 2 + 6);
      if(hasBar){
        const bw = nx - 110; rr(110, y + 33, bw, 6, 3); ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fill();
        if(r.num > 0){ rr(110 + bw * (1 - r.num / mx), y + 33, Math.max(6, bw * r.num / mx), 6, 3); ctx.fillStyle = top3 ? "#E4C860" : "#4FA372"; ctx.fill(); }
      }
      if(r.value){ ctx.textAlign = "left"; ctx.fillStyle = top3 ? "#F2D77A" : "#EAF0EC"; ctx.font = "bold 19px " + FONT; ctx.fillText(r.value, 34, y + (rH - 8) / 2 + 7); }
      y += rH;
    });
    y += 14;
  });
  // فوتر
  const [jy, jm, jd] = todayJalali();
  ctx.strokeStyle = "rgba(228,200,96,0.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(40, H - ftrH + 6); ctx.lineTo(W - 40, H - ftrH + 6); ctx.stroke();
  ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; ctx.font = "bold 17px " + FONT; ctx.fillText("⚽ هنگویه اسپورت", W / 2, H - 32);
  ctx.fillStyle = "#6F8074"; ctx.font = "12px " + FONT; ctx.fillText(`${toPersianDigits(jd)} ${PERSIAN_MONTHS[jm - 1]} ${toPersianDigits(jy)}`, W / 2, H - 12);
  hqSave(cv, fileName + ".png");
}

function teamStarData(){
  const { teams } = teamStats();
  return teams.map(t => {
    const tot = t.members.reduce((s2, m) => s2 + m.pts, 0), star = t.members[0], second = t.members[1];
    return { name: t.name, star, second, tot, share: tot > 0 ? star.pts / tot : 0, members: t.members };
  });
}
function teamStarWaText(){

function teamStatItems(withBase){
  const n = toPersianDigits, { teams, weeks } = teamStats(); if(!teams.length || !weeks.length) return [];
  const nmL = l => l.map(t => t.name).join("، ");
  const top = (arr, f) => { const m = Math.max(...arr.map(f)); return { m, list: arr.filter(x => f(x) === m) }; };
  const low = (arr, f) => { const m = Math.min(...arr.map(f)); return { m, list: arr.filter(x => f(x) === m) }; };
  const W = weeks.length, last = W - 1, wn = i => n(weeks[i].weekNumber), r1 = v => fmtS(Math.round(v * 10) / 10);
  const items = [], add = (icon, title, lines) => { if(lines && lines.length) items.push({ icon, title, lines }); };
  const wkKeys = new Set(weeks.map(w => w.key));
  const played = state.matches.filter(m => matchHasResult(m) && (getMatchWeekInfo(m) || {}).key && wkKeys.has(getMatchWeekInfo(m).key));
  if(withBase){
    const bw = top(teams, t => t.weekly[last]), ba = top(teams, t => t.avg), be = top(teams, t => t.exact);
    const all = teams.flatMap(t => t.members.map(m => ({ ...m, team: t.name }))), mvp = top(all, m => m.pts);
    add("🏅", "تیم برتر هفته‌ی آخر", [`${nmL(bw.list)} (${fmtS(bw.m)} امتیاز)`]);
    add("⚖️", "بهترین میانگین به ازای هر نفر", [`${nmL(ba.list)} (${formatAverage(ba.m)})`]);
    if(be.m > 0) add("🎯", "بیشترین پیش‌بینی دقیق (۲۰ امتیازی) تیمی", [`${nmL(be.list)} (${n(be.m)} بار)`]);
    add("👑", "بهترین بازیکن بین همه‌ی تیم‌ها", [`${mvp.list.map(m => pname(m.id) + " (" + m.team + ")").join("، ")} (${n(mvp.m)} امتیاز)`]);
  }
  // بهترین و بدترین هفته‌ی هر تیم
  add("📆", "بهترین و بدترین هفته‌ی هر تیم", teams.map(t => { const ib = t.weekly.indexOf(Math.max(...t.weekly)), iw = t.weekly.indexOf(Math.min(...t.weekly)); return W > 1 ? `${t.name}: بهترین هفته‌ی ${wn(ib)} (${fmtS(t.weekly[ib])}) | بدترین هفته‌ی ${wn(iw)} (${fmtS(t.weekly[iw])})` : `${t.name}: ${fmtS(t.weekly[0])}`; }));
  // رکورد هفتگی و رکورد یک بازی
  { let hi = null, lo = null; teams.forEach(t => t.weekly.forEach((v, i) => { if(!hi || v > hi.v) hi = { t, v, i }; if(!lo || v < lo.v) lo = { t, v, i }; }));
    const L = [`🔝 بیشترین امتیاز هفتگی: ${hi.t.name} در هفته‌ی ${wn(hi.i)} (${fmtS(hi.v)})`]; if(W > 1 || teams.length > 1) L.push(`🔻 کمترین امتیاز هفتگی: ${lo.t.name} در هفته‌ی ${wn(lo.i)} (${fmtS(lo.v)})`);
    add("🏆", "رکوردهای هفتگی گروه", L);
    let bm = null; played.forEach(m => { const r = teamMatchPoints(m); teams.forEach(t => { const v = t.ids.reduce((a, i) => a + (r[i] || 0), 0); if(!bm || v > bm.v) bm = { t, v, m }; }); });
    if(bm && bm.v > 0) add("💥", "بیشترین امتیاز تیمی در یک بازی", [`${bm.t.name} — ${fmtS(bm.v)} امتیاز در ${bm.m.home} ${n(bm.m.homeScore)} - ${n(bm.m.awayScore)} ${bm.m.away}`]); }
  // رشته‌ی تیم برتر هفته
  { const wk = weeks.map((_, i) => top(teams, t => t.weekly[i])), cnt = new Map(), stk = new Map();
    teams.forEach(t => { let cur = 0, b = 0, c = 0; wk.forEach(x => { if(x.m > 0 && x.list.includes(t)){ cur++; c++; b = Math.max(b, cur); } else cur = 0; }); stk.set(t, b); cnt.set(t, c); });
    const ms = Math.max(...stk.values()), mc = Math.max(...cnt.values()), L = [];
    if(mc > 0) L.push(`بیشترین دفعات تیم برتر هفته: ${nmL(teams.filter(t => cnt.get(t) === mc))} (${n(mc)} بار)`);
    if(ms >= 2) L.push(`طولانی‌ترین رشته‌ی پیاپی: ${nmL(teams.filter(t => stk.get(t) === ms))} (${n(ms)} هفته‌ی متوالی)`);
    add("🔥", "تیم برتر هفته", L); }
  // صعود و سقوط، جهش و افت
  if(W >= 2){
    let jp = null, dr = null; teams.forEach(t => t.weekly.forEach((v, i) => { if(i < 1) return; const d = v - t.weekly[i - 1]; if(!jp || d > jp.d) jp = { t, d, i }; if(!dr || d < dr.d) dr = { t, d, i }; }));
    const L2 = []; if(jp && jp.d > 0) L2.push(`⬆️ بزرگ‌ترین جهش: ${jp.t.name} در هفته‌ی ${wn(jp.i)} (${fmtS(jp.d)} امتیاز بیشتر از هفته‌ی قبل)`);
    if(dr && dr.d < 0) L2.push(`⬇️ بزرگ‌ترین افت: ${dr.t.name} در هفته‌ی ${wn(dr.i)} (${fmtS(-dr.d)} امتیاز کمتر از هفته‌ی قبل)`);
    add("🎢", "جهش و افت هفتگی", L2);
  }
  // ثبات
  if(W >= 3){
    const sd = teams.map(t => { const m = t.total / W; return { t, v: Math.sqrt(t.weekly.reduce((a, x) => a + (x - m) * (x - m), 0) / W) }; });
    const lo2 = low(sd, x => x.v), hi2 = top(sd, x => x.v);
    add("🧊", "ثبات تیم‌ها (نوسان امتیاز هفتگی)", [`با‌ثبات‌ترین: ${lo2.list.map(x => x.t.name).join("، ")} (نوسان ${r1(lo2.m)})`, `پرنوسان‌ترین: ${hi2.list.map(x => x.t.name).join("، ")} (نوسان ${r1(hi2.m)})`]);
  }
  // درون تیم
  { const rg = teams.filter(t => t.members.length > 1).map(t => ({ t, v: t.members[0].pts - t.members[t.members.length - 1].pts }));
    if(rg.length > 1){ const lo2 = low(rg, x => x.v), hi2 = top(rg, x => x.v);
      add("🤝", "توازن درون تیم", [`متوازن‌ترین: ${lo2.list.map(x => x.t.name).join("، ")} (فاصله‌ی بهترین و ضعیف‌ترین عضو ${fmtS(lo2.m)} امتیاز)`, `نامتوازن‌ترین: ${hi2.list.map(x => x.t.name).join("، ")} (${fmtS(hi2.m)} امتیاز فاصله)`]); }
    add("🪫", "حلقه‌ی ضعیف هر تیم", teams.filter(t => t.members.length > 1).map(t => { const m = t.members[t.members.length - 1]; return `${t.name}: ${pname(m.id)} (${n(m.pts)} امتیاز)`; })); }
  // هم‌نظری
  if(teams.length > 1 && played.length){
    const ag = teams.map(t => { let s2 = 0, c = 0; played.forEach(m => { const pr = state.predictions[m.id] || {}, o = { H: 0, D: 0, A: 0 }; let k = 0; t.ids.forEach(i => { const p = pr[i]; if(p && isNum(p.h) && isNum(p.a)){ o[outcomeOf(+p.h, +p.a)]++; k++; } }); if(k >= 2){ s2 += Math.max(o.H, o.D, o.A) / k; c++; } }); return { t, v: c ? s2 / c : null }; }).filter(x => x.v !== null);
    if(ag.length > 1){ const hi2 = top(ag, x => x.v), lo2 = low(ag, x => x.v);
      add("🧬", "هم‌نظری اعضای تیم", [`هم‌نظرترین: ${hi2.list.map(x => x.t.name).join("، ")} (${pctText(Math.round(hi2.m * 1000), 1000)})`, `متنوع‌ترین: ${lo2.list.map(x => x.t.name).join("، ")} (${pctText(Math.round(lo2.m * 1000), 1000)})`]); }
  }
  // بهترین تیم هر تورنمنت
  { const tot = new Map(); played.forEach(m => { const tn = m.tournament || "بدون تورنمنت", r = teamMatchPoints(m), o = tot.get(tn) || new Map(); teams.forEach(t => o.set(t, (o.get(t) || 0) + t.ids.reduce((a, i) => a + (r[i] || 0), 0))); tot.set(tn, o); });
    add("🏟", "بهترین تیم هر تورنمنت", [...tot.entries()].map(([tn, o]) => { const arr = [...o.entries()], mx = Math.max(...arr.map(x => x[1])); return mx > 0 ? `${tn}: ${arr.filter(x => x[1] === mx).map(x => x[0].name).join("، ")} (${fmtS(mx)})` : null; }).filter(Boolean)); }
  return items;
}

function missingWaCopy(){
  if(!state.matches.length) return showToast("هنوز مسابقه‌ای ثبت نشده");
  const n = toPersianDigits, okp = r => r && isNum(r.h) && isNum(r.a);

  const pend = state.matches.filter(m => !matchHasResult(m)).sort((a, b) => dateKeyOf(a) - dateKeyOf(b));
  if(!pend.length) return showToast("بازی بدون نتیجه‌ای (در انتظار پیش‌بینی) وجود ندارد");
  const wi0 = getMatchWeekInfo(pend[0]), rd = wi0 ? pend.filter(m => (getMatchWeekInfo(m) || {}).key === wi0.key) : pend;
  const cnt = p => rd.filter(m => okp((state.predictions[m.id] || {})[p.id])).length;
  const none = PARTICIPANTS.filter(p => cnt(p) === 0), part = PARTICIPANTS.filter(p => cnt(p) > 0 && cnt(p) < rd.length);
  if(!none.length && !part.length) return showToast(`همه‌ی ${n(PARTICIPANTS.length)} نفر برای هر ${n(rd.length)} بازی این دور پیش‌بینی ثبت کرده‌اند ✅`);
  const B = [`⏳ *یادآوری پیش‌بینی هنگویه اسپورت*`];
  if(none.length) B.push(`دوستان زیر هنوز هیچ پیش‌بینی‌ای برای این دور نفرستاده‌اند (${n(none.length)} نفر):\n` + none.map(p => `▫️ *${p.name}*`).join("\n"));
  if(part.length) B.push(`پیش‌بینی این دوستان ناقص است:\n` + part.map(p => `▫️ *${p.name}* (${n(cnt(p))} از ${n(rd.length)} بازی)`).join("\n"));
  B.push(`⚽ *بازی‌های این دور:*\n` + rd.map(m => `${m.home} - ${m.away}`).join("\n"), "لطفاً قبل از شروع بازی‌ها پیش‌بینی‌تان را بفرستید 🙏");
  copyTxt(B.join("\n\n"));
}
// شباهت دو نام (۰ تا ۱) برای تشخیص غلط املایی نام تیم
function nameSim(a, b){
  a = nameKey(a); b = nameKey(b); if(a === b) return 1;
  const n = a.length, m = b.length; if(!n || !m) return 0;
  let prev = Array.from({ length: m + 1 }, (_, j) => j);
  for(let i = 1; i <= n; i++){ const cur = [i]; for(let j = 1; j <= m; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return 1 - prev[m] / Math.max(n, m);
}
// آیا بازی m برعکس نوشته شده؟ (تیم اول پیام = میهمان بازی)
function pasteSwap(m, t1, t2){ return nameSim(t1, m.away) + nameSim(t2, m.home) > nameSim(t1, m.home) + nameSim(t2, m.away); }
// بازی‌های ثبت‌شده‌ی مناسب برای دو نام: دقیق (هر ترتیب) و شبیه (فقط بدون نتیجه)
function pasteCands(t1, t2){
  const out = [], T = 0.7;
  state.matches.forEach(m => {
    const d = nameSim(t1, m.home) === 1 && nameSim(t2, m.away) === 1, rv = nameSim(t1, m.away) === 1 && nameSim(t2, m.home) === 1;
    if(d || rv){ out.push({ m, fuzzy: false }); return; }
    const free = m.homeScore === null || m.homeScore === undefined; if(!free) return;
    if((nameSim(t1, m.home) >= T && nameSim(t2, m.away) >= T) || (nameSim(t1, m.away) >= T && nameSim(t2, m.home) >= T)) out.push({ m, fuzzy: true });
  });
  return out.reverse(); // تازه‌ترین اول
}
function pastePair(key, val){
  const pr = state.paste.pairs.get(key); if(!pr) return;
  if(!val){ pr.id = null; pr.swap = false; pr.fuzzy = false; }
  else { const m = state.matches.find(x => x.id === val); if(m){ pr.id = m.id; pr.swap = pasteSwap(m, pr.t1, pr.t2); pr.fuzzy = !pasteCands(pr.t1, pr.t2).some(y => y.m.id === m.id && !y.fuzzy); } }
  document.getElementById("pasteOut").innerHTML = pasteOutHtml();
}
function parsePaste(){
  const txt = document.getElementById("pasteTxt").value;
  state.pasteText = txt;
  const H1 = /^[\u200e\u200f]*\[[^\]]*\]\s*([^:]+?):\s*(.*)$/, H2 = /^[\u200e\u200f]*\d{1,4}[\/.]\d{1,2}[\/.]\d{1,4},?\s[^-]*-\s*([^:]+?):\s*(.*)$/;
  const SC = /^[\s\u200e\u200f]*(.+?)\s*([0-9]+)\s*[-–—]\s*(.+?)\s*([0-9]+)[\s\u200e\u200f]*$/, SIG = /^\s*\*+\s*(.+?)\s*\*+\s*$/;
  const msgs = []; let cur = null;
  txt.split(/\r?\n/).forEach(line => {
    const m = line.match(H1) || line.match(H2);
    if(m){ cur = { author: m[1].trim(), lines: [m[2]] }; msgs.push(cur); }
    else{
      // متنی که قبل از هر «نام فرستنده» آمده (یا اصلاً نام ندارد): فرستنده نامشخص؛ بعداً از لیست انتخاب می‌شود
      if(!cur){ cur = { author: "فرستنده نامشخص", lines: [], unknown: true }; msgs.push(cur); }
      cur.lines.push(line);
    }
  });
  const people = new Map();
  const EMO = /[\p{Extended_Pictographic}\uFE0F\u200d]/gu;
  msgs.forEach((ms, mi) => {
    let who = ms.author; const sc = [], bad = [];
    ms.lines.forEach(l => {
      l = faDigits(l);
      // امضا: «*نام*» فقط وقتی عدد ندارد (وگرنه خط پیش‌بینیِ پررنگ است)
      const g = l.match(SIG); if(g && !/[0-9]/.test(g[1])){ who = g[1]; return; }
      const c = l.replace(/[*_~]/g, "").replace(EMO, "").replace(/[\u200e\u200f]/g, "").replace(/[.\u060c,!\u061f?\s]+$/, "").trim();
      if(!c) return;
      const s = c.match(SC);
      if(s) sc.push({ t1: cleanName(s[1]), t2: cleanName(s[3]), a: +s[2], b: +s[4] });
      else if(/[0-9]/.test(c) && /[-–—:×x]/.test(c)) bad.push(c);
    });
    if(!sc.length && !bad.length) return;
    const unk = !!ms.unknown && who === ms.author;
    const k = unk ? "\u0000unknown" : normName(who); let p = people.get(k);
    if(!p){ p = { label: unk ? "فرستنده نامشخص (نامی در متن نبود)" : who.trim(), map: new Map(), changed: false, bad: [], unknown: unk, first: mi }; people.set(k, p); }
    p.bad.push(...bad); p.last = mi;
    sc.forEach(x => { const key = nameKey(x.t1) + "|" + nameKey(x.t2), old = p.map.get(key); if(old && (old.a !== x.a || old.b !== x.b)) p.changed = true; p.map.set(key, x); });
  });
  const list = [...people.entries()].map(([k, p]) => {
    let pid = p.unknown ? null : (state.aliases[k] || null);
    if(!pid && !p.unknown){ const ex = PARTICIPANTS.filter(q => normName(q.name) === k); if(ex.length === 1) pid = ex[0].id; }
    if(!pid && !p.unknown){ const fz = PARTICIPANTS.filter(q => { const n = normName(q.name); return n.includes(k) || k.includes(n); }); if(fz.length === 1) pid = fz[0].id; }
    return { key: k, label: p.label, map: p.map, changed: p.changed, pid, bad: p.bad, unknown: p.unknown, first: p.first, last: p.last };
  });
  const pairs = new Map();
  list.forEach(p => p.map.forEach((x, key) => {
    if(pairs.has(key)) return;
    const c = pasteCands(x.t1, x.t2), free = m => m.homeScore === null || m.homeScore === undefined;
    const exact = c.filter(y => !y.fuzzy).map(y => y.m), f = exact.filter(m => nameKey(m.home) === nameKey(x.t1) && nameKey(m.away) === nameKey(x.t2));
    // ترجیح با بازی‌ی بدون نتیجه (دور جدید)؛ بازی معکوس فقط وقتی هنوز نتیجه و پیش‌بینی ندارد
    const fFree = f.filter(free);
    const r = exact.filter(m => nameKey(m.home) === nameKey(x.t2) && nameKey(m.away) === nameKey(x.t1));
    const rFree = r.filter(m => free(m) && !Object.keys(state.predictions[m.id] || {}).length);
    let m = fFree.length ? fFree[fFree.length - 1] : (rFree.length ? rFree[rFree.length - 1] : (f.length ? f[f.length - 1] : null)), fuzzy = false;
    if(!m && !exact.length){ const fz = c.filter(y => y.fuzzy && free(y.m)); if(fz.length === 1){ m = fz[0].m; fuzzy = true; } }
    pairs.set(key, { t1: x.t1, t2: x.t2, id: m ? m.id : null, swap: m ? pasteSwap(m, x.t1, x.t2) : false, fuzzy });
  }));
  state.paste = { list, pairs };
  document.getElementById("pasteOut").innerHTML = pasteOutHtml();
}

async function undoPaste(){

  u.preds.slice().reverse().forEach(x => { const bag = state.predictions[x.mid]; if(!bag) return; if(x.old) bag[x.pid] = x.old; else delete bag[x.pid]; });
  const cs = new Set(u.created); state.matches = state.matches.filter(m => !cs.has(m.id)); cs.forEach(id => delete state.predictions[id]);
  u.aliases.slice().reverse().forEach(x => { if(x.old) state.aliases[x.k] = x.old; else delete state.aliases[x.k]; });
  if(u.eth){ const E = ethInit(), i = E.rounds.findIndex(r => (r.id || r.key) === u.eth.id); if(i >= 0){ if(u.eth.old) E.rounds[i] = u.eth.old; else E.rounds.splice(i, 1); } await saveEthics(); }
  state.undo = null;
  await savePredictions(); await saveMatches(); await saveAliases(); await saveUndo();

}

async function applyPaste(){

  let n = 0, over = 0, created = 0;

      const h = pr.swap ? x.b : x.a, a = pr.swap ? x.a : x.b;

      if(old && isNum(old.h) && (old.h !== h || old.a !== a)) over++;

    });
    if(!p.unknown && normName(pname(p.pid)) !== p.key){ undo.aliases.push({ k: p.key, old: state.aliases[p.key] || null }); state.aliases[p.key] = p.pid; }
  });
  { const E = ethInit(), eo = ethOrder(P.list), ids = [...new Set([...P.pairs.values()].map(x => x.id).filter(Boolean))];
    if(ids.length && eo.length){
      const i = ethFind(ids), old = i >= 0 ? E.rounds[i] : null, order = ethMerge(old ? old.order : [], eo.map(x => x.pid)), rid = old ? (old.id || old.key) : "r" + Date.now();
      undo.eth = { id: rid, old: old ? JSON.parse(JSON.stringify(old)) : null };
      const rd = { id: rid, ids: [...new Set([...(old ? (old.ids || (old.key || "").split("|")) : []), ...ids])], t: Date.now(), order, top: order.slice(0, E.topN), n: E.topN };

  state.paste = null; state.pasteText = "";
  render();
  showToast(`${toPersianDigits(n)} پیش‌بینی ثبت شد` + (created ? ` — ${toPersianDigits(created)} مسابقه ساخته شد` : "") + (over ? ` (${toPersianDigits(over)} مورد بازنویسی)` : ""));
}


// ================= فرامرزان کاپ =================
const UC_LETTERS = "ABCDEFGH";
const UC_FIX = [[[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]]];
function ucDefault(){ return { startWeek: null, groups: Array.from({length:8}, () => ["","","",""]), seed: null, locked: false }; }
function ucInit(){
  if(!state.union) state.union = ucDefault();
  if(!state.union.startWeek) state.union.startWeek = getWeekList().length + 1;
  return state.union;
}
async function saveUnion(){ try{ await storageSet("league:union", JSON.stringify(state.union)); }catch(e){ showToast("خطا در ذخیره فرامرزان کاپ"); } }
function ucName(pid){ const p = PARTICIPANTS.find(x => x.id === pid); return p ? p.name : "—"; }
function ucRanks(){ const r = {}; computeStandings("all", null, null).standings.forEach(s => r[s.id] = s.rank); return r; }
function ucSeed(pid){ const c = ucInit(); const r = c.seed || ucRanks(); return r[pid] || 999; }
function ucWeek(n){
  const w = getWeekList().find(x => x.weekNumber === n);
  if(!w) return { pts:{}, played:false, done:false };
  const played = filteredPlayedMatches("all", null, w.key).length > 0;
  const pending = weekTotalOf(w) - state.matches.filter(m => { const i = getMatchWeekInfo(m); return i && i.key === w.key && matchHasResult(m); }).length;
  const pts = {};
  if(played) computeStandings("all", null, w.key, { noBase:true }).standings.forEach(s => pts[s.id] = s.points);
  return { pts, played, done: played && pending === 0 && weekIsFull(w) };
}
function ucGroup(g){
  const c = ucInit(); const ids = c.groups[g];
  if(ids.some(x => !x)) return null;
  const rows = ids.map(pid => ({ pid, P:0, W:0, D:0, L:0, pts:0, diff:0 }));
  const games = []; let done = true;
  UC_FIX.forEach((wk, wi) => {
    const cw = ucWeek(c.startWeek + wi);
    if(!cw.done) done = false;
    wk.forEach(([i, j]) => {
      const pa = cw.pts[ids[i]] || 0, pb = cw.pts[ids[j]] || 0;
      games.push({ wk: wi + 1, a: ids[i], b: ids[j], pa, pb, played: cw.played, done: cw.done });
      if(!cw.played) return;
      const A = rows[i], B = rows[j];
      A.P++; B.P++; A.diff += pa - pb; B.diff += pb - pa;
      if(pa > pb){ A.W++; A.pts += 3; B.L++; }
      else if(pb > pa){ B.W++; B.pts += 3; A.L++; }
      else { A.D++; B.D++; A.pts++; B.pts++; }
    });
  });
  const sorted = rows.slice().sort((x, y) => y.pts - x.pts || y.diff - x.diff || ucSeed(x.pid) - ucSeed(y.pid));
  return { rows: sorted, games, done };
}
function ucPlay(a, b, wkNum, labA, labB){
  const cw = ucWeek(wkNum);
  const m = { a, b, labA, labB, pa:null, pb:null, winner:null, played:false };
  if(a && b && cw.played){
    m.pa = cw.pts[a] || 0; m.pb = cw.pts[b] || 0; m.played = true;
    if(cw.done) m.winner = m.pa > m.pb ? a : m.pb > m.pa ? b : (ucSeed(a) <= ucSeed(b) ? a : b);
  }
  return m;
}
function ucBracket(){
  const c = ucInit(); const gs = c.groups.map((_, g) => ucGroup(g));

  for(let i = 0; i < 4; i++) defs.push([[i,0],[i+4,1]]);
  for(let i = 0; i < 4; i++) defs.push([[i+4,0],[i,1]]);
  const r16 = defs.map(([x, y]) => ucPlay(q(x[0], x[1]), q(y[0], y[1]), s + 3, lab(x[0], x[1]), lab(y[0], y[1])));
  const next = (prev, wk, tag) => { const out = []; for(let i = 0; i < prev.length; i += 2) out.push(ucPlay(prev[i].winner, prev[i+1].winner, wk, "برنده " + tag + (i+1), "برنده " + tag + (i+2))); return out; };
  const qf = next(r16, s + 4, "یک‌هشتم "), sf = next(qf, s + 5, "یک‌چهارم "), fin = next(sf, s + 6, "نیمه‌نهایی ");
  const lose = m => m.winner ? (m.winner === m.a ? m.b : m.a) : null;

}

// هر هفته کم‌امتیازترین‌ها حذف می‌شوند تا یک نفر بماند. فقط «هفته‌ی شروع» ذخیره می‌شود؛ بقیه هر بار از روی پیش‌بینی‌ها محاسبه می‌شود.
const SURV_OUT = 4;
state.survRound = null;
async function saveSurv(){ try{ await storageSet("league:surv", JSON.stringify(state.surv)); }catch(e){ showToast("خطا در ذخیره جام بقا"); } }
const survExact = (pid, ms) => ms.reduce((s, m) => s + (calcPoints((state.predictions[m.id] || {})[pid], m) === 20 ? 1 : 0), 0);

function survData(){
  const sw = state.surv && +state.surv.startWeek;
  if(!(sw >= 1)) return null;
  const order = {}; PARTICIPANTS.forEach((p, i) => { order[p.id] = i; });
  let alive = PARTICIPANTS.map(p => p.id); const rounds = [];
  for(let r = 0; alive.length > 2 && r < 60; r++){
    const cw = cupWeek(sw + r);
    const rd = { r, wn: sw + r, status: cw.status, pend: cw.w ? weekRemaining(cw.w) : cw.pend, rows: [], out: [], outN: alive.length <= SURV_OUT ? alive.length - 2 : Math.min(SURV_OUT, alive.length - SURV_OUT), aliveBefore: alive.length, last: alive.length <= SURV_OUT };
    if(cw.played){
      const tot = {};
      computeStandings("all", null, null, { untilSeq: maxSeqOf(cw.ms) }).standings.forEach(x => { tot[x.id] = x.points; });
      // بدترین نفر اول: امتیاز هفته، بعد تعداد نتیجه‌ی دقیق، بعد امتیاز کل فصل، در آخر ترتیب فهرست
      const rows = alive.map(pid => ({ pid, pts: cupWeekPts(pid, cw.ms), exact: survExact(pid, cw.ms), total: tot[pid] || 0 }));
      rows.sort((a, b) => a.pts - b.pts || a.exact - b.exact || a.total - b.total || order[b.pid] - order[a.pid]);
      rows.forEach((x, i) => { x.danger = i < rd.outN; });
      const cut = rows[rd.outN - 1], nxt = rows[rd.outN];
      if(cut && nxt && cut.pts === nxt.pts) cut.tie = cut.exact !== nxt.exact ? "exact" : cut.total !== nxt.total ? "total" : "order";
      rd.rows = rows.slice().reverse(); rd.rows.forEach((x, i) => { x.pos = i + 1; });
      if(cw.status === "done"){
        rd.out = rows.slice(0, rd.outN).map(x => x.pid);
        alive = alive.filter(p => !rd.out.includes(p));
        rounds.push(rd); continue;
      }
    }
    rounds.push(rd); break;
  }
  let champion = null, second = null;
  if(alive.length === 2){ const fin = rounds[rounds.length - 1]; const top = fin.rows.filter(x => !x.danger); champion = top[0].pid; second = top[1].pid; }
  return { sw, rounds, alive, champion, second };
}

function survRoundWaText(r){
  const D = survData(); if(!D || !D.rounds[r]) return "";
  const rd = D.rounds[r], n = toPersianDigits, B = [];
  B.push(`🪂 *جام بقا — دور ${n(r + 1)} (هفته‌ی ${n(rd.wn)})*`);
  B.push(rd.status === "done" ? "_نتیجه‌ی قطعی_" : rd.status === "live" ? `_⏳ در جریان — ${leftTxt(rd.pend)}_` : "_هنوز شروع نشده_");
  if(rd.rows.length){
    B.push(rd.rows.map(x => `${n(x.pos)}. ${pname(x.pid)} — ${fmtS(x.pts)} امتیاز${x.exact ? ` (${n(x.exact)} دقیق)` : ""}${x.danger ? (rd.status === "done" ? " ❌" : " ⚠️") : ""}`).join("\n"));
    if(rd.status === "done") B.push(`❌ *حذف‌شدگان:* ${rd.out.map(pname).join("، ")}`);
    else B.push(`⚠️ *فعلاً در معرض حذف:* ${rd.rows.filter(x => x.danger).map(x => pname(x.pid)).join("، ")}`);
    const sh = D.rounds.slice(0, r + 1).reduce((s, x) => s + x.out.length, 0);
    B.push(`✅ بازمانده‌ها: ${n(PARTICIPANTS.length - (rd.status === "done" ? sh : D.rounds.slice(0, r).reduce((s, x) => s + x.out.length, 0)))} نفر`);
  }
  if(D.champion && r === D.rounds.length - 1) B.push(`🥇 *نفر اول جام بقا: ${pname(D.champion)}*\n🥈 *نفر دوم: ${pname(D.second)}*`);
  return B.join("\n\n");
}

function survRoundCard(r){
  const D = survData(); if(!D || !D.rounds[r] || !D.rounds[r].rows.length) return showToast("داده‌ای برای کارت نیست");
  const rd = D.rounds[r], rows = rd.rows, n = toPersianDigits;
  const W = 1000, top = 160, headH = 56, rowH = 58, H = top + headH + rows.length * rowH + 100;
  const B = duelCanvasBase(W, H, `🪂 جام بقا — دور ${n(r + 1)}`, `هفته‌ی ${n(rd.wn)} • ${rd.status === "done" ? "نتیجه‌ی قطعی" : rd.status === "live" ? leftTxt(rd.pend) : "هنوز شروع نشده"} • ${n(rd.outN)} نفر حذف می‌شوند`);
  const { ctx, rr, fit, FONT } = B;
  const nameR = W - 100;
  rr(24, top + 4, W - 48, headH - 8, 12); ctx.fillStyle = "rgba(228,200,96,0.14)"; ctx.fill();
  ctx.font = "bold 18px " + FONT; ctx.fillStyle = "#E4C860";
  ctx.textAlign = "center"; ctx.fillText("#", W - 56, top + 38);
  ctx.textAlign = "right"; ctx.fillText("نفر", nameR, top + 38);

  rows.forEach((x, i) => {
    const y = top + headH + i * rowH, mid = y + (rowH - 8) / 2, done = rd.status === "done";
    rr(24, y + 2, W - 48, rowH - 8, 14);
    ctx.fillStyle = x.danger ? (done ? "rgba(196,87,63,0.22)" : "rgba(228,200,96,0.16)") : (i % 2 ? "rgba(255,255,255,0.045)" : "rgba(255,255,255,0.08)"); ctx.fill();
    ctx.textAlign = "center"; ctx.fillStyle = "#B7C4BA"; ctx.font = "bold 22px " + FONT; ctx.fillText(n(x.pos), W - 56, mid + 8);
    ctx.textAlign = "right"; ctx.fillStyle = x.danger && done ? "#8FA196" : "#EAF0EC"; fit(pname(x.pid), 330, 26, true); ctx.fillText(pname(x.pid), nameR, mid + 9);
    ctx.textAlign = "center"; ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 26px " + FONT; ctx.fillText(fmtS(x.pts), 460, mid + 9);
    ctx.fillStyle = "#B7C4BA"; ctx.font = "22px " + FONT; ctx.fillText(n(x.exact), 330, mid + 8);
    const st = done ? (x.danger ? "❌ حذف" : rd.last ? (x.pos === 1 ? "🥇 اول" : "🥈 دوم") : "✅ ماند") : x.danger ? "⚠️ در خطر" : "";
    ctx.fillStyle = x.danger ? (done ? "#E58E7A" : "#F2D77A") : "#7FD6A6"; ctx.font = "bold 20px " + FONT; ctx.fillText(st, 150, mid + 8);
  });
  if(D.champion && r === D.rounds.length - 1){ ctx.textAlign = "center"; ctx.fillStyle = "#F2D77A"; ctx.font = "bold 30px " + FONT; ctx.fillText("🥇 " + pname(D.champion) + "   🥈 " + pname(D.second), W / 2, H - 70); }
  duelCanvasFooter(B, W, H);
  duelDownload(B.cv, "جام-بقا-دور-" + n(r + 1));
}

    </div>
    ${SHARE ? "" : cardsCard}
    ${SHARE ? "" : potsCard}
    ${groupCards}
    ${koSec("یک‌هشتم نهایی — " + wkRange(3), br.r16)}
    ${koSec("یک‌چهارم نهایی — " + wkRange(4), br.qf)}
    ${koSec("نیمه‌نهایی — " + wkRange(5), br.sf)}
    ${koSec("فینال — " + wkRange(6), [br.fin])}
    ${koSec("دیدار رده‌بندی (مقام سوم) — " + wkRange(6), [br.third])}
    ${SHARE ? potsCard : ""}`;
}

// ---------- کارت‌های فرامرزان کاپ ----------
function ucCanvas(W, H){
  const FONT = "Vazirmatn, Tahoma, sans-serif", n = toPersianDigits, scale = hqScale(W, H);
  const cv = document.createElement("canvas"); cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  const ctx = cv.getContext("2d"); ctx.scale(scale, scale); ctx.direction = "rtl";
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  const fit = (t, max, size, bold) => { let z = size; do { ctx.font = (bold ? "bold " : "") + z + "px " + FONT; z--; } while(ctx.measureText(t).width > max && z > 12); };
  const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#0E1712"); bg.addColorStop(0.6, "#142A1E"); bg.addColorStop(1, "#241B08");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  let g = ctx.createRadialGradient(W * 0.85, 0, 10, W * 0.85, 0, 560); g.addColorStop(0, "rgba(201,162,39,0.28)"); g.addColorStop(1, "rgba(201,162,39,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 620);
  g = ctx.createRadialGradient(W * 0.1, H, 10, W * 0.1, H, 560); g.addColorStop(0, "rgba(45,134,89,0.30)"); g.addColorStop(1, "rgba(45,134,89,0)"); ctx.fillStyle = g; ctx.fillRect(0, H - 700, W, 700);
  return { cv, ctx, rr, fit, FONT, n, W, H };
}
function ucHeader(K, title, sub){
  const { ctx, fit, W } = K;
  ctx.textAlign = "center";
  const tg = ctx.createLinearGradient(W / 2 - 240, 0, W / 2 + 240, 0); tg.addColorStop(0, "#E4C860"); tg.addColorStop(1, "#C9A227");
  ctx.fillStyle = tg; fit(title, W - 80, 56, true); ctx.fillText(title, W / 2, 98);
  ctx.fillStyle = "#B8C4B9"; fit(sub, W - 100, 28, false); ctx.fillText(sub, W / 2, 142);
  ctx.strokeStyle = "rgba(228,200,96,0.5)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(60, 170); ctx.lineTo(W - 60, 170); ctx.stroke();
}
function ucFooter(K){
  const { ctx, FONT, W, H, n } = K; const [jy, jm, jd] = todayJalali();
  ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; ctx.font = "bold 24px " + FONT; ctx.fillText("🏆 فرامرزان کاپ — هنگویه اسپورت", W / 2, H - 52);
  ctx.fillStyle = "#7C8C80"; ctx.font = "16px " + FONT; ctx.fillText(`${n(jd)} ${PERSIAN_MONTHS[jm - 1]} ${n(jy)}`, W / 2, H - 24);
}
function ucPanel(K, x, y, w, h, title){
  const { ctx, rr, fit } = K;
  rr(x, y, w, h, 24); ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fill(); ctx.strokeStyle = "rgba(228,200,96,0.45)"; ctx.lineWidth = 2; ctx.stroke();
  if(title){ ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; fit(title, w - 40, 38, true); ctx.fillText(title, x + w / 2, y + 48); }
}
function ucMembers(K, x, y0, w, rowH, g, size){
  const { ctx, fit, FONT, n } = K; const c = ucInit();
  c.groups[g].forEach((pid, i) => {
    const cy = y0 + i * rowH + rowH / 2, r = Math.min(22, rowH / 2 - 6);
    ctx.beginPath(); ctx.arc(x + w - 38, cy, r, 0, Math.PI * 2); ctx.fillStyle = "#C9A227"; ctx.fill();
    ctx.textAlign = "center"; ctx.fillStyle = "#14230F"; ctx.font = "bold " + Math.round(r * 1.1) + "px " + FONT; ctx.fillText(n(i + 1), x + w - 38, cy + r * 0.4);
    ctx.textAlign = "right"; ctx.fillStyle = "#FFFFFF"; fit(ucName(pid), w - 160, size, true); ctx.fillText(ucName(pid), x + w - 76, cy + size * 0.33);
    ctx.textAlign = "left"; ctx.fillStyle = "#8FA394"; ctx.font = "18px " + FONT; ctx.fillText("رتبه " + n(ucSeed(pid)), x + 24, cy + 6);
  });
}
function ucVsRow(K, x, y, w, a, b, size){
  const { ctx, fit, FONT } = K; const half = (w - 120) / 2;
  ctx.textAlign = "center"; ctx.fillStyle = "#FFFFFF";
  fit(ucName(a), half, size, true); ctx.fillText(ucName(a), x + w - 16 - half / 2, y);
  fit(ucName(b), half, size, true); ctx.fillText(ucName(b), x + 16 + half / 2, y);
  ctx.fillStyle = "#E4C860"; ctx.font = "16px " + FONT; ctx.fillText("در برابر", x + w / 2, y - 2);
}
function ucReady(g){
  const c = ucInit(); const list = g === undefined ? c.groups : [c.groups[g]];
  if(list.some(gr => gr.some(v => !v))){ showToast(g === undefined ? "اول همه‌ی ۸ گروه را کامل کنید" : "اعضای این گروه کامل نیست"); return false; }
  return true;
}
function ucCardGroups(){

  const K = ucCanvas(W, H); ucHeader(K, "گروه‌بندی فرامرزان کاپ", "قرعه‌کشی مرحله‌ی گروهی — شروع از هفته‌ی " + K.n(c.startWeek));

function ucCardWeek(wi){
  if(!ucReady()) return;
  const c = ucInit(), W = 1300, bw = 600, bh = 250, gap = 22, H = 190 + 4 * (bh + gap) + 100;
  const K = ucCanvas(W, H); ucHeader(K, "هفته‌ی " + K.n(c.startWeek + wi), "برنامه‌ی دیدارهای فرامرزان کاپ — مرحله‌ی گروهی (" + K.n(wi + 1) + " از ۳)");
  c.groups.forEach((ids, g) => {
    const x = g % 2 === 0 ? W - 40 - bw : 40, y = 195 + Math.floor(g / 2) * (bh + gap);
    ucPanel(K, x, y, bw, bh, "گروه " + UC_LETTERS[g]);
    UC_FIX[wi].forEach(([i, j], k) => ucVsRow(K, x, y + 128 + k * 72, bw, ids[i], ids[j], 28));
  });
  ucFooter(K); hqSave(K.cv, "فرامرزان-کاپ-برنامه-هفته-" + (c.startWeek + wi) + ".png");
}
function ucCardBracket(){
  const c = ucInit(), br = ucBracket(), n = toPersianDigits;
  const colW = 250, gapX = 60, boxH = 100, gapY = 26, top0 = 250;
  const W = 80 + 5 * colW + 4 * gapX, H = top0 + 8 * (boxH + gapY) + 110;
  const K = ucCanvas(W, H), { ctx, rr, fit, FONT } = K;
  ucHeader(K, "براکت حذفی فرامرزان کاپ", "۱۶ نفر برتر مرحله‌ی گروهی — از هفته‌ی " + n(c.startWeek + 3));
  const colX = k => W - 40 - colW - k * (colW + gapX);
  const titles = ["یک‌هشتم نهایی", "یک‌چهارم نهایی", "نیمه‌نهایی", "فینال", "قهرمان"];
  titles.forEach((t, k) => {
    ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; fit(t, colW, 30, true); ctx.fillText(t, colX(k) + colW / 2, top0 - 44);
    if(k < 4){ ctx.fillStyle = "#8FA394"; ctx.font = "18px " + FONT; ctx.fillText("هفته‌ی " + n(c.startWeek + 3 + k), colX(k) + colW / 2, top0 - 16); }
  });
  const ys = [br.r16.map((_, i) => top0 + i * (boxH + gapY))];
  [br.qf, br.sf, [br.fin]].forEach((arr, k) => ys.push(arr.map((_, j) => (ys[k][2 * j] + ys[k][2 * j + 1]) / 2)));
  const drawMatch = (x, y, m) => {
    rr(x, y, colW, boxH, 14); ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fill(); ctx.strokeStyle = "rgba(228,200,96,0.45)"; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.strokeStyle = "rgba(228,200,96,0.25)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 10, y + boxH / 2); ctx.lineTo(x + colW - 10, y + boxH / 2); ctx.stroke();
    [[m.a, m.labA, m.pa], [m.b, m.labB, m.pb]].forEach(([pid, lab, sc], t) => {
      const cy = y + boxH / 4 + t * boxH / 2 + 7, win = pid && m.winner === pid;
      ctx.textAlign = "right"; ctx.fillStyle = pid ? (win ? "#E4C860" : "#FFFFFF") : "#7C8C80";
      fit(pid ? ucName(pid) : lab, colW - 80, pid ? 22 : 18, !!pid); ctx.fillText(pid ? ucName(pid) : lab, x + colW - 14, cy);
      if(m.played && sc !== null){ ctx.textAlign = "left"; ctx.fillStyle = win ? "#E4C860" : "#B8C4B9"; ctx.font = "bold 24px " + FONT; ctx.fillText(n(sc), x + 16, cy); }
    });
  };
  ctx.strokeStyle = "rgba(228,200,96,0.45)"; ctx.lineWidth = 2;
  [0, 1, 2].forEach(k => {
    const x = colX(k), mid = x - gapX / 2;
    ys[k + 1].forEach((yn, j) => {
      const a = ys[k][2 * j] + boxH / 2, b = ys[k][2 * j + 1] + boxH / 2, cn = yn + boxH / 2;
      ctx.beginPath(); ctx.moveTo(x, a); ctx.lineTo(mid, a); ctx.lineTo(mid, b); ctx.lineTo(x, b); ctx.moveTo(mid, cn); ctx.lineTo(x - gapX, cn); ctx.stroke();
    });
  });
  [br.r16, br.qf, br.sf, [br.fin]].forEach((arr, k) => arr.forEach((m, i) => drawMatch(colX(k), ys[k][i], m)));
  const fy = ys[3][0], cx = colX(4);
  ctx.beginPath(); ctx.moveTo(colX(3), fy + boxH / 2); ctx.lineTo(cx + colW, fy + boxH / 2); ctx.stroke();
  rr(cx, fy - 10, colW, boxH + 20, 18);
  const g = ctx.createLinearGradient(cx, fy, cx + colW, fy + boxH); g.addColorStop(0, "rgba(228,200,96,0.35)"); g.addColorStop(1, "rgba(201,162,39,0.15)");
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = "#E4C860"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; ctx.font = "28px " + FONT; ctx.fillText("🏆", cx + colW / 2, fy + 32);
  ctx.fillStyle = br.champion ? "#FFFFFF" : "#7C8C80"; fit(br.champion ? ucName(br.champion) : "—", colW - 30, 30, true); ctx.fillText(br.champion ? ucName(br.champion) : "—", cx + colW / 2, fy + 78);
  const ty = fy + boxH + 80;
  ctx.textAlign = "center"; ctx.fillStyle = "#E4C860"; fit("رده‌بندی (مقام سوم)", colW, 26, true); ctx.fillText("رده‌بندی (مقام سوم)", colX(3) + colW / 2, ty - 16);
  drawMatch(colX(3), ty, br.third);
  ucFooter(K); hqSave(K.cv, "فرامرزان-کاپ-براکت-حذفی.png");
}
function ucCardTables(){
  if(!ucReady()) return;
  const c = ucInit(), br = ucBracket(), n = toPersianDigits;
  const pw = 720, ph = 340, gapX = 30, gapY = 22, W = 60 + 2 * pw + gapX, H = 195 + 4 * (ph + gapY) + 100;
  const wp = [0, 1, 2].filter(i => ucWeek(c.startWeek + i).played).length;
  const K = ucCanvas(W, H), { ctx, fit, FONT } = K;
  ucHeader(K, "جدول گروه‌های فرامرزان کاپ", wp ? "وضعیت پس از " + n(wp) + " هفته از ۳ هفته‌ی مرحله‌ی گروهی" : "پیش از شروع دیدارهای مرحله‌ی گروهی");
  const heads = ["بازی", "برد", "مساوی", "باخت", "تفاضل", "امتیاز"];

      ctx.beginPath(); ctx.arc(x + pw - 38, cy, 17, 0, Math.PI * 2); ctx.fillStyle = adv ? "#2D8659" : "#C9A227"; ctx.fill();
      ctx.textAlign = "center"; ctx.fillStyle = adv ? "#FFFFFF" : "#14230F"; ctx.font = "bold 20px " + FONT; ctx.fillText(n(i + 1), x + pw - 38, cy + 7);
      ctx.textAlign = "right"; ctx.fillStyle = "#FFFFFF"; fit(ucName(r.pid), 255, 26, true); ctx.fillText(ucName(r.pid), x + pw - 66, cy + 9);
      const vals = [r.P, r.W, r.D, r.L, (r.diff > 0 ? "+" : "") + r.diff, r.pts];
      vals.forEach((v, k) => {
        ctx.textAlign = "center"; ctx.fillStyle = k === 5 ? "#E4C860" : "#E6ECE7"; ctx.font = (k === 5 ? "bold 26px " : "22px ") + FONT; ctx.direction = "ltr"; ctx.fillText(n(v), cx(k), cy + 8); ctx.direction = "rtl";
      });
    });
  });
  ucFooter(K); hqSave(K.cv, "فرامرزان-کاپ-جدول-گروه‌ها.png");
}
