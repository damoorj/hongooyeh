.wk-list{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.wk-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);}
.wk-item.wk-live{border-color:rgba(59,123,255,.45);}
.wk-info{min-width:0;display:flex;flex-direction:column;gap:5px;}
.wk-title{font-weight:700;font-size:15px;}
.wk-meta{font-size:12px;opacity:.6;}
.wk-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:left;flex-shrink:0;}
.wk-champ{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.wk-name{font-weight:700;font-size:14px;color:#FFD94A;}
.wk-pts{font-size:12px;opacity:.7;}

.pf{padding:18px 16px 24px;}
.pf-head{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.pf-who{display:flex;align-items:center;gap:12px;min-width:0;}
.pf-name h2{margin:0;font-size:20px;line-height:1.4;}
.pf-club{font-size:12px;color:var(--text-dim);margin-top:2px;}
.pf .club-row{flex-wrap:wrap;margin-bottom:16px;}
.pf .club-row input[list]{flex:1 1 180px;}
.pf-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}

const toPersianDigits = (n) => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const toEnglishDigits = (s) => String(s).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const uid = () => "m" + Date.now() + Math.random().toString(36).slice(2,7);

// ---------- تقویم شمسی (جلالی) ----------
const PERSIAN_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];

function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if(days > 365){ jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}

function todayJalali(){
  const now = new Date();
  return gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
}

// تبدیل تاریخ شمسی به میلادی (الگوریتم استاندارد jalaali)
function jalaliToGregorian(jy, jm, jd){
  jy += 1595;
  let days = -355668 + (365 * jy) + (Math.floor(jy / 33) * 8) + Math.floor(((jy % 33) + 3) / 4) + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  let gy = 400 * Math.floor(days / 146097);
  days %= 146097;
  if (days > 36524) {
    gy += 100 * Math.floor(--days / 36524);
    days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) {
    gy += Math.floor((days - 1) / 365);
    days = (days - 1) % 365;
  }
  let gd = days + 1;
  const sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm;
  for (gm = 0; gm < 13; gm++) {
    const v = sal_a[gm];
    if (gd <= v) break;
    gd -= v;
  }
  return [gy, gm, gd];
}

// روز هفته‌ی یک تاریخ شمسی، با شنبه = ۰ تا جمعه = ۶
function jalaliWeekdayIndex(jy, jm, jd){
  const [gy, gm, gd] = jalaliToGregorian(jy, jm, jd);
  const jsDay = new Date(gy, gm - 1, gd).getDay(); // 0=Sunday ... 6=Saturday
  return (jsDay + 1) % 7;
}

// استخراج روز/ماه/سال شمسی از رشته‌ی تاریخ مسابقه (مثلاً "۱۵ مهر ۱۴۰۳")
function parseMatchJalaliDate(match){
  if(!match.date) return null;
  const parts = match.date.trim().split(/\s+/);
  if(parts.length < 3) return null;
  const jd = parseInt(toEnglishDigits(parts[0]), 10);
  const jm = PERSIAN_MONTHS.indexOf(parts[1]) + 1;
  const jy = parseInt(toEnglishDigits(parts[2]), 10);
  if(!jd || !jm || !jy) return null;
  return [jy, jm, jd];
}

// هفته‌ی تقویمی شمسی (شنبه تا جمعه)؛ برای هفته‌های ۱ تا ۱۱ حفظ می‌شود.
function getCalendarWeekInfo(match){
  const parsed = parseMatchJalaliDate(match);
  if(!parsed) return null;
  const [jy, jm, jd] = parsed;
  const widx = jalaliWeekdayIndex(jy, jm, jd);
  const [gy, gm, gd] = jalaliToGregorian(jy, jm, jd);
  const startDate = new Date(gy, gm - 1, gd);
  startDate.setDate(startDate.getDate() - widx);
  const endDate = new Date(startDate);
  endDate.setDate(endDate.getDate() + 6);
  const [sjy, sjm, sjd] = gregorianToJalali(startDate.getFullYear(), startDate.getMonth() + 1, startDate.getDate());
  const [ejy, ejm, ejd] = gregorianToJalali(endDate.getFullYear(), endDate.getMonth() + 1, endDate.getDate());
  const key = `${sjy}-${sjm}-${sjd}`;
  const label = (sjm === ejm)
    ? `${toPersianDigits(sjd)} تا ${toPersianDigits(ejd)} ${PERSIAN_MONTHS[sjm-1]} ${toPersianDigits(sjy)}`
    : `${toPersianDigits(sjd)} ${PERSIAN_MONTHS[sjm-1]} تا ${toPersianDigits(ejd)} ${PERSIAN_MONTHS[ejm-1]} ${toPersianDigits(ejy)}`;
  return { key, label, sortKey: sjy * 10000 + sjm * 100 + sjd };
}

const weekSizeOf = w => !w ? null : w.weekNumber === 11 ? WEEK11_SIZE : w.weekNumber >= 12 ? WEEK_SIZE : null;
let weekAssignmentCache = null;
let weekAssignmentCacheSignature = '';
function getWeekAssignments(){
  if(SHARE && SHARE.weekAssign){
    if(!weekAssignmentCache){
      const assignments = new Map(Object.entries(SHARE.weekAssign));
      weekAssignmentCache = { assignments, weeks: (SHARE.weekList || []).slice().sort((a,b) => a.weekNumber - b.weekNumber) };
    }
    return weekAssignmentCache;
  }
  const signature = state.matches.map(m => `${m.id}|${m.date || ''}|${m.time || m.kickoff || ''}`).join('~');
  if(weekAssignmentCache && signature === weekAssignmentCacheSignature) return weekAssignmentCache;
  const entries = state.matches.map((match, index) => {
    const pd = parseMatchJalaliDate(match);
    return { match, index, calendar: getCalendarWeekInfo(match), dayKey: pd ? pd[0] * 10000 + pd[1] * 100 + pd[2] : 0 };
  }).filter(x => x.calendar);
  const sorted = entries.slice().sort((a,b) => {
    if(a.dayKey !== b.dayKey) return a.dayKey - b.dayKey;
    const timeA = String(a.match.time || a.match.kickoff || '');
    const timeB = String(b.match.time || b.match.kickoff || '');
    const t = timeA.localeCompare(timeB, 'en', { numeric: true });
    return t || a.index - b.index;
  });
  sorted.forEach((x, i) => { x.seq = i + 1; });
  const early = sorted.slice(0, WEEK12_FIRST_MATCH - 1);
  const later = sorted.slice(WEEK12_FIRST_MATCH - 1);
  const calendarWeeks = Array.from(new Map(early.map(x => [x.calendar.key, x.calendar])).values())
    .sort((a,b) => a.sortKey - b.sortKey).slice(0, 11);
  const weekMap = new Map(calendarWeeks.map((w, i) => [w.key, { ...w, weekNumber: i + 1, label: `هفته ${ordinalFa(i + 1)}` }]));
  const lastCal = calendarWeeks.length ? weekMap.get(calendarWeeks[calendarWeeks.length - 1].key) : null;
  const assignments = new Map();
  early.forEach(x => {
    const info = weekMap.get(x.calendar.key) || lastCal;
    if(info) assignments.set(x.match.id, { ...info, phase: 'calendar', seq: x.seq });
  });
  later.forEach((x, i) => {
    const weekNumber = 12 + Math.floor(i / WEEK_SIZE);
    const key = `match-batch-${weekNumber}`;
    const info = { key, label: `هفته ${ordinalFa(weekNumber)}`, sortKey: 100000000 + weekNumber, weekNumber, phase: 'batch', seq: x.seq };
    assignments.set(x.match.id, info);
    if(!weekMap.has(key)) weekMap.set(key, info);
  });
  // اگر مسابقه‌ای بدون تاریخ معتبر باشد، در هیچ هفته‌ای حساب نمی‌شود.
  weekAssignmentCacheSignature = signature;
  weekAssignmentCache = { assignments, weeks: Array.from(weekMap.values()).sort((a,b) => a.weekNumber - b.weekNumber) };
  return weekAssignmentCache;
}

// تعداد کل بازی‌های یک هفته (با نتیجه یا بدون نتیجه)؛ در نسخه‌ی اشتراکی بازی‌های بدون نتیجه از pendingByWeek می‌آیند.
function weekTotalOf(w){
  const n = state.matches.filter(m => (getMatchWeekInfo(m) || {}).key === w.key).length;
  return n + (SHARE ? ((state.pendingByWeek || {})[w.key] || 0) : 0);
}
// هفته‌های ۱۲ به بعد فقط وقتی کامل‌اند که ۳۰ بازی داشته باشند؛ هفته‌های ۱ تا ۱۱ مثل قبل.
function weekIsFull(w){ const z = weekSizeOf(w); return !z || weekTotalOf(w) >= z; }
// تعداد بازی‌های باقی‌مانده‌ی یک هفته تا کامل‌شدن (هفته‌های ۱۲ به بعد: ۳۰ منهای بازی‌های دارای نتیجه؛ هفته‌های قبل: بازی‌های بدون نتیجه)
function weekRemaining(w){
  if(!w) return 0;
  const played = state.matches.filter(m => matchHasResult(m) && (getMatchWeekInfo(m) || {}).key === w.key).length;
  const z = weekSizeOf(w);
  return z ? Math.max(0, z - played) : Math.max(0, weekTotalOf(w) - played);
}
const leftTxt = k => `${toPersianDigits(k)} بازی باقیست`;

function getMatchWeekInfo(match){
  if(!match) return null;
  return getWeekAssignments().assignments.get(match.id) || null;
}

}

// عدد ترتیبی فارسی (هفته اول، هفته دوم، ...)
function ordinalFa(n){
  const table = ["", "اول","دوم","سوم","چهارم","پنجم","ششم","هفتم","هشتم","نهم","دهم",
    "یازدهم","دوازدهم","سیزدهم","چهاردهم","پانزدهم","شانزدهم","هفدهم","هجدهم","نوزدهم","بیستم",
    "بیست و یکم","بیست و دوم","بیست و سوم","بیست و چهارم","بیست و پنجم","بیست و ششم","بیست و هفتم","بیست و هشتم","بیست و نهم","سی‌ام"];
  return table[n] || `${toPersianDigits(n)}ام`;
}

// تبدیل رشته تاریخ شمسی نمایشی (مثل «۲۶ شهریور ۱۴۰۵») به [روز, ماه, سال] عددی
function parseJalaliDateStr(str){
  if(!str) return null;
  const en = str.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
  const parts = en.trim().split(/\s+/);
  if(parts.length < 3) return null;
  const day = parseInt(parts[0], 10);
  const monthName = parts.slice(1, parts.length - 1).join(" ");
  const year = parseInt(parts[parts.length - 1], 10);
  const monthIdx = PERSIAN_MONTHS.indexOf(monthName);
  if(isNaN(day) || isNaN(year) || monthIdx === -1) return null;
  return [day, monthIdx + 1, year];
}

const hasCloudStorage = () => (typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function");

async function storageGet(key){
  if(hasCloudStorage()){
    const r = await window.storage.get(key, false);
    return r ? r.value : null;
  }
  return localStorage.getItem(key);
}
async function storageSet(key, value){
  if(SHARE) return;
  if(hasCloudStorage()){
    await window.storage.set(key, value, false);
  }else{
    localStorage.setItem(key, value);
  }
}

// ---------- یکسان‌سازی املای نام تیم‌ها و تورنمنت‌ها ----------
// «رئال‌مادرید»، «رئال مادرید» و «رئال‌ مادرید» یک تیم‌اند؛ برای آمار باید یکی حساب شوند.
// nameKey: کلید مقایسه (بدون فاصله و نیم‌فاصله، با حروف فارسی استاندارد)
const nameKey = name => String(name).replace(/[\u200c\s]/g, "").replace(/ي/g, "ی").replace(/ك/g, "ک");

// cleanName: املای تمیز. حروف عربی ← فارسی، هر جایی که فاصله هست فقط یک فاصله (نیم‌فاصله‌ی کنار فاصله حذف می‌شود)
function cleanName(name){
  return String(name == null ? "" : name)
    .replace(/[<>"]/g, "")
    .replace(/ي/g, "ی").replace(/ك/g, "ک")
    .replace(/[\u200c\s]*\s[\u200c\s]*/g, " ")
    .replace(/\u200c{2,}/g, "\u200c")
    .replace(/^\u200c+|\u200c+$/g, "")
    .trim();
}

// از بین املاهای مختلف یک نام، پرتکرارترین را انتخاب می‌کند (در تساوی، شکل با فاصله)
function buildCanonMap(values){
  const counts = {};
  values.forEach(v => {
    const c = cleanName(v);
    if(!c) return;
    const k = nameKey(c);
    counts[k] = counts[k] || {};
    counts[k][c] = (counts[k][c] || 0) + 1;
  });
  const map = {};
  Object.keys(counts).forEach(k => {
    map[k] = Object.keys(counts[k]).sort((a, b) =>
      counts[k][b] - counts[k][a] || (/\u200c/.test(a) - /\u200c/.test(b)))[0];
  });
  return map;
}
const teamNameMap = () => buildCanonMap(state.matches.flatMap(m => [m.home, m.away]));
const tournamentNameMap = () => buildCanonMap(state.matches.map(m => m.tournament));
function canonicalName(name, map){
  const c = cleanName(name);
  return (map && map[nameKey(c)]) || c;
}

// املای همه‌ی مسابقات ذخیره‌شده را یکسان می‌کند. تعداد موارد اصلاح‌شده را برمی‌گرداند.
function unifyNames(){
  const tm = teamNameMap(), tt = tournamentNameMap();
  let changed = 0;
  state.matches.forEach(m => {
    const h = canonicalName(m.home, tm), a = canonicalName(m.away, tm);
    if(h !== m.home){ m.home = h; changed++; }
    if(a !== m.away){ m.away = a; changed++; }
    if(m.tournament){
      const t = canonicalName(m.tournament, tt);
      if(t !== m.tournament){ m.tournament = t; changed++; }
    }
  });
  return changed;
}

function buildShareFile(){
  const played = state.matches.filter(matchHasResult), ids = new Set(played.map(m => m.id)), preds = {};
  ids.forEach(id => { if(state.predictions[id]) preds[id] = state.predictions[id]; });
  const pendingByWeek = {}; state.matches.filter(m => !matchHasResult(m)).forEach(m => { const wi = getMatchWeekInfo(m); if(wi) pendingByWeek[wi.key] = (pendingByWeek[wi.key] || 0) + 1; });
  const weekAssign = {}; played.forEach(m => { const wi = getMatchWeekInfo(m); if(wi) weekAssign[m.id] = wi; });
  const pendM = state.matches.filter(m => !matchHasResult(m) && state.predictions[m.id] && Object.keys(state.predictions[m.id]).length), pendPreds = {};
  pendM.forEach(m => { pendPreds[m.id] = state.predictions[m.id]; });
  const openAll = state.matches.filter(m => !matchHasResult(m)).sort((a, b) => dateKeyOf(a) - dateKeyOf(b));
  const openWi = openAll.length ? getMatchWeekInfo(openAll[0]) : null;
  const openRd = (openWi ? openAll.filter(m => (getMatchWeekInfo(m) || {}).key === openWi.key) : openAll).slice(0, 40);
  const data = { open: openRd.map(m => ({ id: m.id, home: m.home, away: m.away, date: m.date || "", tournament: m.tournament || "" })), openLabel: openWi && openWi.label ? openWi.label : "", matches: played, pend: pendM, pendPreds, predictions: preds, clubs: state.clubs, teams: state.teams, cup: state.cup, union: state.union || null, hl: state.hl || null, surv: state.surv || null, ethics: state.ethics || null, awards: state.awards || null, shLast: state.shLast || [], pendingByWeek, weekAssign, weekList: getWeekList(), built: Date.now() };
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  const html = BASE_HTML.replace('<div id="modalRoot"></div>', () => '<div id="modalRoot"></div>\n<script>window.__SHARE_DATA__=' + json + ';<\/script>');
  const blob = new Blob([html], { type: "text/html" }), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "index.html"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast(`نسخه‌ی اشتراکی ساخته شد (${toPersianDigits(played.length)} بازی با نتیجه)`);
}

const SNAP_KEY = "league:snaps", SNAP_KEEP = 3, SNAP_GAP = 6 * 86400000;
let snapBusy = false;
function snapData(){ return { matches: state.matches, predictions: state.predictions, clubs: state.clubs, teams: state.teams, cup: state.cup, union: state.union || null, hl: state.hl || null, surv: state.surv || null, ethics: state.ethics || null, aliases: state.aliases }; }
async function snapLoad(){ try{ const r = await storageGet(SNAP_KEY); return r ? JSON.parse(r) : []; }catch(e){ return []; } }
async function snapMake(force, why){
  if(SHARE || !state.loaded || !state.matches.length || snapBusy) return;
  snapBusy = true;
  try{
    const list = await snapLoad(), last = list[0];
    if(!force && last && Date.now() - last.t < SNAP_GAP) return;
    list.unshift({ t: Date.now(), why: why || "خودکار", n: state.matches.length, d: JSON.stringify(snapData()) });
    for(let k = SNAP_KEEP; k >= 1; k--){ try{ await storageSet(SNAP_KEY, JSON.stringify(list.slice(0, k))); return; }catch(e){} }
  }finally{ snapBusy = false; }
}
async function openSnapModal(){

  const rows = list.length ? list.map((s, i) => `<div class="match-item"><div class="teams">${new Date(s.t).toLocaleString("fa-IR")} <span class="badge">${n(s.n)} مسابقه</span> <span class="stat-label">${s.why}</span></div><button class="ghost" onclick="snapRestore(${i})">بازگردانی</button></div>`).join("") : `<div class="empty">هنوز نسخه‌ای ساخته نشده؛ بعد از ثبت نتیجه‌ی بعدی خودکار ساخته می‌شود.</div>`;

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      await snapMake(true, "پیش از ورود پشتیبان");
      const data = JSON.parse(reader.result);
      const incomingMatches = data.matches || [];
      const incomingPredictions = data.predictions || {};
      const predictionSets = data.predictionSets || [];
      const incomingClubs = data.clubs || {};

      // پیش‌فرض ادغام است (چیزی از برنامه حذف نمی‌شود). برای برگشت کامل به زمان بکاپ، جایگزینی کامل انتخاب شود.
      if(incomingMatches.length && confirm("بازگردانی کامل؟\n\nOK = جایگزینی کامل (مسابقه‌ها و پیش‌بینی‌های فعلی پاک می‌شوند و دقیقاً مثل بکاپ می‌شود)\nCancel = فقط ادغام (چیزی حذف نمی‌شود)")){
        state.matches = []; state.predictions = {}; state.undo = null;
      }

      // ادغام مسابقات کامل: مسابقات جدید اضافه می‌شن، مسابقات تکراری (با id یکسان) به‌روزرسانی می‌شن، چیزی حذف نمی‌شه
      const matchMap = new Map(state.matches.map(m => [m.id, m]));
      incomingMatches.forEach(m => matchMap.set(m.id, m));
      state.matches = Array.from(matchMap.values());
      unifyNames(); // املای پشتیبان‌های قدیمی هم با بقیه یکی می‌شود

      // ادغام پیش‌بینی‌های وابسته به id مسابقه
      Object.keys(incomingPredictions).forEach(matchId => {
        state.predictions[matchId] = { ...(state.predictions[matchId] || {}), ...incomingPredictions[matchId] };
      });

      // ادغام پیش‌بینی‌هایی که با نام دو تیم (نه id) به مسابقه وصل می‌شن —
      // برای وقتی خود کاربر مسابقه را داخل برنامه ساخته و فقط پیش‌بینی‌ها ارسال شده
      let matchedSets = 0;
      const unmatchedSets = [];
      const unmatchedNames = new Set();
      predictionSets.forEach(set => {
        let candidates = state.matches.filter(m => nameKey(m.home) === nameKey(set.home) && nameKey(m.away) === nameKey(set.away));
        if(set.date) candidates = candidates.filter(m => m.date === set.date);
        if(candidates.length === 0){
          unmatchedSets.push(`${set.home} - ${set.away}`);
          return;
        }
        // اگر چند مسابقه با اسم یکسان پیدا شد، آخرین موردی که اضافه شده انتخاب می‌شود
        const match = candidates[candidates.length - 1];
        matchedSets++;
        const preds = state.predictions[match.id] || {};
        (set.predictions || []).forEach(pr => {
          const person = PARTICIPANTS.find(p => p.name === pr.name);
          if(!person){ unmatchedNames.add(pr.name); return; }
          preds[person.id] = { h: pr.h, a: pr.a };
        });
        state.predictions[match.id] = preds;
      });

      if(data.teams){ state.teams = Object.assign({assign:{},captains:{},startWeek:9}, data.teams); await saveTeams(); }
      if(data.cup){ state.cup = Object.assign(CUP_DEFAULT(), data.cup); await saveCup(); }
      if(data.union){ state.union = data.union; await saveUnion(); }
      if(data.hl){ state.hl = data.hl; await saveHl(); }
      if(data.surv){ state.surv = data.surv; await saveSurv(); }
      if(data.ethics){ state.ethics = data.ethics; await saveEthics(); }
      if(data.awards){ state.awards = data.awards; await saveAwards(); }
      if(Array.isArray(data.shLast)){ state.shLast = data.shLast; await saveShLast(); }
      if(data.aliases){ Object.assign(state.aliases, data.aliases); await saveAliases(); }
      Object.keys(incomingClubs).forEach(pid => { state.clubs[pid] = incomingClubs[pid]; });

      await saveMatches();
      await savePredictions();
      await saveClubs();
      render();

      let msg = `پشتیبان اضافه شد (${toPersianDigits(incomingMatches.length + matchedSets)} مسابقه)`;
      if(unmatchedSets.length) msg = `برای این مسابقات، موردی با همین اسم تیم‌ها پیدا نشد: ${unmatchedSets.join("، ")}`;
      showToast(msg + " ✅");
      if(unmatchedNames.size) console.warn("اسم‌های ناشناخته (در لیست ۵۸ نفره نبودند):", Array.from(unmatchedNames));
    }catch(e){
      showToast("فایل پشتیبان معتبر نیست");
    }
  };
  reader.readAsText(file);
}

// امتیازدهی طبق قوانین لیگ
function calcPoints(pred, actual){
  if(!pred || actual.homeScore === null || actual.homeScore === undefined) return 0;
  const ph = pred.h, pa = pred.a;
  const ah = actual.homeScore, as = actual.awayScore;
  if(ph === null || ph === undefined || pa === null || pa === undefined) return 0;

  const exact = (ph === ah && pa === as);
  if(exact) return 20; // پیش‌بینی دقیق / مساوی دقیق هر دو ۲۰ امتیاز

  const actualDraw = ah === as;
  const predDraw = ph === pa;

  if(actualDraw){
    if(!predDraw) return 0; // پیش‌بینی مساوی نبوده، مساوی رخ داده: بدون امتیاز
    const distance = Math.abs(ph - ah); // فاصله عدد پیش‌بینی‌شده از عدد واقعی مساوی
    if(distance === 1) return 13; // مساوی نزدیک
    return 8; // مساوی دور (فاصله ۲ یا بیشتر)
  }

  // نتیجه غیرمساوی
  const actualResult = ah > as ? "home" : "away";
  const predResult = predDraw ? "draw" : (ph > pa ? "home" : "away");
  if(predResult !== actualResult) return 0;

  const diffMatch = (ph - pa) === (ah - as);
  if(diffMatch) return 13; // تفاضل صحیح
  return 8; // برد و باخت معمولی
}

// ---------- تحلیل‌ها و آمار ----------
function playedMatchesOrdered(){
  return state.matches.filter(m => m.homeScore !== null && m.homeScore !== undefined);
}

function pointsMatrix(){
  const playedMatches = playedMatchesOrdered();
  const matrix = {};
  playedMatches.forEach(match => {
    const preds = state.predictions[match.id] || {};
    const row = {};
    PARTICIPANTS.forEach(p => { row[p.id] = calcPoints(preds[p.id], match); });
    matrix[match.id] = row;
  });
  return { playedMatches, matrix };
}

function getTournamentList(){
  const set = new Set();
  state.matches.forEach(m => { if(m.tournament) set.add(m.tournament); });
  return Array.from(set);
}

// استخراج نام ماه شمسی از رشته‌ی تاریخ مسابقه (مثلاً "۱۵ مهر ۱۴۰۳" -> "مهر")
function getMatchMonthName(match){
  if(!match.date) return null;
  const parts = match.date.trim().split(/\s+/);
  return parts.length >= 2 ? parts[1] : null;
}

function getMonthList(){
  const set = new Set();
  state.matches.forEach(m => { const mo = getMatchMonthName(m); if(mo && PERSIAN_MONTHS.includes(mo)) set.add(mo); });
  return Array.from(set).sort((a,b) => PERSIAN_MONTHS.indexOf(a) - PERSIAN_MONTHS.indexOf(b));
}

// رده‌بندی + میانگین امتیاز، با امکان فیلتر بر اساس نام تورنمنت ("all" یعنی همه‌ی مسابقات) و/یا نام ماه شمسی
function filteredPlayedMatches(tournamentFilter, monthFilter, weekFilter){
  return state.matches.filter(m =>
    m.homeScore !== null && m.homeScore !== undefined &&
    (tournamentFilter === "all" || !tournamentFilter || m.tournament === tournamentFilter) &&
    (!monthFilter || getMatchMonthName(m) === monthFilter) &&
    (!weekFilter || (getMatchWeekInfo(m) && getMatchWeekInfo(m).key === weekFilter))
  );
}

// opts.excludeDate (اختیاری): مسابقات یک تاریخ مشخص را کنار می‌گذارد، برای محاسبه‌ی رتبه‌ی «قبل از آخرین روز»
function computeStandings(tournamentFilter, monthFilter, weekFilter, opts){
  const excludeDate = opts && opts.excludeDate;
  const untilDate = opts && opts.untilDate;
  const untilSeq = opts && opts.untilSeq; // شماره‌ی ترتیبی بازی: برای «تا پایان یک هفته» که ربطی به تاریخ ندارد
  const matches = filteredPlayedMatches(tournamentFilter, monthFilter, weekFilter)
    .filter(m => !excludeDate || dateKeyOf(m) !== excludeDate)
    .filter(m => !untilDate || dateKeyOf(m) <= untilDate)
    .filter(m => !untilSeq || ((getMatchWeekInfo(m) || {}).seq || 0) <= untilSeq);
  const totals = {}, predictedCount = {};
  PARTICIPANTS.forEach(p => { totals[p.id] = 0; predictedCount[p.id] = 0; });

  matches.forEach(match => {
    const preds = state.predictions[match.id] || {};
    PARTICIPANTS.forEach(p => {
      totals[p.id] += calcPoints(preds[p.id], match);
      const pr = preds[p.id];
      if(pr && pr.h !== null && pr.h !== undefined && pr.a !== null && pr.a !== undefined){
        predictedCount[p.id]++;
      }
    });
  });

  const pure = Object.assign({}, totals); // امتیاز بازی‌ها بدون امتیاز پایه؛ برای محاسبه‌ی میانگین
  // امتیاز پایه فقط در جدول کل فصل (بدون فیلتر تورنمنت/ماه/هفته) اعمال می‌شود
  if(tournamentFilter === "all" && !monthFilter && !weekFilter && !(opts && opts.noBase)){
    const basePts = (state.teams && state.teams.basePoints) || {};
    PARTICIPANTS.forEach(p => { totals[p.id] += (+basePts[p.id] || 0); });
  }

  const arr = PARTICIPANTS.map(p => ({
    id: p.id,
    name: p.name,
    points: totals[p.id],
    predicted: predictedCount[p.id],
    matchPoints: pure[p.id],
    average: predictedCount[p.id] > 0 ? pure[p.id] / predictedCount[p.id] : 0
  }));
  arr.sort((a,b) => b.points - a.points);
  let rank = 0, prevPoints = null, seen = 0;
  arr.forEach(row => {
    seen++;
    if(row.points !== prevPoints){ rank = seen; prevPoints = row.points; }
    row.rank = rank;
  });
  return { standings: arr, matchesCount: matches.length };
}

function bestExactStat(){
  const { playedMatches, matrix } = pointsMatrix();
  const counts = {};
  PARTICIPANTS.forEach(p => counts[p.id] = 0);
  playedMatches.forEach(match => {
    PARTICIPANTS.forEach(p => { if(matrix[match.id][p.id] === 20) counts[p.id]++; });
  });
  let max = 0, leaders = [];
  PARTICIPANTS.forEach(p => {
    if(counts[p.id] > max){ max = counts[p.id]; leaders = [p.id]; }
    else if(counts[p.id] === max && max > 0){ leaders.push(p.id); }
  });
  return { count: max, names: leaders.map(id => PARTICIPANTS.find(p => p.id === id).name) };
}

function bestFormStat(lastN = 5){
  const { playedMatches, matrix } = pointsMatrix();
  const recent = playedMatches.slice(-lastN);
  const sums = {};
  PARTICIPANTS.forEach(p => sums[p.id] = 0);
  recent.forEach(match => {
    PARTICIPANTS.forEach(p => { sums[p.id] += matrix[match.id][p.id] || 0; });
  });
  let max = -1, leaders = [];
  PARTICIPANTS.forEach(p => {
    if(sums[p.id] > max){ max = sums[p.id]; leaders = [p.id]; }
    else if(sums[p.id] === max){ leaders.push(p.id); }
  });
  return { points: Math.max(max, 0), matchesCount: recent.length, names: leaders.map(id => PARTICIPANTS.find(p => p.id === id).name) };
}

function personDistribution(pid){

    counts[pts] = (counts[pts] || 0) + 1;

// روند تغییر رتبه‌ی یک شخص در طول فصل، مسابقه به مسابقه
function personRankSeries(pid){
  const { playedMatches, matrix } = pointsMatrix();
  const running = {};
  PARTICIPANTS.forEach(p => running[p.id] = 0);
  const ranks = [];
  playedMatches.forEach(match => {

function buildRankChartSvg(pid){
  const { playedMatches, ranks } = personRankSeries(pid);
  const n = playedMatches.length;
  const maxRank = PARTICIPANTS.length;
  if(n < 2 || maxRank < 2){
    return { svg: "", empty: true };
  }

  const width = 640, height = 180;
  const pad = { top: 14, right: 14, bottom: 26, left: 34 };
  const yPos = rank => pad.top + ((rank - 1) / (maxRank - 1)) * (height - pad.top - pad.bottom);
  const xStep = (width - pad.left - pad.right) / (n - 1);
  const xPos = i => pad.left + i * xStep;

  const yTickRanks = Array.from(new Set([1, Math.round(maxRank/2), maxRank]));
  const gridLines = yTickRanks.map(r => {
    const y = yPos(r);
    return `<line x1="${pad.left}" y1="${y}" x2="${width-pad.right}" y2="${y}" stroke="#2A3A30" stroke-width="1"/>
            <text x="${pad.left-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#9CAA9F" font-family="Teko">${toPersianDigits(r)}</text>`;
  }).join("");

  const tickCount = Math.min(n, 6);
  const tickStep = Math.max(1, Math.round((n-1) / (tickCount-1 || 1)));
  let xTicks = "";
  for(let i=0; i<n; i += tickStep){
    xTicks += `<text x="${xPos(i)}" y="${height-6}" text-anchor="middle" font-size="10" fill="#9CAA9F" font-family="Teko">${toPersianDigits(i+1)}</text>`;
  }
  if((n-1) % tickStep !== 0){
    xTicks += `<text x="${xPos(n-1)}" y="${height-6}" text-anchor="middle" font-size="10" fill="#9CAA9F" font-family="Teko">${toPersianDigits(n)}</text>`;
  }

  const pts = ranks.map((r,i) => `${xPos(i)},${yPos(r)}`).join(" ");
  const lastY = yPos(ranks[ranks.length-1]);

  const svg = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block;">
      ${gridLines}
      <polyline points="${pts}" fill="none" stroke="var(--gold-soft)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${xPos(n-1)}" cy="${lastY}" r="3.5" fill="var(--gold-soft)"/>
      ${xTicks}
    </svg>`;

  return { svg, empty: false };
}

// بهترین و بدترین تیم برای پیش‌بینی (میانگین امتیاز روی مسابقاتی که آن تیم بازی داشته)
function teamStatsForPerson(pid){
  const { playedMatches, matrix } = pointsMatrix();
  const perTeam = {};
  const tm = teamNameMap();
  playedMatches.forEach(m => {
    const pts = matrix[m.id][pid] || 0;
    [m.home, m.away].forEach(team => {
      const k = nameKey(team);
      if(!perTeam[k]) perTeam[k] = { name: canonicalName(team, tm), sum: 0, count: 0 };
      perTeam[k].sum += pts;
      perTeam[k].count++;
    });
  });
  const teams = Object.values(perTeam).map(t => ({
    name: t.name,
    count: t.count,
    avg: t.sum / t.count
  }));
  let qualified = teams.filter(t => t.count >= 2);
  if(qualified.length === 0) qualified = teams;
  if(qualified.length === 0) return null;
  qualified.sort((a,b) => b.avg - a.avg);
  const best = qualified[0];
  const worst = qualified[qualified.length - 1];
  return { best, worst, sameTeam: best.name === worst.name };
}

// طولانی‌ترین رکورد متوالی مسابقاتی که امتیاز گرفته (بدون افتادن به صفر)
function bestStreak(pid){
  const { playedMatches, matrix } = pointsMatrix();
  let best = 0, current = 0;
  playedMatches.forEach(m => {
    const pts = matrix[m.id][pid] || 0;
    if(pts > 0){ current++; if(current > best) best = current; }
    else { current = 0; }
  });
  return best;
}

// ---------- نشان‌های فصل ----------
// نشان‌هایی که بر اساس کل مسابقات فصل (بدون فیلتر) محاسبه می‌شوند
function computeSeasonBadges(){
  const { playedMatches, matrix } = pointsMatrix();
  const exactCount = {}, drawPoints = {}, boldCount = {}, pointsArr = {};
  PARTICIPANTS.forEach(p => { exactCount[p.id]=0; drawPoints[p.id]=0; boldCount[p.id]=0; pointsArr[p.id]=[]; });

  playedMatches.forEach(match => {
    const preds = state.predictions[match.id] || {};
    const c = crowdForMatch(match);
    const actualDraw = match.homeScore === match.awayScore;
    PARTICIPANTS.forEach(p => {
      const pred = preds[p.id];
      if(!pred || !isNum(pred.h) || !isNum(pred.a)) return;
      const pts = matrix[match.id][p.id] || 0;
      pointsArr[p.id].push(pts);
      if(pts === 20) exactCount[p.id]++;
      if(actualDraw && pred.h === pred.a && pts > 0) drawPoints[p.id]++;
      const outcome = outcomeOf(pred.h, pred.a);
      const share = c.total ? c.outcome[outcome] / c.total : 0;
      if(pts > 0 && c.total >= 5 && share > 0 && share < 0.25) boldCount[p.id]++;
    });
  });

  const volatility = {};
  PARTICIPANTS.forEach(p => {
    const arr = pointsArr[p.id];
    if(arr.length >= 5){
      const mean = arr.reduce((a,b)=>a+b,0) / arr.length;
      const variance = arr.reduce((a,b)=>a+(b-mean)*(b-mean),0) / arr.length;
      volatility[p.id] = Math.sqrt(variance);
    }
  });

  function topOf(obj, minVal){
    const entries = Object.entries(obj).filter(([id,v]) => v >= minVal);
    if(entries.length === 0) return { winners: [], value: 0 };
    const max = Math.max(...entries.map(([,v])=>v));
    const winners = entries.filter(([,v])=>v===max).map(([id])=> PARTICIPANTS.find(p=>p.id===id));
    return { winners, value: max };
  }

  return {
    sharp: { icon:"🎯", title:"تیزبین", desc:"بیشترین پیش‌بینی دقیق فصل", ...topOf(exactCount, 1) },
    drawKing: { icon:"🤝", title:"شاه مساوی", desc:"بیشترین امتیاز از پیش‌بینی مساوی", ...topOf(drawPoints, 1) },
    bold: { icon:"🦁", title:"جسورترین", desc:"بیشترین پیش‌بینی خلاف جمع (کمتر از ۲۵٪) که درست از آب درآمده", ...topOf(boldCount, 1) },
    volatile: { icon:"🎢", title:"بی‌ثبات‌ترین", desc:"بیشترین نوسان امتیاز بین مسابقات (حداقل ۵ پیش‌بینی)", ...topOf(volatility, 0.01) }
  };
}

const isNum = v => v !== null && v !== undefined && v !== "" && !isNaN(v);
function matchHasResult(m){ return m.homeScore !== null && m.homeScore !== undefined; }
const outcomeOf = (h, a) => h > a ? "H" : (h < a ? "A" : "D");
const scoreText = (h, a) => `${toPersianDigits(h)} - ${toPersianDigits(a)}`;
const pctText = (n, total) => toPersianDigits(total ? Math.round(n / total * 100) : 0) + "٪";

function maxSeqOf(ms){ return Math.max(0, ...ms.map(m => (getMatchWeekInfo(m) || {}).seq || 0)); }
function dateKeyOf(m){
  const p = parseMatchJalaliDate(m);
  return p ? p[0] * 10000 + p[1] * 100 + p[2] : 0;
}

// ---------- فلش صعود و سقوط ----------
// تغییر رتبه نسبت به قبل از آخرین روزی که در همان فیلتر مسابقه‌ی دارای نتیجه داشتیم
function rankDeltas(tournamentFilter, monthFilter, weekFilter){
  const played = filteredPlayedMatches(tournamentFilter, monthFilter, weekFilter);
  const keys = played.map(dateKeyOf).filter(k => k > 0);
  if(keys.length === 0) return null;
  const latest = Math.max(...keys);
  if(!keys.some(k => k !== latest)) return null; // قبل از آخرین روز چیزی نبوده که مقایسه کنیم
  const cur = computeStandings(tournamentFilter, monthFilter, weekFilter).standings;
  const prev = computeStandings(tournamentFilter, monthFilter, weekFilter, { excludeDate: latest }).standings;
  const prevRank = {};
  prev.forEach(r => prevRank[r.id] = r.rank);
  const map = {};
  cur.forEach(r => { map[r.id] = prevRank[r.id] - r.rank; });
  const latestMatch = played.find(m => dateKeyOf(m) === latest);
  const curRank = {};
  cur.forEach(r => { curRank[r.id] = r.rank; });
  return { map, curRank, prevRank, latestLabel: latestMatch ? latestMatch.date : "" };
}

// ---------- هوش جمعی ----------
function crowdForMatch(match){
  const preds = state.predictions[match.id] || {};
  const entries = [];
  PARTICIPANTS.forEach(p => {
    const pr = preds[p.id];
    if(pr && isNum(pr.h) && isNum(pr.a)) entries.push({ pid: p.id, name: p.name, h: +pr.h, a: +pr.a });
  });
  const byScore = new Map();
  entries.forEach(e => {
    const k = e.h + "-" + e.a;
    if(!byScore.has(k)) byScore.set(k, { h: e.h, a: e.a, n: 0 });
    byScore.get(k).n++;
  });
  const scores = Array.from(byScore.values()).sort((x, y) => y.n - x.n || (x.h + x.a) - (y.h + y.a) || x.h - y.h);
  const outcome = { H: 0, D: 0, A: 0 };
  entries.forEach(e => outcome[outcomeOf(e.h, e.a)]++);
  return { entries, total: entries.length, scores, outcome, byScore };
}

    const maxN = c.scores[0].n;

          <div style="flex:1; background:#0F1912; border-radius:6px; overflow:hidden; height:16px;">
            <div style="width:${Math.round(s.n / maxN * 100)}%; height:100%; background:${isActual ? 'var(--gold-soft)' : '#2D8659'};"></div>
          </div>

    }).join("");

    let insights = "";
    if(played){
      const scored = c.entries.map(e => ({ e, p: calcPoints({ h: e.h, a: e.a }, match) }));
      const right = scored.filter(x => x.p > 0).length;
      const exact = scored.filter(x => x.p === 20);
      const actualKey = match.homeScore + "-" + match.awayScore;
      const actualGroup = c.byScore.get(actualKey);
      const majority = Object.keys(c.outcome).sort((x, y) => c.outcome[y] - c.outcome[x])[0];
      const actualOutcome = outcomeOf(match.homeScore, match.awayScore);
      const majorityName = majority === "H" ? `برد ${match.home}` : majority === "A" ? `برد ${match.away}` : "مساوی";
      const againstCrowd = scored.filter(x => x.p > 0 && (c.outcome[outcomeOf(x.e.h, x.e.a)] / c.total) < 0.25);

      insights = `

        </div>
        <div class="stat-block">
          <div class="stat-label">قضاوت جمع</div>
          <div class="stat-value">اکثریت (${pctText(c.outcome[majority], c.total)}) روی «${majorityName}» بودند — ${majority === actualOutcome ? "جمع درست گفت" : "جمع اشتباه کرد"}.
            ${pctText(right, c.total)} از پیش‌بینی‌ها امتیاز گرفتند.</div>
        </div>
        ${exact.length > 0 ? `
        <div class="stat-block">
          <div class="stat-label">پیش‌بینی دقیق (فقط ${toPersianDigits(exact.length)} نفر از ${toPersianDigits(c.total)} نفر)</div>
          <div class="stat-value">${exact.map(x => x.e.name).join("، ")}</div>
        </div>` : ""}
        ${againstCrowd.length > 0 ? `
        <div class="stat-block">
          <div class="stat-label">خلاف جمع و درست (نتیجه‌ای که کمتر از ۲۵٪ پیش‌بینی کرده بودند)</div>
          <div class="stat-value">${againstCrowd.slice(0, 6).map(x => x.e.name).join("، ")}${againstCrowd.length > 6 ? ` و ${toPersianDigits(againstCrowd.length - 6)} نفر دیگر` : ""}</div>
        </div>` : ""}`;
    }

    body = `
      <div style="display:flex; height:14px; border-radius:7px; overflow:hidden; margin:4px 0 8px;">${bar}</div>
      <div style="display:flex; flex-wrap:wrap; gap:6px 16px; margin-bottom:14px;">${legend}</div>
      <div class="stat-label" style="margin-bottom:6px;">پرتکرارترین پیش‌بینی‌ها (از ${toPersianDigits(c.total)} نفر)</div>
      ${bars}
      <div style="margin-top:12px;">${insights}</div>`;
  }

  return `
    <div class="card">
      <h2>هوش جمعی</h2>
      <div class="row">
        <select id="crowdMatchSelect">
          ${state.matches.slice().reverse().map(m => `
            <option value="${m.id}" ${m.id === match.id ? "selected" : ""}>${matchHasResult(m) ? "✓ " : ""}${m.home} - ${m.away}${m.date ? " (" + m.date + ")" : ""}</option>`).join("")}
        </select>
      </div>
      ${c.total ? `<div class="row"><button class="ghost" onclick="copyTxt(preMatchWaText('${match.id}'))">💬 متن واتساپ قبل از بازی</button></div>` : ""}
      ${body}
    </div>`;
}

function pendingMatches(){ return state.matches.filter(m => !matchHasResult(m)); }

function scenarioScopeParams(match, scope){
  if(scope === "week"){
    const wi = getMatchWeekInfo(match);
    if(wi){
      const w = getWeekList().find(x => x.key === wi.key);
      return { month: null, week: wi.key, label: w ? w.label : "این هفته" };
    }
  }
  if(scope === "all") return { month: null, week: null, label: "کل فصل" };
  return { month: null, week: null, label: "کل فصل" };
}

function standingsWithHypo(match, h, a, params){
  const oh = match.homeScore, oa = match.awayScore;
  match.homeScore = h; match.awayScore = a;
  try{
    return computeStandings("all", params.month, params.week).standings;
  }finally{
    match.homeScore = oh; match.awayScore = oa;
  }
}

function scenarioClasses(match){
  const crowd = crowdForMatch(match);
  let maxG = 0;
  crowd.entries.forEach(e => { maxG = Math.max(maxG, e.h, e.a); });
  const M = Math.max(maxG + 2, 4);
  const specialKeys = new Set(crowd.scores.map(s => s.h + "-" + s.a));

  // کلاس‌های هم‌ارز: هر نتیجه‌ای که کسی دقیق پیش‌بینی کرده تک‌تک جدا حساب می‌شود،
  // بقیه بر اساس نوع (برد میزبان / مساوی / برد میهمان) و اختلاف گل دسته‌بندی می‌شوند
  const classes = [];
  crowd.scores.forEach(s => {
    const type = outcomeOf(s.h, s.a);
    classes.push({ kind: "special", type, d: type === "D" ? s.h : Math.abs(s.h - s.a), h: s.h, a: s.a, n: s.n });
  });
  ["H", "A"].forEach(type => {
    for(let d = 1; d <= M; d++){
      let rep = null;
      for(let lo = 0; lo + d <= M; lo++){
        const h = type === "H" ? lo + d : lo;
        const a = type === "H" ? lo : lo + d;
        if(!specialKeys.has(h + "-" + a)){ rep = [h, a]; break; }
      }
      if(rep) classes.push({ kind: "family", type, d, h: rep[0], a: rep[1], n: 0 });
    }
  });
  for(let n = 0; n <= M; n++){
    if(!specialKeys.has(n + "-" + n)) classes.push({ kind: "family", type: "D", d: n, h: n, a: n, n: 0 });
  }

  return { crowd, classes, M };
}

function computeScenarios(match, params){
  const { crowd, classes, M } = scenarioClasses(match);
  const current = computeStandings("all", params.month, params.week).standings;
  const curPoints = {};
  current.forEach(r => curPoints[r.id] = r.points);
  const curTop = current.filter(r => r.rank <= 3).map(r => `${r.rank}:${r.id}`).join("|");

  const groupsMap = new Map();
  classes.forEach(c => {
    const st = standingsWithHypo(match, c.h, c.a, params);
    const top = st.filter(r => r.rank <= 3).map(r => ({ id: r.id, name: r.name, rank: r.rank, points: r.points }));
    const sig = top.map(r => `${r.rank}:${r.id}:${r.points}`).join("|");
    if(!groupsMap.has(sig)) groupsMap.set(sig, { top, classes: [], support: 0 });
    const g = groupsMap.get(sig);
    g.classes.push(c);
    g.support += c.n;
  });

  const groups = Array.from(groupsMap.values());
  groups.forEach(g => {
    g.same = g.top.map(r => `${r.rank}:${r.id}`).join("|") === curTop;
    g.chips = scenarioChips(g.classes, match, M, classes);
  });
  groups.sort((x, y) => y.support - x.support);
  return { groups, curPoints, current, crowd };
}

function scenarioChips(groupClasses, match, M, allClasses){
  const chips = [];
  groupClasses.filter(c => c.kind === "special").sort((x, y) => y.n - x.n)
    .forEach(c => chips.push({ text: scoreText(c.h, c.a), sub: `${toPersianDigits(c.n)} نفر` }));

  const specialInRange = (type, from, to) => allClasses.some(c => c.kind === "special" && c.type === type && c.d >= from && c.d <= to);
  const runsOf = list => {
    const runs = [];
    let i = 0;
    while(i < list.length){
      let j = i;
      while(j + 1 < list.length && list[j + 1].d === list[j].d + 1) j++;
      runs.push({ start: list[i].d, end: list[j].d, first: list[i] });
      i = j + 1;
    }
    return runs;
  };
  const fam = type => groupClasses.filter(c => c.kind === "family" && c.type === type).sort((x, y) => x.d - y.d);

  ["H", "A"].forEach(type => {
    const who = type === "H" ? match.home : match.away;
    runsOf(fam(type)).forEach(r => {
      const open = r.end === M;
      const other = specialInRange(type, r.start, open ? Infinity : r.end);
      let text;
      if(open && r.start === 1) text = other ? `سایر بردهای ${who}` : `هر برد ${who}`;
      else if(open) text = `${other ? "سایر " : ""}برد ${who} با ${toPersianDigits(r.start)} گل اختلاف یا بیشتر`;
      else if(r.start === r.end) text = `${other ? "سایر " : ""}برد ${who} با ${toPersianDigits(r.start)} گل اختلاف`;
      else text = `${other ? "سایر " : ""}برد ${who} با ${toPersianDigits(r.start)} تا ${toPersianDigits(r.end)} گل اختلاف`;
      chips.push({ text, sub: `مثل ${scoreText(r.first.h, r.first.a)}` });
    });
  });

  runsOf(fam("D")).forEach(r => {
    const open = r.end === M;
    const other = specialInRange("D", r.start, open ? Infinity : r.end);
    let text;
    if(open && r.start === 0) text = other ? "سایر مساوی‌ها" : "هر مساوی";
    else if(open) text = `${other ? "سایر " : ""}مساوی ${scoreText(r.start, r.start)} و بالاتر`;
    else if(r.start === r.end) text = `${other ? "سایر " : ""}مساوی ${scoreText(r.start, r.start)}`;
    else text = `${other ? "سایر " : ""}مساوی از ${scoreText(r.start, r.start)} تا ${scoreText(r.end, r.end)}`;
    chips.push({ text, sub: "" });
  });
  return chips;
}

function computeHallOfFame(){
  const champsOf = res => res.matchesCount > 0 ? res.standings.filter(r => r.rank === 1 && r.points > 0) : [];

  const weeks = getWeekList().map(w => {
    const ms = state.matches.filter(m => { const i = getMatchWeekInfo(m); return i && i.key === w.key; });
    const playedCount = ms.filter(matchHasResult).length;
    const first = ms.length ? getMatchWeekInfo(ms[0]) : null;
    const wTotal = weekTotalOf(w);
    return { title: w.label, sub: first ? first.label : "", order: w.sortKey, total: wTotal, playedCount,
             done: wTotal > 0 && playedCount === wTotal && weekIsFull(w), champs: champsOf(computeStandings("all", null, w.key)) };
  }).filter(x => x.playedCount > 0);

  const months = getMonthList().map(mo => {
    const ms = state.matches.filter(m => getMatchMonthName(m) === mo);
    const playedCount = ms.filter(matchHasResult).length;
    return { title: mo, sub: "", order: PERSIAN_MONTHS.indexOf(mo), total: ms.length, playedCount,
             done: ms.length > 0 && playedCount === ms.length, champs: champsOf(computeStandings("all", mo)) };
  }).filter(x => x.playedCount > 0);

  const tournaments = getTournamentList().map((t, i) => {
    const ms = state.matches.filter(m => m.tournament === t);
    const playedCount = ms.filter(matchHasResult).length;
    return { title: t, sub: "", order: i, total: ms.length, playedCount,
             done: ms.length > 0 && playedCount === ms.length, champs: champsOf(computeStandings(t)) };
  }).filter(x => x.playedCount > 0);

  const titles = {};
  PARTICIPANTS.forEach(p => titles[p.id] = { w: 0, m: 0, t: 0 });
  weeks.filter(x => x.done).forEach(x => x.champs.forEach(c => titles[c.id].w++));
  months.filter(x => x.done).forEach(x => x.champs.forEach(c => titles[c.id].m++));
  tournaments.filter(x => x.done).forEach(x => x.champs.forEach(c => titles[c.id].t++));

  const rows = PARTICIPANTS.map(p => ({ id: p.id, name: p.name, ...titles[p.id], total: titles[p.id].w + titles[p.id].m + titles[p.id].t }))
    .filter(r => r.total > 0)
    .sort((a, b) => b.total - a.total || b.m - a.m || b.w - a.w || b.t - a.t);

  return { weeks: weeks.sort((a, b) => b.order - a.order), months: months.sort((a, b) => b.order - a.order), tournaments, rows };
}

// ===== پرافتخارترین‌ها: جدول مدال‌های هفتگی (سبک المپیک: اول طلا، بعد نقره، بعد برنز) =====
// فقط هفته‌های کامل‌شده حساب می‌شوند. رتبه‌ی ۱/۲/۳ همان هفته = طلا/نقره/برنز (مساوی‌ها مدال مشترک می‌گیرند).
function computeMedalTable(){
  const tally = {};
  PARTICIPANTS.forEach(p => tally[p.id] = { id: p.id, name: p.name, g: 0, s: 0, b: 0 });
  let doneWeeks = 0;
  getWeekList().forEach(w => {
    const ms = state.matches.filter(m => { const i = getMatchWeekInfo(m); return i && i.key === w.key; });
    const played = ms.filter(matchHasResult).length, tot = weekTotalOf(w);
    if(!(tot > 0 && played === tot && weekIsFull(w))) return;
    const res = computeStandings("all", null, w.key);
    if(!(res.matchesCount > 0)) return;
    doneWeeks++;
    res.standings.forEach(r => {
      if(!(r.points > 0) || r.rank > 3 || !tally[r.id]) return;
      if(r.rank === 1) tally[r.id].g++; else if(r.rank === 2) tally[r.id].s++; else tally[r.id].b++;
    });
  });
  const rows = Object.values(tally).filter(r => r.g + r.s + r.b > 0)
    .map(r => ({ ...r, total: r.g + r.s + r.b }))
    .sort((a, b) => b.g - a.g || b.s - a.s || b.b - a.b || a.name.localeCompare(b.name, "fa"));
  rows.forEach((r, i) => { const q = rows[i - 1]; r.rank = q && q.g === r.g && q.s === r.s && q.b === r.b ? q.rank : i + 1; });
  return { rows, doneWeeks };
}
function medalsCardHtml(){
  const n = toPersianDigits, M = computeMedalTable(), admin = !SHARE;

// ===== جایزه‌ی پیراهن ورزشی =====
// قوانین: هفته‌ی ۱۱: نفر اول هفته. مهرماه: نفر اول و دوم + دو نفر برتر که قبلاً برنده نشده‌اند.
// از هفته‌ی ۱۲ (بدون جدول ماهانه): نفر اول هفته + بالاترین امتیاز هفته در بین کسانی که قبلاً برنده نشده‌اند.
// مساوی‌ها خودکار تعیین نمی‌شوند؛ مدیر دستی انتخاب می‌کند.
const JERSEY = "👕", PRIZE_FIRST_WEEK = 11, PRIZE_MONTH = "مهر";
let _awCache = null;
function awInit(){
  if(!state.awards) state.awards = { prev: {}, closedMonths: [], manual: {} };
  const A = state.awards; A.prev = A.prev || {}; A.closedMonths = A.closedMonths || []; A.manual = A.manual || {};
  return A;
}
async function saveAwards(){ try{ await storageSet("league:awards", JSON.stringify(state.awards)); }catch(e){ showToast("خطا در ذخیره‌ی برندگان جایزه"); } }
async function awSetPrev(pid, v){ awInit().prev[pid] = Math.max(0, parseInt(v) || 0); await saveAwards(); render(); }
async function awCloseMonth(on){ const A = awInit(); A.closedMonths = A.closedMonths.filter(x => x !== PRIZE_MONTH); if(on) A.closedMonths.push(PRIZE_MONTH); await saveAwards(); render(); }
async function awPick(pi, si, pid, on){
  const S = getAwards().periods[pi].slots[si], A = awInit();
  let cur = (A.manual[S.mkey] || []).filter(x => S.tied.includes(x));
  cur = cur.filter(x => x !== pid); if(on) cur.push(pid);
  while(cur.length > S.need) cur.shift();
  if(cur.length) A.manual[S.mkey] = cur; else delete A.manual[S.mkey];
  await saveAwards(); render();
}
// انتخاب N نفر از فهرست مرتب‌شده؛ اگر مرز انتخاب مساوی باشد، منتظر انتخاب دستی می‌ماند
function awTake(cands, N, mkey){
  const c = cands.filter(r => r.points > 0);
  if(c.length <= N) return { win: c.map(r => r.id), pending: false, tied: [], need: 0, mkey };
  const cut = c[N - 1].points;
  if(c[N].points < cut) return { win: c.slice(0, N).map(r => r.id), pending: false, tied: [], need: 0, mkey };
  const sure = c.filter(r => r.points > cut).map(r => r.id), tied = c.filter(r => r.points === cut).map(r => r.id), need = N - sure.length;
  const man = (awInit().manual[mkey] || []).filter(id => tied.includes(id));
  if(man.length === need) return { win: sure.concat(man), pending: false, tied, need, mkey };
  return { win: sure, pending: true, tied, need, mkey };
}
function computeAwards(){
  const A = awInit(), mi = PERSIAN_MONTHS.indexOf(PRIZE_MONTH), periods = [];
  getWeekList().filter(w => w.weekNumber >= PRIZE_FIRST_WEEK).forEach(w => {
    const ms = state.matches.filter(m => matchHasResult(m) && (getMatchWeekInfo(m) || {}).key === w.key);
    if(ms.length) periods.push({ kind: "w", key: w.key, title: w.label, wn: w.weekNumber, end: Math.max(...ms.map(dateKeyOf)), final: weekRemaining(w) === 0 });
  });
  const mms = state.matches.filter(m => matchHasResult(m) && getMatchMonthName(m) === PRIZE_MONTH);
  if(mms.length){
    const later = state.matches.some(m => matchHasResult(m) && PERSIAN_MONTHS.indexOf(getMatchMonthName(m)) > mi);
    periods.push({ kind: "m", key: PRIZE_MONTH, title: PRIZE_MONTH + "ماه", wn: 0, end: Math.max(...mms.map(dateKeyOf)), final: later || A.closedMonths.includes(PRIZE_MONTH), later });
  }
  periods.sort((a, b) => a.end - b.end || (a.kind === b.kind ? 0 : a.kind === "w" ? -1 : 1) || a.wn - b.wn);
  const won = new Set(Object.keys(A.prev).filter(id => (+A.prev[id] || 0) > 0)), counts = {};
  PARTICIPANTS.forEach(p => counts[p.id] = +A.prev[p.id] || 0);
  const blocked = (label, mkey, need) => ({ id: "blk", label, win: [], pending: true, blocked: true, tied: [], need, mkey });
  periods.forEach(P => {
    const used = new Set(won); P.slots = [];
    if(P.kind === "w"){
      const st = computeStandings("all", null, P.key).standings;
      const top = Object.assign({ id: "top", label: "نفر اول هفته" }, awTake(st, 1, P.key + "|top")); P.slots.push(top);
      if(P.wn >= PRIZE_FIRST_WEEK + 1){
        if(top.pending) P.slots.push(blocked("بیشترین امتیاز بدون جایزه‌ی قبلی", P.key + "|next", 1));
        else{ top.win.forEach(id => used.add(id)); P.slots.push(Object.assign({ id: "next", label: "بیشترین امتیاز بدون جایزه‌ی قبلی" }, awTake(st.filter(r => !used.has(r.id)), 1, P.key + "|next"))); }
      }
    }else{
      const st = computeStandings("all", P.key).standings;
      const a = Object.assign({ id: "top2", label: "نفر اول و دوم ماه" }, awTake(st, 2, P.key + "|top2")); P.slots.push(a);
      if(a.pending) P.slots.push(blocked("دو نفر برتر بدون جایزه‌ی قبلی", P.key + "|new2", 2));
      else{ a.win.forEach(id => used.add(id)); P.slots.push(Object.assign({ id: "new2", label: "دو نفر برتر بدون جایزه‌ی قبلی" }, awTake(st.filter(r => !used.has(r.id)), 2, P.key + "|new2"))); }
    }
    P.winners = []; P.prospect = [];
    P.slots.forEach(S => { S.win.forEach(id => { P.winners.push(id); P.prospect.push(id); }); if(S.pending) S.tied.forEach(id => { if(!P.prospect.includes(id)) P.prospect.push(id); }); });
    if(P.final) P.winners.forEach(id => { counts[id]++; won.add(id); });
  });
  const byPeriod = {}; periods.forEach(P => byPeriod[P.kind + ":" + P.key] = P);
  const rows = PARTICIPANTS.map(p => ({ id: p.id, name: p.name, count: counts[p.id] })).filter(r => r.count > 0).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "fa"));
  return { periods, byPeriod, rows };
}
function getAwards(){ return _awCache || (_awCache = computeAwards()); }
// پیراهن جلوی اسم در جدول هفتگی/ماهانه برای کسانی که جایزه‌ی آن دوره به آن‌ها می‌رسد (یا تا این لحظه می‌رسد)
function prizeMark(kind, key, pid){ const P = getAwards().byPeriod[kind + ":" + key]; return P && P.prospect.includes(pid) ? JERSEY + " " : ""; }
function awardsCardHtml(){
  const n = toPersianDigits, A = awInit(), R = getAwards();
  if(SHARE && !R.rows.length && !R.periods.length) return `<div class="card"><div class="empty">هنوز برنده‌ای ثبت نشده.</div></div>`;
  const prevCount = Object.keys(A.prev).filter(id => (+A.prev[id] || 0) > 0).length;
  const pend = !SHARE && R.periods.some(P => P.final && P.slots.some(S => S.pending));
  const summary = R.rows.length
    ? `<table><thead><tr><th>#</th><th>نام</th><th>پیراهن‌ها</th><th>تعداد</th></tr></thead><tbody>${R.rows.map((r, i) => `<tr><td>${n(i + 1)}</td><td><button class="nameLink" data-pid="${r.id}">${r.name}</button></td><td>${JERSEY.repeat(r.count)}</td><td class="rank-cell">${n(r.count)}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">هنوز برنده‌ای ثبت نشده.</div>`;
  const slotHtml = (P, pi) => P.slots.map((S, si) => {
    const line = S.win.length ? S.win.map(id => `${JERSEY} ${pname(id)}`).join("، ") : `<span style="color:var(--text-dim)">${S.pending ? "در انتظار تعیین" : "—"}</span>`;
    let pick = "";
    if(!SHARE && S.blocked) pick = `<div class="points-legend">اول مساوی بالاتر را تعیین کن.</div>`;
    else if(!SHARE && S.tied.length){
      const cur = (A.manual[S.mkey] || []);
      pick = `<div class="aw-pick points-legend">مساوی شدند؛ ${n(S.need)} نفر را انتخاب کن:${S.tied.map(id => `<label style="display:inline-flex;gap:4px;align-items:center;margin:4px 0 0 10px;"><input type="checkbox" ${cur.includes(id) ? "checked" : ""} onchange="awPick(${pi},${si},'${id}',this.checked)"> ${pname(id)}</label>`).join("")}</div>`;
    }

// ===== جایزه‌ی اخلاق: ۱۵ نفر اول هر بار چسباندن پیام‌ها یک واحد می‌گیرند =====
function ethInit(){
  if(!state.ethics) state.ethics = { base: {}, rounds: [], topN: 15 };
  const E = state.ethics; E.base = E.base || {}; E.rounds = E.rounds || []; E.topN = E.topN || 15;
  return E;
}
async function saveEthics(){ try{ await storageSet("league:ethics", JSON.stringify(state.ethics)); }catch(e){ showToast("خطا در ذخیره‌ی جایزه‌ی اخلاق"); } }
// ترتیب شرکت: بر اساس آخرین پیام هر نفر (اگر ویرایش فرستاد، جای ویرایش حساب می‌شود)
function ethOrder(list){
  const by = new Map();
  list.forEach(p => { if(!p.pid || !p.map.size || p.last == null) return; const o = by.get(p.pid); if(!o) by.set(p.pid, { pid: p.pid, first: p.first, last: p.last }); else{ o.first = Math.min(o.first, p.first); o.last = Math.max(o.last, p.last); } });
  const a = [...by.values()], rf = {};
  a.slice().sort((x, y) => x.first - y.first).forEach((x, i) => rf[x.pid] = i + 1);
  return a.sort((x, y) => x.last - y.last).map((x, i) => ({ pid: x.pid, rank: i + 1, first: rf[x.pid] }));
}
function ethMerge(oldOrder, newOrder){ const ns = new Set(newOrder); return oldOrder.filter(p => !ns.has(p)).concat(newOrder); }
// دورِ هم‌بازی: اگر بازی‌های این ثبت با یک دورِ قبلی حداقل نیمی هم‌پوشانی دارد، همان دور است (ثبت یکی‌یکی)
function ethFind(ids){
  let best = -1, bo = 0;
  ethInit().rounds.forEach((r, i) => {
    const rs = new Set(r.ids || (r.key || "").split("|")), ov = ids.filter(x => rs.has(x)).length;
    if(ov >= Math.max(1, Math.ceil(Math.min(ids.length, rs.size) / 2)) && ov > bo){ best = i; bo = ov; }
  });
  return best;
}
function ethTotals(){
  const E = ethInit(), t = {};
  PARTICIPANTS.forEach(p => t[p.id] = { id: p.id, name: p.name, base: +E.base[p.id] || 0, rounds: 0 });
  E.rounds.forEach(r => r.top.forEach(pid => { if(t[pid]) t[pid].rounds++; }));
  return Object.values(t).map(x => Object.assign(x, { total: x.base + x.rounds })).sort((a, b) => b.total - a.total || b.rounds - a.rounds || a.name.localeCompare(b.name, "fa"));
}
async function ethSetBase(pid, v){ ethInit().base[pid] = Math.max(0, parseInt(v) || 0); await saveEthics(); render(); }
async function ethSetTop(v){ ethInit().topN = Math.min(PARTICIPANTS.length, Math.max(1, parseInt(v) || 15)); await saveEthics(); render(); }
function ethCardHtml(){

    ${SHARE ? "" : `<div class="row" style="align-items:center;margin-bottom:8px;"><span class="stat-label">تعداد نفرات هر دور</span><input type="number" min="1" value="${E.topN}" style="width:70px;" onchange="ethSetTop(this.value)"><button class="ghost" onclick="openWhatsappModal('et:')">💬 متن واتساپ</button></div>`}
    <table><thead><tr><th>#</th><th>نام</th><th>پایه (دورهای قبل)</th><th>دورها</th><th>جمع</th></tr></thead><tbody>
    ${rows.map((t, i) => `<tr><td>${n(i + 1)}</td><td>${t.name}</td><td>${SHARE ? n(t.base) : `<input type="number" min="0" value="${t.base}" style="width:60px;" onchange="ethSetBase('${t.id}', this.value)">`}</td><td>${n(t.rounds)}</td><td class="rank-cell">${n(t.total)}</td></tr>`).join("")}
    </tbody></table></div>`;
}
function ethText(){

}

// ---------- سخت‌ترین و آسان‌ترین تیم‌ها برای پیش‌بینی ----------
function teamDifficultyStats(){
  const per = {};
  const tm = teamNameMap();
  state.matches.filter(matchHasResult).forEach(m => {
    const c = crowdForMatch(m);
    if(c.total < 5) return;
    let sum = 0, scored = 0;
    c.entries.forEach(e => {
      const p = calcPoints({ h: e.h, a: e.a }, m);
      sum += p;
      if(p > 0) scored++;
    });
    const actual = outcomeOf(m.homeScore, m.awayScore);
    const wrong = c.outcome[actual] < Math.max(c.outcome.H, c.outcome.D, c.outcome.A); // اکثریت روی نتیجه‌ی دیگری بود
    [m.home, m.away].forEach(t => {
      const k = nameKey(t);
      if(!per[k]) per[k] = { name: canonicalName(t, tm), matches: 0, avgSum: 0, scoredSum: 0, wrong: 0 };
      per[k].matches++;
      per[k].avgSum += sum / c.total;
      per[k].scoredSum += scored / c.total;
      if(wrong) per[k].wrong++;
    });
  });
  const teams = Object.values(per).filter(t => t.matches >= 3).map(t => ({
    name: t.name, matches: t.matches, avg: t.avgSum / t.matches, scoredShare: t.scoredSum / t.matches, wrong: t.wrong
  }));
  const k = Math.min(5, Math.floor(teams.length / 2));
  const hardest = teams.slice().sort((a, b) => a.avg - b.avg || b.wrong - a.wrong).slice(0, k);
  const easiest = teams.slice().sort((a, b) => b.avg - a.avg || a.wrong - b.wrong).slice(0, k);
  return { hardest, easiest, teamCount: teams.length };
}

      </div>
      <div class="stat-label" style="margin-bottom:4px;">🔥 سخت‌ترین (بیشتر از همه جمع را فریب دادند)</div>

// ---------- کارت هفتگی برای اشتراک‌گذاری ----------
async function generateWeeklyCard(weekKey, weekLabel){
  const weekMatches = state.matches.filter(m => { const i = getMatchWeekInfo(m); return i && i.key === weekKey; });
  const ms = weekMatches.filter(matchHasResult);
  if(ms.length === 0){ showToast("برای این هفته هنوز نتیجه‌ای ثبت نشده"); return; }
  const rangeLabel = getMatchWeekInfo(weekMatches[0]).label;
  const { standings } = computeStandings("all", null, weekKey);
  const podium = standings.filter(r => r.rank <= 3 && r.points > 0).slice(0, 6);

  const weekDeltas = rankDeltas("all", null, weekKey);
  let risers = [], fallers = [];
  if(weekDeltas){
    const deltaList = standings
      .map(r => ({ id: r.id, name: r.name, d: weekDeltas.map[r.id] || 0 }))
      .filter(x => x.d !== 0);
    risers = deltaList.filter(x => x.d > 0).sort((a,b) => b.d - a.d).slice(0, 2);
    fallers = deltaList.filter(x => x.d < 0).sort((a,b) => a.d - b.d).slice(0, 2);
  }

  const perMatch = ms.map(m => {
    const c = crowdForMatch(m);
    const scored = c.entries.filter(e => calcPoints({ h: e.h, a: e.a }, m) > 0).length;
    const exact = c.entries.filter(e => calcPoints({ h: e.h, a: e.a }, m) === 20);
    return { m, c, total: c.total, scored, exact, share: c.total ? scored / c.total : 1 };
  });

  let surprise = null;
  perMatch.filter(x => x.total >= 5).forEach(x => {
    if(!surprise || x.share < surprise.share || (x.share === surprise.share && x.exact.length < surprise.exact.length)) surprise = x;
  });
  let rare = null;
  perMatch.filter(x => x.total >= 5 && x.exact.length > 0).forEach(x => {
    if(!rare || x.exact.length < rare.exact.length) rare = x;
  });
  if(rare && rare.exact.length / rare.total > 0.35) rare = null;

  const exactCount = {};
  perMatch.forEach(x => x.exact.forEach(e => { exactCount[e.pid] = (exactCount[e.pid] || 0) + 1; }));
  const maxExact = Math.max(0, ...Object.values(exactCount));
  const hunters = maxExact >= 2 ? Object.keys(exactCount).filter(id => exactCount[id] === maxExact).map(id => PARTICIPANTS.find(p => p.id === id).name) : [];

  const FONT = "Vazirmatn, Tahoma, sans-serif";
  try{ await document.fonts.load(`bold 20px Vazirmatn`); await document.fonts.load(`16px Vazirmatn`); }catch(e){}

  const W = 480, PAD = 28, SC = 8;
  const meas = document.createElement("canvas").getContext("2d");
  meas.direction = "rtl";
  const wrap = (txt, font, maxW) => {
    meas.font = font;
    const lines = []; let cur = "";
    String(txt).split(" ").forEach(w => {
      const t = cur ? cur + " " + w : w;
      if(cur && meas.measureText(t).width > maxW){ lines.push(cur); cur = w; } else cur = t;
    });
    if(cur) lines.push(cur);
    return lines;
  };

  const cmds = [];
  let y = 0;
  const text = (t, x, yy, font, color, align = "right") => cmds.push({ t, x, y: yy, font, color, align });
  const line = yy => cmds.push({ line: true, y: yy });
  const section = title => {
    y += 30; line(y - 8); y += 14;
    text(title, W - PAD, y, `bold 16px ${FONT}`, "#E4C860"); y += 10;
  };
  const para = (txt, color = "#EAF0EC", size = 15) => {
    wrap(txt, `${size}px ${FONT}`, W - PAD * 2).forEach(l => { y += size + 9; text(l, W - PAD, y, `${size}px ${FONT}`, color); });
  };

  y = 54;
  text("🏆 کارت هفته", W - PAD, y, `bold 28px ${FONT}`, "#E4C860");
  y += 30; text(weekLabel, W - PAD, y, `bold 17px ${FONT}`, "#EAF0EC");
  y += 24; text(`${rangeLabel} — ${toPersianDigits(ms.length)} مسابقه دارای نتیجه`, W - PAD, y, `14px ${FONT}`, "#9CAA9F");

  section("نفرات برتر هفته");
  podium.forEach(r => {
    y += 34;
    const medal = r.rank === 1 ? "🥇" : r.rank === 2 ? "🥈" : "🥉";
    text(`${medal} ${r.name}`, W - PAD, y, `bold 18px ${FONT}`, "#E4C860");
    text(`${toPersianDigits(r.points)} امتیاز`, PAD, y, `17px ${FONT}`, "#EAF0EC", "left");
  });

  if(risers.length > 0 || fallers.length > 0){
    section("صعود و سقوط روز");
    risers.forEach(r => para(`▲ ${r.name}  (${toPersianDigits(r.d)}+ رتبه)`, "#7FC79E", 15));
    fallers.forEach(r => para(`▼ ${r.name}  (${toPersianDigits(-r.d)}- رتبه)`, "#E0836C", 15));
  }

  if(surprise){
    section("غافلگیری هفته");
    para(`${surprise.m.home} ${scoreText(surprise.m.homeScore, surprise.m.awayScore)} ${surprise.m.away}`, "#EAF0EC", 16);
    para(surprise.scored === 0
      ? `هیچ‌کدام از ${toPersianDigits(surprise.total)} نفر امتیاز نگرفتند.`
      : `فقط ${toPersianDigits(surprise.scored)} نفر از ${toPersianDigits(surprise.total)} نفر امتیاز گرفتند.`, "#9CAA9F", 14);
  }
  if(rare){
    section("نادرترین پیش‌بینی دقیق");
    para(rare.exact.map(e => e.name).join("، "), "#EAF0EC", 16);
    para(`نتیجه‌ی ${rare.m.home} - ${rare.m.away} را دقیق زدند (${scoreText(rare.m.homeScore, rare.m.awayScore)}) — فقط ${toPersianDigits(rare.exact.length)} نفر از ${toPersianDigits(rare.total)} نفر.`, "#9CAA9F", 14);
  }
  if(hunters.length > 0){
    section("شکارچی نتیجه‌ی دقیق");
    para(hunters.join("، "), "#EAF0EC", 16);
    para(`${toPersianDigits(maxExact)} پیش‌بینی دقیق در این هفته`, "#9CAA9F", 14);
  }

  y += 44;
  text("هنگویه اسپورت", W / 2, y, `13px ${FONT}`, "#6B7A6E", "center");
  const H = y + 22;

  const canvas = document.createElement("canvas");
  canvas.width = W * SC; canvas.height = H * SC;
  const ctx = canvas.getContext("2d");
  ctx.scale(SC, SC);
  ctx.direction = "rtl";
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#152018"); bg.addColorStop(1, "#0E1712");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  cmds.forEach(c => {
    if(c.line){
      ctx.strokeStyle = "#2A3A2E"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(20, c.y); ctx.lineTo(W - 20, c.y); ctx.stroke();
    }else{
      ctx.font = c.font; ctx.fillStyle = c.color; ctx.textAlign = c.align;
      ctx.fillText(c.t, c.x, c.y);
    }
  });

  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = `کارت-هفتگی-${weekLabel}.png`;
  a.click();
}

function periodHighlights(ms){
  const perMatch = ms.map(m => {
    const c = crowdForMatch(m);
    const scored = c.entries.filter(e => calcPoints({ h: e.h, a: e.a }, m) > 0).length;
    const exact = c.entries.filter(e => calcPoints({ h: e.h, a: e.a }, m) === 20);
    return { m, total: c.total, scored, exact, share: c.total ? scored / c.total : 1 };
  });
  let surprise = null;
  perMatch.filter(x => x.total >= 5).forEach(x => {
    if(!surprise || x.share < surprise.share || (x.share === surprise.share && x.exact.length < surprise.exact.length)) surprise = x;
  });
  let rare = null;
  perMatch.filter(x => x.total >= 5 && x.exact.length > 0).forEach(x => {
    if(!rare || x.exact.length < rare.exact.length) rare = x;
  });
  if(rare && rare.exact.length / rare.total > 0.35) rare = null;
  const exactCount = {};

  const hunters = maxExact >= 2
    ? Object.keys(exactCount).filter(id => exactCount[id] === maxExact).map(id => PARTICIPANTS.find(p => p.id === id).name)
    : [];

}

function buildWhatsappText(scope){
  let t = "all", mo = null, wk = null, title, sub, noun;
  if(scope.type === "week"){
    wk = scope.week; noun = "هفته";
    title = scope.weekLabel;
  }else if(scope.type === "month"){
    mo = scope.month; noun = "ماه";
    title = "ماه " + scope.month;
  }else{
    t = scope.tournament || "all"; noun = "فصل";
    title = t === "all" ? "کل فصل" : t;
  }
  const inScope = m =>
    (t === "all" || m.tournament === t) &&
    (!mo || getMatchMonthName(m) === mo) &&
    (!wk || (getMatchWeekInfo(m) && getMatchWeekInfo(m).key === wk));

  const { standings, matchesCount } = computeStandings(t, mo, wk);
  if(matchesCount === 0) return null;
  const allInScope = state.matches.filter(inScope);
  const pending = allInScope.filter(m => !matchHasResult(m)).length;

  if(scope.type === "week"){
    const first = allInScope[0] ? getMatchWeekInfo(allInScope[0]) : null;
    sub = `${first ? first.label + " • " : ""}${toPersianDigits(matchesCount)} مسابقه دارای نتیجه`;
  }else{
    sub = `بر اساس ${toPersianDigits(matchesCount)} مسابقه دارای نتیجه`;
  }

  const lines = [];
  lines.push(`🏆 *جدول ${title}*`);
  lines.push(`📅 ${sub}`);
  lines.push("");

  // رتبه‌ی ۵ نفر برتر (در رتبه‌ی مشترک همه‌ی هم‌رتبه‌ها می‌آیند، حداکثر ۸ نفر)
  lines.push("*رتبه‌بندی ۵ نفر برتر*");
  standings.filter(r => r.rank <= 5).slice(0, 8).forEach(r => {
    const mark = r.rank === 1 ? "🥇" : r.rank === 2 ? "🥈" : r.rank === 3 ? "🥉" : `${toPersianDigits(r.rank)}.`;
    lines.push(`${mark} *${r.name}* — ${toPersianDigits(r.points)} امتیاز`);
  });
  if(pending > 0){
    lines.push("");
    lines.push(`⏳ ${toPersianDigits(pending)} مسابقه‌ی این ${noun} هنوز نتیجه ندارد و جدول ممکن است تغییر کند.`);
  }

  // صعود و سقوط: ۳ نفر
  let dl = rankDeltas(t, mo, wk), dlScope = "";
  if(!dl && scope.type !== "season"){ dl = rankDeltas("all"); dlScope = " (در جدول کل فصل)"; }
  if(dl){
    const nameOf = id => PARTICIPANTS.find(p => p.id === id).name;
    const ids = Object.keys(dl.map);
    const step = n => n === 1 ? "۱ پله" : `${toPersianDigits(n)} پله`;
    const risers = ids.filter(id => dl.map[id] > 0)
      .sort((a, b) => dl.map[b] - dl.map[a] || dl.curRank[a] - dl.curRank[b]).slice(0, 3);
    const fallers = ids.filter(id => dl.map[id] < 0)
      .sort((a, b) => dl.map[a] - dl.map[b] || dl.curRank[a] - dl.curRank[b]).slice(0, 3);
    if(risers.length){
      lines.push("");
      lines.push("📈 *بیشترین صعود*");
      lines.push(`_نسبت به قبل از مسابقات ${dl.latestLabel}${dlScope}_`);
      risers.forEach(id => lines.push(`• *${nameOf(id)}* — ${step(dl.map[id])} بالا آمد (از رتبه‌ی ${toPersianDigits(dl.prevRank[id])} به ${toPersianDigits(dl.curRank[id])})`));
    }
    if(fallers.length){
      lines.push("");
      lines.push("📉 *بیشترین سقوط*");
      if(!risers.length) lines.push(`_نسبت به قبل از مسابقات ${dl.latestLabel}${dlScope}_`);
      fallers.forEach(id => lines.push(`• *${nameOf(id)}* — ${step(-dl.map[id])} پایین آمد (از رتبه‌ی ${toPersianDigits(dl.prevRank[id])} به ${toPersianDigits(dl.curRank[id])})`));
    }
  }

  // نکته‌های جذاب
  const hl = periodHighlights(filteredPlayedMatches(t, mo, wk));
  if(hl.surprise){
    const s = hl.surprise;
    lines.push("");
    lines.push(`😱 *غافلگیری ${noun}*`);
    lines.push(`${s.m.home} ${scoreText(s.m.homeScore, s.m.awayScore)} ${s.m.away}`);
    lines.push(s.scored === 0
      ? `هیچ‌کدام از ${toPersianDigits(s.total)} نفر امتیاز نگرفتند.`
      : `فقط ${toPersianDigits(s.scored)} نفر از ${toPersianDigits(s.total)} نفر امتیاز گرفتند.`);
  }
  if(hl.rare){
    const r = hl.rare;
    lines.push("");
    lines.push("🎯 *نادرترین پیش‌بینی دقیق*");
    lines.push(r.exact.map(e => e.name).join("، "));
    lines.push(`نتیجه‌ی ${r.m.home} - ${r.m.away} را دقیق زدند (${scoreText(r.m.homeScore, r.m.awayScore)}) — فقط ${toPersianDigits(r.exact.length)} نفر از ${toPersianDigits(r.total)} نفر.`);
  }
  if(hl.hunters.length){
    lines.push("");
    lines.push("🔥 *شکارچی نتیجه‌ی دقیق*");
    lines.push(hl.hunters.join("، "));
    lines.push(`${toPersianDigits(hl.maxExact)} پیش‌بینی دقیق در این ${noun}`);
  }

  lines.push("");
  lines.push("_هنگویه اسپورت_");
  return lines.join("\n");
}

// خروجی فایل متنی ساده (TXT): جدول کامل همه‌ی نفرات برای فصل / ماه / هفته
function exportTableTxt(scope, fileBase){
  let t = "all", mo = null, wk = null, title;
  if(scope.type === "week"){ wk = scope.week; title = scope.weekLabel; }
  else if(scope.type === "month"){ mo = scope.month; title = "ماه " + scope.month; }
  else{ t = scope.tournament || "all"; title = t === "all" ? "کل فصل" : t; }
  const { standings, matchesCount } = computeStandings(t, mo, wk);
  if(matchesCount === 0){ showToast("هنوز نتیجه‌ای برای این بخش ثبت نشده"); return; }
  const n = toPersianDigits, nameW = Math.max(...standings.map(r => r.name.length));
  const lines = [`جدول ${title}`, `بر اساس ${n(matchesCount)} مسابقه دارای نتیجه`, ""];
  standings.forEach(r => lines.push(`${n(r.rank)}. ${r.name} — ${n(r.points)} امتیاز`));
  const text = lines.join("\r\n");
  const blob = new Blob(["\uFEFF" + text], { type: "text/plain;charset=utf-8" }), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = String(fileBase).replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, "-") + ".txt"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast("فایل TXT ساخته شد");
}
function ucWaText(w){
  const br = ucBracket(), c = ucInit(), n = toPersianDigits, nm = ucName, L = [];
  const title = w < 3 ? "مرحله‌ی گروهی، هفته‌ی " + n(w + 1) : ["یک‌هشتم نهایی", "یک‌چهارم نهایی", "نیمه‌نهایی", "فینال"][w - 3];
  L.push(`🏆 *فرامرزان کاپ — ${title}* (هفته ${n(c.startWeek + w)})`, "");
  let any = false;
  const mt = m => {
    if(!m.played) return `▫️ ${m.a ? nm(m.a) : m.labA} ⏳ ${m.b ? nm(m.b) : m.labB}`;
    any = true;
    return `${m.winner === m.a ? "✅" : "▫️"} ${nm(m.a)} *${n(m.pa)}* – *${n(m.pb)}* ${nm(m.b)}${m.winner === m.b ? " ✅" : ""}`;
  };
  if(w < 3){
    br.gs.forEach((G, g) => {
      if(!G) return;
      L.push(`*گروه ${UC_LETTERS[g]}*`);
      G.games.filter(x => x.wk === w + 1).forEach(x => L.push(mt({ a: x.a, b: x.b, pa: x.pa, pb: x.pb, played: x.played, winner: x.done ? (x.pa > x.pb ? x.a : x.pb > x.pa ? x.b : null) : null })));
      G.rows.forEach((r, k) => L.push(`${n(k + 1)}. ${nm(r.pid)} — ${n(r.pts)} امتیاز (تفاضل ${n(r.diff)})`));
      L.push("");
    });
  }else{
    if(w === 6){ L.push("*فینال*", mt(br.fin), "", "*دیدار رده‌بندی (مقام سوم)*", mt(br.third)); }
    else [br.r16, br.qf, br.sf][w - 3].forEach(m => L.push(mt(m)));
    if(w === 6 && br.champion){ L.push("", `🏆 *قهرمان: ${nm(br.champion)}*`); if(br.runner) L.push(`🥈 نائب قهرمان: ${nm(br.runner)}`); if(br.thirdPlace) L.push(`🥉 سوم: ${nm(br.thirdPlace)}`); if(br.fourth) L.push(`چهارم: ${nm(br.fourth)}`); }
  }
  return any ? L.join("\n").trim() : null;
}

// خلاصه‌ی هفته‌ها: بازه‌ی شماره‌ی بازی‌ها، تعداد بازی‌های ثبت‌شده و وضعیت هر هفته
function renderWeekSummaryCard(){
  if(!state.matches.length) return "";
  const n = toPersianDigits, wl = getWeekList();
  const stats = new Map(wl.map(w => [w.key, { w, total: 0, played: 0, min: Infinity, max: 0 }]));
  let noWeek = 0;
  state.matches.forEach(m => {
    const wi = getMatchWeekInfo(m); if(!wi){ noWeek++; return; }
    const o = stats.get(wi.key); if(!o) return;
    o.total++; if(matchHasResult(m)) o.played++;
    if(wi.seq){ o.min = Math.min(o.min, wi.seq); o.max = Math.max(o.max, wi.seq); }
  });
  const rows = [...stats.values()].filter(o => o.total > 0).sort((a, b) => b.w.weekNumber - a.w.weekNumber).map(o => {
    const size = weekSizeOf(o.w), batch = !!size;
    const range = o.max ? `${n(o.min)} تا ${n(o.max)}` : "—";
    const count = batch ? `${n(o.total)} از ${n(size)}` : n(o.total);
    const done = o.played === o.total && (!batch || o.total >= size);
    const status = done ? `<span class="tag">تمام‌شده</span>` : `<span class="tag tag-blue">در جریان</span>`;
    const left = batch && o.total < size ? `<div class="meta">${n(size - o.total)} بازی تا تکمیل هفته مانده</div>` : "";
    return `<tr><td>${o.w.label}${left}</td><td>${range}</td><td>${count}</td><td>${n(o.played)}</td><td>${status}</td></tr>`;
  });
  const rowsLast = rows.slice(0, 1).join(""), rowsOld = rows.slice(1);
  const wkHead = `<thead><tr><th>هفته</th><th>شماره‌ی بازی‌ها</th><th>تعداد بازی</th><th>دارای نتیجه</th><th>وضعیت</th></tr></thead>`;
  return `
    <div class="card">
      <h2>وضعیت هفته‌ها</h2>
      <div class="points-legend" style="margin-bottom:8px;">هفته‌های ۱ تا ۱۱ بر اساس هفته‌ی تقویمی‌اند؛ هفته‌ی ۱۱ استثنائاً ${n(WEEK11_SIZE)} بازی دارد؛ از هفته‌ی ۱۲ هر ${n(WEEK_SIZE)} بازی (به ترتیب تاریخ) یک هفته است و هفته‌ی ۱۲ از بازی ${n(WEEK12_FIRST_MATCH)} شروع می‌شود.</div>
      <div style="overflow-x:auto;"><table>${wkHead}<tbody>${rowsLast}</tbody></table></div>

// ---------- ابزارهای کیفیت بالا برای کارت‌ها/جدول‌های تصویری ----------
const HQ_MAX_BYTES = 14 * 1024 * 1024; // سقف حجم هر عکس (زیر ۱۵ مگابایت)
function hqScale(W, H, maxS){
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua), android = /Android/i.test(ua);
  const cap = ios ? 16e6 : android ? 32e6 : 42e6; // سقف تعداد پیکسل (آیفون محدودیت سخت‌تری دارد)
  return Math.max(2, Math.min(14, Math.sqrt(cap / (W * H))));
}
// ذخیره‌ی PNG؛ اگر حجم از سقف بیشتر شد، تصویر را کمی کوچک‌تر می‌کند تا زیر ۱۵ مگابایت بماند (بدون ساخت مجدد)
function hqSave(cv, fileName){
  let cur = cv, factor = 1;
  const attempt = () => cur.toBlob(blob => {
    if(!blob) return showToast("ساخت عکس روی این دستگاه ناموفق بود");
    if(blob.size > HQ_MAX_BYTES && factor > 0.35){
      factor *= Math.max(0.5, Math.min(0.9, Math.sqrt(HQ_MAX_BYTES / blob.size) * 0.95));
      const c2 = document.createElement("canvas");
      c2.width = Math.round(cv.width * factor); c2.height = Math.round(cv.height * factor);
      const x2 = c2.getContext("2d"); x2.imageSmoothingEnabled = true; x2.imageSmoothingQuality = "high";
      x2.drawImage(cv, 0, 0, c2.width, c2.height);
      cur = c2; return attempt();
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = fileName; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }, "image/png");
  attempt();
}

  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  g = ctx.createRadialGradient(W * 0.1, H, 10, W * 0.1, H, 520); g.addColorStop(0, "rgba(190,90,255,0.28)"); g.addColorStop(1, "rgba(190,90,255,0)"); ctx.fillStyle = g; ctx.fillRect(0, H - 700, W, 700);
  ctx.strokeStyle = "rgba(255,255,255,0.045)"; ctx.lineWidth = 1;
  for(let i = -H; i < W; i += 46){ ctx.beginPath(); ctx.moveTo(i, H); ctx.lineTo(i + H, 0); ctx.stroke(); }

  const gt = "تعداد بازی: " + n(matchesCount); ctx.font = "bold 26px " + FONT; const gw = ctx.measureText(gt).width + 48;
  rr(W / 2 - gw / 2, 158, gw, 42, 21); ctx.fillStyle = "rgba(246,226,122,0.14)"; ctx.fill(); ctx.strokeStyle = "rgba(246,226,122,0.6)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#F6E27A"; ctx.fillText(gt, W / 2, 188);
