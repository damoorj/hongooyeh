      - name: Fetch standings
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: |
          node <<'JS'
          const fs = require("fs");
          const TOKEN = process.env.FD_TOKEN;
          if (!TOKEN) { console.error("FD_TOKEN secret is missing"); process.exit(1); }

          const CODES = ["PL", "PD", "BL1", "SA", "FL1", "CL"];
          let old = { leagues: {} };

          try {
            old = JSON.parse(fs.readFileSync("standings.json", "utf8"));
          } catch (e) {}

          const leagues = Object.assign({}, old.leagues || {});
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            for (const c of CODES) {
              try {
                const r = await fetch(
                  "https://api.football-data.org/v4/competitions/" + c + "/standings",
                  { headers: { "X-Auth-Token": TOKEN } }
                );

                if (!r.ok) {
                  console.error(c, "HTTP", r.status);
                  continue;
                }

                const j = await r.json();

                const tables = (j.standings || [])
                  .filter(s => s.type === "TOTAL")
                  .map(s => ({
                    group: s.group && s.group !== "null" &&
                      (j.standings || []).filter(x => x.type === "TOTAL").length > 1
                      ? String(s.group).replace(/_/g, " ")
                      : null,

                    rows: (s.table || []).map(t => ({
                      pos: t.position,
                      name: (t.team && (t.team.shortName || t.team.name)) || "",
                      full: (t.team && t.team.name) || "",
                      pl: t.playedGames,
                      w: t.won,
                      d: t.draw,
                      l: t.lost,
                      gf: t.goalsFor,
                      ga: t.goalsAgainst,
                      gd: t.goalDifference,
                      pts: t.points
                    }))
                  }));

                if (tables.length) leagues[c] = { tables };

              } catch (e) {
                console.error(c, String(e));
              }

              await sleep(7000);
            }

            const changed =
              JSON.stringify(old.leagues || {}) !== JSON.stringify(leagues);

            fs.writeFileSync(
              "standings.json",
              JSON.stringify({
                updated: new Date().toISOString(),
                leagues
              })
            );

            console.log(
              changed
                ? "standings changed and timestamp updated"
                : "no table changes; timestamp updated"
            );

          })();
          JS
